# gitleaks (T1.8; SA-4-8): the default rules, on every file of the repository but build output,
# installed dependencies and git's own folder. No secret is ever committed; dev secrets are generated
# at each stack start (backend rules section 8).
title = "Wiser Compliance Register"

[extend]
useDefault = true

[[allowlists]]
description = "build output, installed dependencies, git internals"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''(^|/)\.venv/''',
  '''(^|/)\.suite-reports/''',
]

# False positive (block 111-B4, owner decision on issue 20): the example value of `source_event_key` in the frozen monitoring and ict-risk contracts, and in the types generated from them.
[[allowlists]]
description = "the fake example value nimbus-incident-4471 in the synced OpenAPI contracts and their generated types"
condition = "AND"
targetRules = ["generic-api-key"]
paths = ['''(^|/)contracts/([^/]+\.openapi\.yaml|generated/[^/]+\.types\.ts)$''']
regexes = ['''^nimbus-incident-4471$''']
