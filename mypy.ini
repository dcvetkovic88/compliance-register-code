# Root mypy configuration of every Python path (plan D23; conventions SA-4-3, backend-rules SA-2.5-1; T1.9).
# Strict everywhere. tools/quality type-checks test folders with three relaxations, so pytest fixtures
# and test functions may stay unannotated: --allow-untyped-defs, --allow-incomplete-defs and
# --allow-untyped-calls; every other strict check applies to them.
[mypy]
python_version = 3.12
strict = True
exclude = (^|/)fixtures/
