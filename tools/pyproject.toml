[project]
name = "repo-tools"
version = "0.1.0"
description = "Repository checks of the Wiser Compliance Register: the suites registry, its runner and the Python quality tools"
requires-python = "==3.12.*"
dependencies = ["pyyaml==6.0.3"]

[dependency-groups]
dev = [
    "import-linter==2.16",
    "mutmut==3.8.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "types-PyYAML==6.0.12.20261113",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fixtures"]
markers = [
    "suite_111_B1: check suite 111-B1 (repository root and suites registry)",
    "suite_111_B1b: check suite 111-B1b (quality tooling, Java and repository)",
    "suite_111_B1c: check suite 111-B1c (quality tooling, Python, TypeScript and contracts)",
]
