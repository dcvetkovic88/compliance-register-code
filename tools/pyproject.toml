[project]
name = "repo-tools"
version = "0.1.0"
description = "Repository checks of the Wiser Compliance Register: the suites registry and its runner"
requires-python = "==3.12.*"
dependencies = ["pyyaml==6.0.3"]

[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["fixtures"]
markers = ["suite_111_B1: check suite 111-B1 (repository root and suites registry)"]
