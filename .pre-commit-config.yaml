# pre-commit (T1.8; SA-4-10): the format check, lint and secrets scan before each commit, and the
# Conventional Commits check of the message. Install once:
#   uv tool run --from pre-commit==4.7.0 pre-commit install --hook-type pre-commit --hook-type commit-msg
# The hooks check Java, the language whose tools have landed (block 1b); block 1c adds TypeScript and Python.
repos:
  - repo: local
    hooks:
      - id: format-check
        name: format check
        entry: tools/quality format-check java
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: lint
        name: lint
        entry: tools/quality lint java
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: gitleaks
        name: secrets scan
        entry: tools/gitleaks
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commitlint
        name: Conventional Commits
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]
