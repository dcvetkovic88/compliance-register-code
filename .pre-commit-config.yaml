# pre-commit (T1.8; SA-4-10): the format check, lint and secrets scan before each commit, and the
# Conventional Commits check of the message. Install once:
#   uv tool run --from pre-commit==4.7.0 pre-commit install --hook-type pre-commit --hook-type commit-msg
# The hooks check Java (block 1b), Python and TypeScript (block 1c).
repos:
  - repo: local
    hooks:
      - id: format-check
        name: format check
        entry: tools/quality format-check java
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: lint
        name: lint
        entry: tools/quality lint java
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: python-format-check
        name: Python format check
        entry: tools/quality format-check python
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: python-lint
        name: Python lint
        entry: tools/quality lint python
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: typescript-format-check
        name: TypeScript format check
        entry: tools/quality format-check typescript
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: typescript-lint
        name: TypeScript lint
        entry: tools/quality lint typescript
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: gitleaks
        name: secrets scan
        entry: tools/gitleaks
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commitlint
        name: Conventional Commits
        entry: npx --no -- commitlint --edit
        language: system
        stages: [commit-msg]
