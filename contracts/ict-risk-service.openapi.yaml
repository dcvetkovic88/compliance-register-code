                 effective_residual, controls_not_effective, in_breach, breach_state, accepted_until,
                 rated_under_version_id, pending_proposal_count]
      properties:
        id: {type: string, format: uuid}
        reference: {type: [string, 'null']}
        title: {type: string}
        category: {type: string}
        threat: {type: [string, 'null']}
        vulnerability: {type: [string, 'null']}
        owner_subject: {type: string, format: uuid}
        state: {type: string, enum: [identified, assessed, treated, accepted, closed]}
        inherent:
          oneOf: [{$ref: '#/components/schemas/Rating'}, {type: 'null'}]
        expected_residual:
          oneOf: [{$ref: '#/components/schemas/Rating'}, {type: 'null'}]
        effective_residual:
          oneOf: [{$ref: '#/components/schemas/Rating'}, {type: 'null'}]
        controls_not_effective: {type: array, items: {$ref: '#/components/schemas/NotEffectiveControl'}}
        in_breach: {type: boolean}
        breach_state: {type: [string, 'null'], enum: [open, treatment_decided, null]}
        accepted_until: {type: [string, 'null'], format: date}
        rated_under_version_id: {type: [string, 'null'], format: uuid}
        pending_proposal_count: {type: integer, minimum: 0}
      example:
        id: 7c3a1e95-2d4b-4f8a-b6e0-9d1c5a7f3b28
        reference: R-03
        title: Card payments unavailable due to hosting provider outage
        category: availability_and_continuity
        threat: Provider data centre outage
        vulnerability: Single-region hosting
        owner_subject: 0e5b8d24-7a1c-4f3e-9b62-4d8a1c7e5f90
        state: assessed
        inherent: {likelihood: 4, impact: 4, score: 16, band: critical}
        expected_residual: {likelihood: 2, impact: 2, score: 4, band: low}
        effective_residual: {likelihood: 4, impact: 4, score: 16, band: critical}
        controls_not_effective: [{control_id: 1c9e7b52-6d3a-4a8f-b2e1-0f5d4c7a9b36, status: failing, impairment_ids: [5d2f8a61-3b9c-4e7a-a0d4-8c6e1f2b9a73]}]
