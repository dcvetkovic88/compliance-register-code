openapi: 3.1.0
info:
  title: ict-risk-service API (standalone register build, draft)
  version: 0.1.0-draft
  description: >
    Draft for the standalone ict-risk-service: the 107 S1 operations the demo needs (assets,
    methodology, risks with effective residual, heat map, treatments, campaigns, management summary),
    derived from specs/107-ict-risk-register/contracts/covenant-console.openapi.yaml at draft level,
    plus 107-F1 (asset links, graph inputs) and 107-F2 (proposals, impairments, bindings, residual
    observations) and the 104-F7 dashboard summary. Standalone build, constitution Article IX; frozen
    at planning-done (IX.2). Ids are uuid strings. Effective residual is computed at read time (107 FR4).
    Status: DRAFT | Added 2026-11-04 by decision of Dusan (Raiffeisen Demo Decisions and Build Brief).
    AMENDED 2026-11-04 (independent review H5): applyApproval added, the synchronous delivery of 109-F4 decisions (109-F4-FR10).
    AMENDED 2026-11-04: getAssetInventoryCompleteness added for 107-F0 (107 FR1 inventory completeness had no read operation).
    x-roles lists L1 section 2 role ids; the authoritative binding of 107 FR0 rights is 109-F1.
    AMENDED 2026-11-05: x-roles aligned with the 109-F1 matrix (P39 reads without legal; P42, P48, P50
    compliance only; P43 and P44 security and it-governance; P40 import adds security); getAssetGraphInputs
    keeps legal because it feeds the 104-F4 graph (P29). Reason: cross-file reconciliation, 109-F1 wins.
    AMENDED 2026-11-05 (Dusan decisions Q-026, Q-027): createMethodologyVersion refuses a second draft
    (ICT_METHODOLOGY_DRAFT_PENDING 409); applyApproval refuses a risk acceptance whose breach state changed
    since the request (ICT_RISK_CHANGED_SINCE_REQUEST 409, approval recorded stale; the maker re-submits).
    AMENDED 2026-11-05 (Dusan decision Q-104): the bank's management body approves the ICT risk methodology;
    compliance records it under four-eyes. attachMethodologyBodyDecision added (body name, decision date,
    decision document stored as evidence); MethodologyVersion gains body_decision; applyApproval refuses an
    approve on methodology_approval without it in production mode (ICT_METHODOLOGY_BODY_DECISION_MISSING 409).
    AMENDED 2026-11-05 (foundation T0.2, dcvetkovic88/compliance-register#1): servers entry for the local Docker Compose stack, port 8082 after register-service 8081 in the service order of L1 section 3.
    AMENDED 2026-11-06 (Dusan decision X2, 109-F4-FR10; docs/analyze-2026-11-06.md 107-F0 H1, H2, M): one approval path.
    approveMethodologyVersion is replaced by the maker submit call submitMethodologyVersion (path /submit, it-governance,
    the author, P41) and signOffCampaign by submitCampaignSignOff (it-governance, the campaign creator, P46); both
    create the pending 109-F4 approval and return 202; the checker decides only through platform decideApproval,
    applied by applyApproval; decideTreatment returns 202 for accept (pending risk_acceptance) and its x-roles drop
    compliance (the P45 checker decides through decideApproval). The one-pending rule
    reads "at most one methodology version with a pending methodology_approval per tenant" (Q-026). The body decision
    is written as evidence of type ict-risk-methodology anchored to every active obligation that lists that type
    (Confirmed by Dusan 2026-11-06). Production mode means demo_mode false in the tenant configuration (109-F2).
    AMENDED 2026-11-06 (107-F0 speckit-analyze I1, U1): ICT_METHODOLOGY_BODY_DECISION_MISSING added to the problem code
    enum (it was named by applyApproval but missing); rateCampaignItem refuses with 409 ICT_CAMPAIGN_SIGNOFF_PENDING
    while a sign-off approval is pending (new code) and documents its 409 responses.
    AMENDED 2026-11-06 (107-F1 speckit-clarify, docs/analyze-2026-11-06.md 107-F1 M): getAssetGraphInputs names the
    caller identity service:register (was bare service), x-surface user | service and x-action P29 (109-F1, the graph
    read that keeps legal), and states that ids unknown in the caller's tenant are omitted; Asset and AssetGraphInput
    gain register_verified (false when register-service could not be reached, 107-F1-FR8, AC8); ICT_TARGET_RETIRED
    also refuses a new link on a retired asset (107-F1-FR5, AC9).
    AMENDED 2026-11-06 (107-F2 speckit-clarify, docs/analyze-2026-11-06.md 107-F2 H2, Confirmed by Dusan 2026-11-06,
    Q-160): every 107-F2 operation names its 109-F1 action: x-action P39 on listResidualObservations, listProposals,
    getProposal, listImpairments, listControlBindings and getIctRiskSummary; x-action P51 on confirmProposal,
    dismissProposal, closeImpairment, createControlBinding and deleteControlBinding; listControlBindings x-roles
    aligned with the P39 roles (outsourcing-manager and compliance added).
    AMENDED 2026-11-06 (107-F0 speckit-plan, independent analyze final-107-F0-p1 U1): applyApproval states the
    109-F4 D10 commit-on-refusal rule and the result-to-code mapping per kind and documents its 403; the problem
    code enum gains the relayed platform codes PLATFORM_NOT_IN_MATRIX, PLATFORM_APPROVAL_STALE and
    PLATFORM_APPROVAL_NOT_PENDING.
    AMENDED 2026-11-06 (107-F1 speckit-plan, independent analyze final-107-F1-p1 G1, U1, I2, L2): listAssets and
    getAsset carry x-action P39, createAsset, updateAsset and importAssets P40; updateAsset validates only the links
    added relative to the stored set; importAssets resolves link columns through register-service
    lookupRegisterRecords by identification code and function identifier and is refused as a whole with 503
    ICT_REGISTER_UNAVAILABLE when the file carries link values and the register cannot be reached.
    AMENDED 2026-11-06 (107-F1 speckit-plan, independent analyze final-107-F1-p2 F1, decision of Dusan 2026-11-06,
    gate close-out): AssetGraphInput any_in_breach is nullable; highest_effective_band and any_in_breach are null
    (unknown) when ControlStatusPort cannot answer, including while register-service is unreachable, consistent with
    107-F0-FR4 (ICT_CONTROL_UNAVAILABLE); open_risk_count is still returned and getAssetGraphInputs does not fail.
    AMENDED 2026-11-06 (107-F1 speckit-plan, independent analyze closeout-107-F1-t1 U1, I1, decision of Dusan
    2026-11-06, gate close-out): AssetGraphInput states one outage rule for every asset (highest_effective_band and
    any_in_breach null even when open_risk_count is 0; with control statuses readable, no open risk gives band null
    and any_in_breach false); getAssetGraphInputs names its user callers as the P29 roles other than requester.
servers:
  - url: http://localhost:8082
    description: ict-risk-service in the local Docker Compose stack
security:
  - bearerAuth: []
tags:
  - name: assets
  - name: methodology
  - name: risks
  - name: campaigns
  - name: proposals
  - name: summary
paths:
  /api/v1/ict-risk/assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: Assets ordered name asc, id asc (107 FR1, 107-F1)
      x-roles: [outsourcing-manager, security, it-governance, compliance, auditor]
      x-action: P39
      x-surface: user
      x-audit-object: ict-risk:assets
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: lifecycle, in: query, required: false, schema: {type: string, enum: [planned, active, retired]}}
        - {name: provider_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: function_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Page of assets
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Asset'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createAsset
      tags: [assets]
      x-roles: [it-governance, security]
      x-action: P40
      x-surface: user
      x-audit-object: ict-risk:asset
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssetWrite'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/assets/{asset_id}:
    get:
      operationId: getAsset
      tags: [assets]
      x-roles: [outsourcing-manager, security, it-governance, compliance, auditor]
      x-action: P39
      x-surface: user
      x-audit-object: ict-risk:asset:{asset_id}
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/AssetId'}]
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Partial update; link arrays replace the stored direct links when present (107-F1 FR2)
      description: >
        Only links added relative to the stored set are validated against register-service and refused when unknown
        or retired; links already stored are kept as sent even when their target has since been retired, and links
        left out are removed. A PATCH that adds no link succeeds while register-service is unreachable (107-F1-FR5,
        FR8).
      x-roles: [it-governance, security]
      x-action: P40
      x-surface: user
      x-audit-object: ict-risk:asset:{asset_id}
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/AssetId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssetWrite'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Asset'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/assets/imports:
    post:
      operationId: importAssets
      tags: [assets]
      summary: CSV import, optional link columns (107 FR1, 107-F1 FR6); maximum 5 MB
      description: >
        Link column values (provider identification code, function identifier; several separated by semicolons) are
        resolved in one register-service lookupRegisterRecords call by provider_identification_codes and
        function_identifiers; a row with an unresolved, unknown or retired value is rejected with its row number and
        the value. When the file carries at least one link value and register-service cannot be reached, the whole
        import is refused with 503 ICT_REGISTER_UNAVAILABLE and nothing is stored (107-F1-FR6, FR8).
      x-roles: [it-governance, security]
      x-action: P40
      x-surface: user
      x-audit-object: ict-risk:asset-import
      x-scope: DEMO
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, contentMediaType: text/csv}
      responses:
        '201':
          description: Import result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssetImport'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/assets/exports:
    post:
      operationId: exportAssets
      tags: [assets]
      summary: Inventory or classification export with evidence (107 FR7)
      x-roles: [it-governance, compliance]
      x-surface: user
      x-audit-object: ict-risk:asset-export
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [view]
              properties:
                view: {type: string, enum: [inventory, classification]}
            example: {view: inventory}
      responses:
        '201':
          description: Export with artifacts and evidence outcomes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IctExport'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/assets/graph-inputs:
    get:
      operationId: getAssetGraphInputs
      tags: [assets]
      summary: Batch asset read and impact propagation inputs for the 104-F4 dependency map (107-F1 FR4); at most one of asset_ids or provider_id, none for all
      description: >
        Read-only. Caller is the 104-F4 InventoryClient as service:register, or a user of a 109-F1 P29 (graph read)
        role other than requester, which reaches the graph only through register-service (107-F1 plan D-8). Ids that do not exist in the caller's tenant, including ids of another tenant, are omitted from items,
        exactly as unknown ids (107-F1 edge cases, AC9). When register-service cannot be reached the asset facts are
        still returned with register_verified false and retired_targets empty (107-F1-FR8, AC8). When control statuses
        cannot be read, open_risk_count is still returned and highest_effective_band and any_in_breach are null
        (unknown, 107-F0-FR4) for every asset read, including one with no open risk; the read does not fail.
      x-roles: [outsourcing-manager, security, it-governance, compliance, legal, auditor, service:register]
      x-action: P29
      x-surface: user | service
      x-audit-object: ict-risk:asset-graph-inputs
      x-scope: DEMO
      parameters:
        - name: asset_ids
          in: query
          required: false
          style: form
          explode: false
          schema: {type: array, maxItems: 500, items: {type: string, format: uuid}}
        - {name: provider_id, in: query, required: false, schema: {type: string, format: uuid}, description: assets directly linked to this provider}
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of asset graph inputs, ordered asset id asc
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, methodology_version_id]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AssetGraphInput'}}
                  next_cursor: {type: [string, 'null']}
                  methodology_version_id: {type: string, format: uuid}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/assets/completeness:
    get:
      operationId: getAssetInventoryCompleteness
      tags: [assets]
      summary: >
        Inventory completeness of 107 FR1 computed at read time: share of active assets with a responsible person
        and a classification. Added 2026-11-04 for 107-F0 (base ICT risk register, standalone build).
      x-roles: [outsourcing-manager, security, it-governance, compliance, auditor]
      x-surface: user
      x-audit-object: ict-risk:asset-completeness
      x-scope: DEMO
      responses:
        '200':
          description: Completeness figures; incomplete_asset_ids ordered by asset id asc
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [as_of, active_assets, complete_assets, ratio, incomplete_asset_ids]
                properties:
                  as_of: {type: string, format: date-time}
                  active_assets: {type: integer, minimum: 0}
                  complete_assets: {type: integer, minimum: 0}
                  ratio: {type: [number, 'null'], minimum: 0, maximum: 1, description: null when there is no active asset}
                  incomplete_asset_ids: {type: array, items: {type: string, format: uuid}}
              example: {as_of: '2026-11-04T09:00:00Z', active_assets: 18, complete_assets: 17, ratio: 0.9444, incomplete_asset_ids: [3f1c9a52-7b2e-4d81-a6c0-9e5d2b8f4a17]}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/artifacts/{payload_sha256}:
    get:
      operationId: downloadIctArtifact
      tags: [assets]
      summary: Download an export, report or snapshot artifact by its hash
      x-roles: [outsourcing-manager, security, it-governance, compliance, auditor]
      x-surface: user
      x-audit-object: ict-risk:artifact:{payload_sha256}
      x-scope: DEMO
      parameters:
        - {name: payload_sha256, in: path, required: true, schema: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}}
      responses:
        '200':
          description: Artifact body
          content:
            application/json:
              schema: {type: object}
            text/csv:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/methodology/versions:
    get:
      operationId: listMethodologyVersions
      tags: [methodology]
      x-roles: [outsourcing-manager, security, it-governance, compliance, auditor]
      x-surface: user
      x-audit-object: ict-risk:methodology
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Versions ordered version desc
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/MethodologyVersion'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createMethodologyVersion
      tags: [methodology]
      x-roles: [it-governance]
      x-surface: user
      x-audit-object: ict-risk:methodology-version
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MethodologyConfig'}
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MethodologyVersion'}
        '409':
          description: Another methodology version of the tenant has a pending methodology_approval (ICT_METHODOLOGY_DRAFT_PENDING; one draft at a time, Q-026)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/methodology/versions/{version_id}/submit:
    post:
      operationId: submitMethodologyVersion
      tags: [methodology]
      summary: Submit a draft for approval (maker of the 109-F4 kind methodology_approval, the author only, 107 FR2); approved only through platform decideApproval and applyApproval
      description: >
        Maker submit call (Dusan decision 2026-11-06, X2; 109-F4-FR10). Only the author of the version may submit it;
        another user is refused (403). Creates the pending methodology_approval through platform.request_approval and
        records its id on the version; the version stays draft and the approved version stays active until the checker
        approves. 409 ICT_METHODOLOGY_DRAFT_PENDING when this or another version of the tenant already has a pending
        methodology_approval (Q-026); 409 when the version is not a draft. A draft whose approval was withdrawn or
        expired may be submitted again.
      x-roles: [it-governance]
      x-action: P41
      x-surface: user
      x-audit-object: ict-risk:methodology-version:{version_id}
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/VersionId'}]
      responses:
        '202':
          description: Pending methodology_approval created; the version carries approval_id
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MethodologyVersion'}
        '409':
          description: Not a draft, or a methodology_approval of the tenant is already pending (ICT_METHODOLOGY_DRAFT_PENDING)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/methodology/versions/{version_id}/body-decision:
    post:
      operationId: attachMethodologyBodyDecision
      tags: [methodology]
      summary: Attach the management body's decision to a draft pending methodology_approval (107-F0-FR7, Q-104)
      description: >
        The compliance checker records the approval of the bank's management body before approving through
        decideApproval (Dusan decision 2026-11-05, Q-104). The document is written as evidence of type
        ict-risk-methodology, one record per active obligation of the catalog that lists that type (in the NBS
        fixture: Sections 11 and 12), whether or not a control is mapped (Confirmed by Dusan 2026-11-06);
        body_decision.evidence lists the records. The body fields are not part of the approval subject version,
        so attaching does not make the approval stale. A new
        attachment replaces the reference on the version; the earlier evidence record stays (append-only).
        409 when the version is not a draft with a pending methodology_approval. The author of the version
        is refused (403), as for the approval itself.
      x-roles: [compliance]
      x-action: P42
      x-surface: user
      x-audit-object: ict-risk:methodology-version:{version_id}
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/VersionId'}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, body_name, decided_on]
              properties:
                file: {type: string, contentMediaType: application/pdf}
                body_name: {type: string, minLength: 1}
                decided_on: {type: string, format: date}
      responses:
        '200':
          description: Decision attached; the version carries body_decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MethodologyVersion'}
        '409':
          description: Version is not a draft pending methodology_approval
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/risks:
    get:
      operationId: listRisks
      tags: [risks]
      summary: Risks with effective residual computed at read time, ordered effective score desc, id asc
      x-roles: [outsourcing-manager, security, it-governance, compliance, auditor]
      x-surface: user
      x-audit-object: ict-risk:risks
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: band, in: query, required: false, schema: {$ref: '#/components/schemas/Band'}}
        - {name: basis, in: query, required: false, schema: {type: string, enum: [inherent, effective], default: effective}}
        - {name: category, in: query, required: false, schema: {type: string}}
        - {name: owner_subject, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: in_breach, in: query, required: false, schema: {type: boolean}}
        - {name: controls_not_effective, in: query, required: false, schema: {type: boolean}}
        - {name: likelihood, in: query, required: false, schema: {type: integer, minimum: 1}}
        - {name: impact, in: query, required: false, schema: {type: integer, minimum: 1}}
        - {name: asset_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: provider_id, in: query, required: false, schema: {type: string, format: uuid}, description: risks scoped to assets or functions of this provider (107-F2 FR1)}
      responses:
        '200':
          description: Page of risks
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, methodology_version_id]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Risk'}}
                  next_cursor: {type: [string, 'null']}
                  methodology_version_id: {type: string, format: uuid}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createRisk
      tags: [risks]
      x-roles: [it-governance, security]
      x-surface: user
      x-audit-object: ict-risk:risk
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RiskWrite'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/risks/heatmap:
    get:
      operationId: getRiskHeatmap
      tags: [risks]
      x-roles: [outsourcing-manager, security, it-governance, compliance, auditor]
      x-surface: user
      x-audit-object: ict-risk:heatmap
      x-scope: DEMO
      parameters:
        - {name: basis, in: query, required: true, schema: {type: string, enum: [inherent, effective]}}
        - {name: category, in: query, required: false, schema: {type: string}}
        - {name: owner_subject, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Heat map; cell counts equal listRisks counts for the same filter
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Heatmap'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/ict-risk/risks/{risk_id}:
    get:
      operationId: getRisk
      tags: [risks]
      x-roles: [outsourcing-manager, security, it-governance, compliance, auditor]
      x-surface: user
      x-audit-object: ict-risk:risk:{risk_id}
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/RiskId'}]
      responses:
        '200':
          description: Risk detail with controls, impairments and pending proposals
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RiskDetail'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateRisk
      tags: [risks]
      summary: Edit or re-rate (rating history source edit); never changes state except identified to assessed
