        likelihood_labels: {$ref: '#/components/schemas/LocalizedLabels'}
        impact_labels: {$ref: '#/components/schemas/LocalizedLabels'}
        bands:
          type: array
          items:
            type: object
            required: [band, min, max]
            properties:
              band: {$ref: '#/components/schemas/Band'}
              min: {type: integer, minimum: 1}
              max: {type: integer, minimum: 1}
        appetite_band: {$ref: '#/components/schemas/Band'}
        taxonomy: {type: array, minItems: 1, items: {type: string}}
        classification_scale:
          type: object
          required: [levels, labels]
          properties:
            levels: {type: integer, minimum: 2}
            labels: {$ref: '#/components/schemas/LocalizedLabels'}
        criticality_rule: {type: string, enum: [max]}
        acceptance_max_months: {type: integer, minimum: 1}
    MethodologyVersion:
      type: object
      required: [id, version, state, config, authored_by, approved_by, approved_at, evidence]
      properties:
        id: {type: string, format: uuid}
        approval_id: {type: [string, 'null'], format: uuid, description: platform approval id of the pending or last methodology_approval (submitMethodologyVersion)}
        version: {type: integer, minimum: 1}
        state: {type: string, enum: [draft, approved, superseded, rejected]}
        config: {$ref: '#/components/schemas/MethodologyConfig'}
        authored_by: {type: [string, 'null'], format: uuid, description: null for version 1 (system)}
        approved_by: {type: [string, 'null'], format: uuid}
        approved_at: {type: [string, 'null'], format: date-time}
        evidence: {type: array, items: {$ref: '#/components/schemas/EvidenceOutcome'}}
        body_decision:
          description: Management body decision recorded by compliance (Q-104, 107-F0-FR7); null until attached
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [body_name, decided_on, evidence]
              properties:
                body_name: {type: string}
                decided_on: {type: string, format: date}
                evidence:
                  type: array
                  minItems: 1
                  description: one ict-risk-methodology record per anchoring obligation (Confirmed by Dusan 2026-11-06)
                  items: {$ref: '#/components/schemas/EvidenceOutcome'}
    Rating:
      type: object
      required: [likelihood, impact, score, band]
      properties:
        likelihood: {$ref: '#/components/schemas/Level'}
        impact: {$ref: '#/components/schemas/Level'}
        score: {type: integer, minimum: 1}
        band: {$ref: '#/components/schemas/Band'}
    NotEffectiveControl:
