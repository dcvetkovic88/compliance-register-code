  /api/v1/ict-risk/approvals/{approval_id}/apply:
    post:
      operationId: applyApproval
      tags: [methodology]
      summary: Decide a pending 109-F4 approval of a subject this service owns and apply the change in one transaction (109-F4-FR10)
      description: >
        Called only by the platform decideApproval handler, synchronously, with the checker's identity
        (109-F4 plan D6). The service calls platform.decide_approval (role, delegation, identity and stale
        checks) and applies the proposed change in the same transaction, or does neither. Added 2026-11-04
        (independent review H5). For kind risk_acceptance the service recomputes the risk's breach state and,
        when it differs from in_breach_at_request in the approval's proposed change, refuses with 409
        ICT_RISK_CHANGED_SINCE_REQUEST ("risk changed since request"); the approval is recorded stale and the
        maker re-submits (Dusan decision 2026-11-05, Q-027). For kind methodology_approval in production mode
        (demo_mode false in the tenant configuration, 109-F2), an approve decision on a version without an attached
        management body decision is refused with 409 ICT_METHODOLOGY_BODY_DECISION_MISSING and the approval stays
        pending; in demo mode the compliance user's approval stands without it (Dusan decision 2026-11-05, Q-104;
        107-F0-FR7). Changes applied per kind (107-F0 plan D-2): methodology_approval approve sets the version
        approved and the previous approved version superseded and writes the 107 FR2 evidence, reject sets the
        version rejected; risk_acceptance approve writes the accept treatment with the checker as acceptor;
        ictrisk_campaign_signoff approve signs the campaign (signed_by the checker) and writes the snapshot, the
        rating write-back and the evidence. A reject of risk_acceptance or ictrisk_campaign_signoff changes no
        subject state. This is the only operation of the service that approves, accepts or signs off (X2).
        Refusal results of decide_approval commit (109-F4 plan D10): no subject change, the refusal audit event and
        any stale state persist, then the service answers refused_four_eyes with 409 ICT_SELF_APPROVAL (caller is
        the maker), ICT_ACCEPTOR_IS_OWNER (risk_acceptance, caller is the risk owner) or ICT_SIGNER_IS_ASSESSOR
        (ictrisk_campaign_signoff, caller rated or confirmed an item); refused_not_checker with 403
        PLATFORM_NOT_IN_MATRIX; stale with 409 ICT_RISK_CHANGED_SINCE_REQUEST (risk_acceptance) or
        PLATFORM_APPROVAL_STALE (other kinds); not_pending with 409 PLATFORM_APPROVAL_NOT_PENDING (107-F0 plan D-2).
      x-roles: [service:platform]
      x-surface: service
      x-audit-object: platform:approval
      x-scope: DEMO
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, reject]}
                reason: {type: [string, 'null'], maxLength: 2000, description: Required when decision is reject}
      responses:
        '200':
          description: Decision recorded; on approve the change is applied
          content:
            application/json:
              schema:
                type: object
                required: [approval_id, state]
                properties:
                  approval_id: {type: string, format: uuid}
                  state: {type: string, enum: [approved, rejected]}
                  subject_id: {type: string}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    AssetId: {name: asset_id, in: path, required: true, schema: {type: string, format: uuid}}
    RiskId: {name: risk_id, in: path, required: true, schema: {type: string, format: uuid}}
    CampaignId: {name: campaign_id, in: path, required: true, schema: {type: string, format: uuid}}
    VersionId: {name: version_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProposalId: {name: proposal_id, in: path, required: true, schema: {type: string, format: uuid}}
    ImpairmentId: {name: impairment_id, in: path, required: true, schema: {type: string, format: uuid}}
    BindingId: {name: binding_id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: Problem Details, RFC 9457 (api-standards section 5)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, error_code, correlation_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: [string, 'null']}
        error_code: {$ref: '#/components/schemas/IctRiskErrorCode'}
        correlation_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
      example:
        type: https://errors.wiser.local/ict-risk/acceptor-is-owner
        title: Acceptor is the risk owner
        status: 409
        detail: A risk cannot be accepted by its owner.
        error_code: ICT_ACCEPTOR_IS_OWNER
        correlation_id: 2a7d9c13-5e8b-4f1a-b6c0-3d9e2f7a1b54
    IctRiskErrorCode:
      type: string
      description: >
        107 S1 codes as in the suite draft, plus 107-F1 and 107-F2 codes:
        ICT_TARGET_RETIRED 422 (new link to a retired register record, or a new link on a retired asset; detail names
        the retired id); ICT_REGISTER_UNAVAILABLE 503 (write adding a link, or an import carrying link values, while register-service is down);
        ICT_PROPOSAL_DECIDED 409; ICT_SELECTION_EMPTY 422; ICT_NOTE_REQUIRED 422; ICT_IMPAIRMENT_CLOSED 409;
        ICT_BINDING_EXISTS 409; ICT_CONTROL_UNAVAILABLE 503 (ControlStatusPort unreachable);
        ICT_METHODOLOGY_DRAFT_PENDING 409 (Q-026); ICT_RISK_CHANGED_SINCE_REQUEST 409 (Q-027);
        ICT_METHODOLOGY_BODY_DECISION_MISSING 409 (Q-104, applyApproval in production mode);
        ICT_CAMPAIGN_SIGNOFF_PENDING 409 (rateCampaignItem while a sign-off approval is pending, 107-F0 edge cases);
        PLATFORM_NOT_IN_MATRIX 403, PLATFORM_APPROVAL_STALE 409 and PLATFORM_APPROVAL_NOT_PENDING 409 are platform
        decide_approval results that applyApproval relays (109-F4 plan D6, D10; 107-F0 plan D-2).
      enum: [AUTH_UNAUTHENTICATED, AUTH_FORBIDDEN, NOT_FOUND, VALIDATION_FAILED,
             ICT_SELF_APPROVAL, ICT_ACCEPTOR_IS_OWNER, ICT_SIGNER_IS_ASSESSOR,
             ICT_CAMPAIGN_INCOMPLETE, ICT_CAMPAIGN_SIGNED, ICT_SCALE_CHANGE_REFUSED,
             ICT_TAXONOMY_REMOVAL_REFUSED, ICT_EXPIRY_BEYOND_MAX, ICT_REASON_REQUIRED,
             ICT_RISK_CLOSED, ICT_INVALID_TRANSITION, ICT_RISK_NOT_RATED,
             ICT_IMPORT_UNREADABLE, ICT_IMPORT_TOO_LARGE, ICT_UNKNOWN_CONTROL,
             ICT_UNKNOWN_FUNCTION, ICT_UNKNOWN_PROVIDER, ICT_TARGET_RETIRED,
             ICT_REGISTER_UNAVAILABLE, ICT_PROPOSAL_DECIDED, ICT_SELECTION_EMPTY, ICT_NOTE_REQUIRED,
             ICT_IMPAIRMENT_CLOSED, ICT_BINDING_EXISTS, ICT_CONTROL_UNAVAILABLE,
             ICT_METHODOLOGY_DRAFT_PENDING, ICT_RISK_CHANGED_SINCE_REQUEST,
             ICT_METHODOLOGY_BODY_DECISION_MISSING, ICT_CAMPAIGN_SIGNOFF_PENDING,
             PLATFORM_NOT_IN_MATRIX, PLATFORM_APPROVAL_STALE, PLATFORM_APPROVAL_NOT_PENDING]
    EvidenceOutcome:
      type: object
      required: [obligation_id, outcome, evidence_id]
      properties:
        obligation_id: {type: string}
        outcome: {type: string, enum: [passed, failed, no_control_mapped]}
        evidence_id: {type: [string, 'null'], format: uuid}
    Artifact:
      type: object
      required: [name, media_type, payload_sha256]
      properties:
        name: {type: string}
        media_type: {type: string, enum: [application/json, text/csv]}
        payload_sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
    Band:
      type: string
      enum: [low, medium, high, critical]
    Level:
      type: integer
      minimum: 1
    ControlStatus:
      type: string
      enum: [satisfied, failing, stale, unknown]
    LinkTarget:
      type: object
      required: [id, retired]
      properties:
        id: {type: string, format: uuid}
        retired: {type: [boolean, 'null'], description: null when register-service could not be reached (unverified)}
    ProviderLink:
      type: object
      required: [id, retired, sources]
      properties:
        id: {type: string, format: uuid}
        retired: {type: [boolean, 'null']}
        sources:
          type: array
          minItems: 1
          items: {type: string, enum: [direct, engagement]}
    Classification:
      type: object
      required: [confidentiality, integrity, availability, classified_at]
      properties:
        confidentiality: {$ref: '#/components/schemas/Level'}
        integrity: {$ref: '#/components/schemas/Level'}
        availability: {$ref: '#/components/schemas/Level'}
        classified_at: {type: string, format: date}
    Asset:
      type: object
      required: [id, reference, name, asset_type, responsible_person, responsible_subject, lifecycle, classification,
                 criticality, functions, providers, engagements, register_verified, is_complete, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        reference: {type: [string, 'null']}
        name: {type: string}
        asset_type: {type: string, enum: [software, hardware, network, information]}
        responsible_person: {type: [string, 'null']}
        responsible_subject: {type: [string, 'null'], format: uuid}
        lifecycle: {type: string, enum: [planned, active, retired]}
        classification:
          oneOf:
            - $ref: '#/components/schemas/Classification'
            - {type: 'null'}
        criticality: {type: [integer, 'null'], minimum: 1}
        functions: {type: array, items: {$ref: '#/components/schemas/LinkTarget'}}
        providers: {type: array, items: {$ref: '#/components/schemas/ProviderLink'}}
        engagements:
          description: engagements touching the asset, read from register-service (104-F4 owns these links); empty when the register is unreachable
          type: array
          items:
            type: object
            required: [engagement_id, provider_id, access]
            properties:
              engagement_id: {type: string, format: uuid}
              provider_id: {type: string, format: uuid}
              access: {type: string, description: access level as defined by 104-F4}
        register_verified: {type: boolean, description: 'false when register-service could not be reached: link retired flags are null, engagements empty and only direct provider sources shown (107-F1-FR8)'}
        is_complete: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      example:
        id: 4f8a2c61-9d3e-4b7a-a1f5-6c0e2d8b3a97
        reference: A-07
        name: Card payments gateway
        asset_type: software
        responsible_person: Head of Payments IT
        responsible_subject: null
        lifecycle: active
        classification: {confidentiality: 3, integrity: 1, availability: 2, classified_at: '2026-06-30'}
        criticality: 3
        functions: [{id: 9b1e4d27-3c6a-4f8e-b0d2-7a5c1e9f4b63, retired: false}]
        providers: [{id: 3d1b7f8e-2a44-4f0e-9a4b-7c0b8e1d2f33, retired: false, sources: [direct]}]
        engagements: []
        register_verified: true
        is_complete: true
        created_at: '2026-11-04T10:00:00Z'
        updated_at: '2026-11-04T10:00:00Z'
    AssetWrite:
      type: object
      additionalProperties: false
      properties:
        reference: {type: [string, 'null']}
        name: {type: string, minLength: 1}
        asset_type: {type: string, enum: [software, hardware, network, information]}
        responsible_person: {type: [string, 'null']}
        responsible_subject: {type: [string, 'null'], format: uuid}
        lifecycle: {type: string, enum: [planned, active, retired]}
        confidentiality: {type: [integer, 'null'], minimum: 1}
        integrity: {type: [integer, 'null'], minimum: 1}
        availability: {type: [integer, 'null'], minimum: 1}
        classified_at: {type: [string, 'null'], format: date}
        function_ids: {type: array, items: {type: string, format: uuid}}
        provider_ids: {type: array, items: {type: string, format: uuid}, description: direct provider links only}
      example: {name: Card payments gateway, asset_type: software, lifecycle: active, provider_ids: [3d1b7f8e-2a44-4f0e-9a4b-7c0b8e1d2f33]}
    AssetImport:
      type: object
      required: [id, file_name, rows_total, rows_imported, rejections]
      properties:
        id: {type: string, format: uuid}
        file_name: {type: string}
        rows_total: {type: integer, minimum: 0}
        rows_imported: {type: integer, minimum: 0}
        rejections:
          type: array
          items:
            type: object
            required: [row, reason]
            properties:
              row: {type: integer, minimum: 1}
              reason: {type: string}
      example: {id: 1d7e3b52-9a4c-4f6e-b8d0-2c5a7e9f1b46, file_name: asset-import-links-01.csv, rows_total: 10, rows_imported: 9, rejections: [{row: 7, reason: 'unknown provider identification code PRV-X99'}]}
    IctExport:
      type: object
      required: [id, view, result, artifacts, evidence, methodology_version_id, created_at]
      properties:
        id: {type: string, format: uuid}
        view: {type: string, enum: [inventory, classification]}
        result: {type: string, enum: [passed, failed]}
        artifacts: {type: array, items: {$ref: '#/components/schemas/Artifact'}}
        evidence: {type: array, items: {$ref: '#/components/schemas/EvidenceOutcome'}}
        methodology_version_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    AssetGraphInput:
      type: object
      required: [asset_id, name, asset_type, lifecycle, criticality, availability, function_ids, provider_ids,
                 retired_targets, register_verified, open_risk_count, highest_effective_band, any_in_breach]
      properties:
        asset_id: {type: string, format: uuid}
        name: {type: string}
        asset_type: {type: string, enum: [software, hardware, network, information]}
        lifecycle: {type: string, enum: [planned, active, retired]}
        criticality: {type: [integer, 'null'], minimum: 1}
        availability: {type: [integer, 'null'], minimum: 1}
        function_ids: {type: array, items: {type: string, format: uuid}}
        provider_ids: {type: array, items: {type: string, format: uuid}, description: direct provider links}
        retired_targets: {type: array, items: {type: string, format: uuid}, description: linked provider and function ids retired in the register (107-F1-FR5)}
        register_verified: {type: boolean, description: false when register-service could not be reached; retired_targets is then empty (107-F1-FR8)}
        open_risk_count: {type: integer, minimum: 0, description: risks whose scope includes the asset and whose state is not closed (107-F1-FR4)}
        highest_effective_band:
          oneOf:
            - $ref: '#/components/schemas/Band'
            - {type: 'null'}
          description: >
            Highest effective residual band (107 FR4) among the open risks over the asset. Null when the asset has
            no open risk, or, for every asset, when ControlStatusPort cannot answer (unknown, 107-F0-FR4;
            107-F1-FR8, plan D-6).
        any_in_breach:
          type: [boolean, 'null']
          description: >
            Whether any open risk over the asset is in appetite breach; false when the asset has no open risk and
            control statuses can be read. Null (unknown) for every asset, including one with no open risk, when
            ControlStatusPort cannot answer, which is the case while register-service is unreachable; never computed
            from a cached or guessed status (107-F0-FR4, ICT_CONTROL_UNAVAILABLE; 107-F1-FR8, AC8, plan D-6).
            open_risk_count is still returned and shows whether there is any risk.
      example:
        asset_id: 4f8a2c61-9d3e-4b7a-a1f5-6c0e2d8b3a97
        name: Card payments gateway
        asset_type: software
        lifecycle: active
        criticality: 3
        availability: 2
        function_ids: [9b1e4d27-3c6a-4f8e-b0d2-7a5c1e9f4b63]
        provider_ids: [3d1b7f8e-2a44-4f0e-9a4b-7c0b8e1d2f33]
        retired_targets: []
        register_verified: true
        open_risk_count: 2
        highest_effective_band: high
        any_in_breach: true
    LocalizedLabels:
      type: object
      required: [en, sr-Latn, sr-Cyrl]
      properties:
        en: {type: array, items: {type: string}}
        sr-Latn: {type: array, items: {type: string}}
        sr-Cyrl: {type: array, items: {type: string}}
    MethodologyConfig:
      type: object
