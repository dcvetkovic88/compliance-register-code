  schemas:
    Envelope:
      type: object
      required: [event_id, event_type, schema_version, occurred_at, tenant_id, correlation_id, actor, data]
      properties:
        event_id: {type: string, format: uuid}
        event_type:
          type: string
          enum: [arrangement.request.submitted, arrangement.review.decided, arrangement.approved,
                 arrangement.assessment.reopened, contract.analysed, contract.gaps.detected,
                 provider.signal.received, provider.risk-score.changed, provider.obligation.expiring,
                 ictrisk.residual.changed, remediation.task.created]
        schema_version: {type: integer, minimum: 1}
        occurred_at: {type: string, format: date-time}
        tenant_id: {type: string, format: uuid}
        correlation_id: {type: string, description: carried end to end (constitution III.5)}
        actor:
          type: object
          required: [kind, id, role]
          properties:
            kind: {type: string, enum: [user, service, system]}
            id: {type: string, description: 'user uuid, or service name for service and system actors'}
            role:
              type: [string, 'null']
              enum: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor, admin, null]
        data: {type: object}
    ScoreBand:
      type: string
      enum: [low, medium, high, critical]
    ResidualState:
      type: object
      required: [likelihood, impact, score, band, in_breach, controls_not_effective]
      properties:
        likelihood: {type: integer, minimum: 1}
        impact: {type: integer, minimum: 1}
        score: {type: integer, minimum: 1}
        band: {type: string, enum: [low, medium, high, critical]}
        in_breach: {type: boolean}
        controls_not_effective: {type: boolean}
    NormalizedSignal:
      type: object
      additionalProperties: true
      required: [signal_id, layer, kind, source_code, source_ref, source_event_key, provider_id, engagement_id,
                 supplied_product_id, observed_at, severity, title, relevance, counting_state, raw_sha256]
      properties:
        signal_id: {type: string, format: uuid}
        layer: {type: string, enum: [internal, external, obligation]}
        kind: {type: string, enum: [itsm_incident, itsm_sla_breach, cloud_status, security_advisory, breach_news, sanctions_match, financial_health, obligation_expiring, obligation_lapsed]}
        source_code: {type: string}
        source_ref: {type: string}
        source_event_key: {type: string}
        provider_id: {type: [string, 'null'], format: uuid}
        engagement_id: {type: [string, 'null'], format: uuid}
        supplied_product_id: {type: [string, 'null'], format: uuid}
        observed_at: {type: string, format: date-time}
        severity: {type: string, enum: [info, low, medium, high, critical]}
        title: {type: string}
        relevance:
          type: object
          required: [assessed_by, rationale, model_ref]
          properties:
            assessed_by: {type: string, enum: [rule, ai_suggested]}
            rationale: {type: [string, 'null']}
            model_ref: {type: [string, 'null']}
        counting_state: {type: string, enum: [counted, pending_review, dismissed, unmatched]}
        raw_sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
