        title: Provider score rose to high (58)
        detail: {previous_score: 8, score: 58, score_seq: 2}
        acknowledged_by: null
        acknowledged_at: null
        closed_by: null
        closed_at: null
        close_note: null
        created_at: '2026-11-06T09:12:02Z'
        updated_at: '2026-11-06T09:12:02Z'
    SuppliedProduct:
      type: object
      required: [id, provider_id, vendor, product, version, cpe]
      properties:
        id: {type: string, format: uuid}
        provider_id: {type: string, format: uuid}
        vendor: {type: string}
        product: {type: string}
        version: {type: [string, 'null']}
        cpe: {type: [string, 'null']}
    SignalSource:
      type: object
      required: [id, code, layer, adapter, provider_id, health, last_seen_at]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        layer: {$ref: '#/components/schemas/Layer'}
        adapter: {type: string, enum: [fixture_replay, webhook, poll]}
        provider_id: {type: [string, 'null'], format: uuid}
        health: {type: string, enum: [ok, degraded, down, not_applicable]}
        last_seen_at: {type: [string, 'null'], format: date-time}
    MonitoringSummary:
      type: object
      required: [as_of, open_alerts_by_kind, top_scores, expiries]
      properties:
        as_of: {type: string, format: date-time}
        open_alerts_by_kind:
          type: array
          items:
            type: object
            required: [kind, count]
            properties:
              kind: {$ref: '#/components/schemas/AlertKind'}
              count: {type: integer, minimum: 0}
        top_scores:
          type: array
          maxItems: 10
          items:
            type: object
            required: [provider_id, score, band, change_since_previous_day]
            properties:
              provider_id: {type: string, format: uuid}
              score: {type: integer, minimum: 0, maximum: 100}
              band: {$ref: '#/components/schemas/ScoreBand'}
              change_since_previous_day: {type: integer}
        expiries:
          type: object
          description: >
            104-F7-FR8. Each figure is the count of listObligations with expiry_window of the same name (lapsed; active and due
            today plus 0 to 30, 31 to 60, 61 to 90 calendar days, tenant time zone), over the rows the caller may read.
          required: [lapsed, d0_30, d31_60, d61_90]
          properties:
            lapsed: {type: integer, minimum: 0}
            d0_30: {type: integer, minimum: 0}
            d31_60: {type: integer, minimum: 0}
            d61_90: {type: integer, minimum: 0}
      example:
        as_of: '2026-11-06T09:15:00Z'
        open_alerts_by_kind: [{kind: score_band_raised, count: 1}, {kind: obligation_reminder, count: 3}]
        top_scores: [{provider_id: 3d1b7f8e-2a44-4f0e-9a4b-7c0b8e1d2f33, score: 58, band: high, change_since_previous_day: 50}]
        expiries: {lapsed: 0, d0_30: 2, d31_60: 1, d61_90: 4}
