openapi: 3.1.0
info:
  title: monitoring-service API (standalone register build, draft)
  version: 0.1.0-draft
  description: >
    Draft for 104-F5 (active third-party monitoring) and the monitoring tiles of 104-F7.
    Standalone build, constitution Article IX; frozen at planning-done (IX.2).
    Status: DRAFT | Added 2026-11-04 by decision of Dusan (Raiffeisen Demo Decisions and Build Brief).
    AMENDED 2026-11-04 (independent review H5): applyApproval added, the synchronous delivery of 109-F4 decisions (109-F4-FR10).
    Rules: docs/standards/api-standards.md (paths, payloads, lists, RFC 9457 errors, security).
    x-roles lists L1 section 2 role ids; the authoritative binding is 109-F1.
    x-scope marks DEMO or PILOT per L1 section 3a.
    AMENDED 2026-11-05 (foundation T0.2, dcvetkovic88/compliance-register#1): servers entry for the local Docker Compose stack, port 8083 after register-service 8081 in the service order of L1 section 3.
    AMENDED 2026-11-06 (104-F5 speckit-clarify, Dusan decision X2, docs/analyze-2026-11-06.md 104-F5 C1, H1): approveScoringConfigVersion and the VersionId parameter removed; createScoringConfigVersion is the maker submit call of `scoring_configuration_approval`; applyApproval states its kind, effects and refusals; ScoringConfigVersion carries approval_id; 23 operations.
    AMENDED 2026-11-06 (104-F7 speckit-plan re-run, analyze G1): listObligations gains expiry_window, the 104-F7-FR8 drill-down whose count equals MonitoringSummary.expiries for the same window; expiries states its window rule.
    AMENDED 2026-11-06 (Dusan decision 2026-11-06, gate close-out of 109-F4; analyze report final-109-F4-p2 I1): applyApproval states the 109-F4 D10 commit-on-refusal rule and the result-to-code mapping (refused_four_eyes 409 MON_SELF_APPROVAL, refused_not_checker 403 PLATFORM_NOT_IN_MATRIX, stale 409 PLATFORM_APPROVAL_STALE, not_pending 409 PLATFORM_APPROVAL_NOT_PENDING), matching ict-risk-service (107-F0), and documents its 403; the closed MonitoringErrorCode enum gains the three relayed platform codes; the 403 for a non-platform caller is named AUTH_FORBIDDEN.
    AMENDED 2026-11-07 (Dusan's decision (delegated proxy, 2026-11-07) on dcvetkovic88/compliance-register#18): unquoted flow-mapping `description` values containing a comma are quoted so YAML keeps each sentence whole; no type, field, path, message or response changes (111-AC5, Redocly `struct`).
servers:
  - url: http://localhost:8083
    description: monitoring-service in the local Docker Compose stack
security:
  - bearerAuth: []
tags:
  - name: signals
  - name: obligations
  - name: scores
  - name: scoring-config
  - name: alerts
  - name: watchlist
  - name: sources
  - name: summary
  - name: demo
paths:
  /api/v1/monitoring/signals:
    get:
      operationId: listSignals
      tags: [signals]
      summary: List signals, newest observation first (ordering observed_at desc, id desc)
      x-roles: [outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: monitoring:signals
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: provider_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: layer, in: query, required: false, schema: {$ref: '#/components/schemas/Layer'}}
        - {name: kind, in: query, required: false, schema: {$ref: '#/components/schemas/SignalKind'}}
        - {name: counting_state, in: query, required: false, schema: {$ref: '#/components/schemas/CountingState'}}
      responses:
        '200':
          description: Page of signals
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Signal'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: ingestSignal
      tags: [signals]
      summary: Webhook intake of one signal in the normalized shape (idempotent on source_code + source_ref)
      x-roles: [service]
      x-surface: service
      x-audit-object: monitoring:signal
      x-scope: PILOT for live sources, DEMO for tests of the intake path
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignalIntake'}
      responses:
        '201':
          description: Signal stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Signal'}
        '200':
          description: Already received; the existing signal is returned and nothing is stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Signal'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/signals/{signal_id}:
    get:
      operationId: getSignal
      tags: [signals]
      x-roles: [outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: monitoring:signal:{signal_id}
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/SignalId'}]
      responses:
        '200':
          description: Signal with its review history
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/signals/{signal_id}/review:
    post:
      operationId: reviewSignal
      tags: [signals]
      summary: Confirm or dismiss a pending, unmatched or counted signal (104-F5-FR6)
      x-roles: [outsourcing-manager]
      x-surface: user
      x-audit-object: monitoring:signal:{signal_id}:review
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/SignalId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignalReviewWrite'}
      responses:
        '200':
          description: Review recorded; score recalculated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/demo/replays:
    post:
      operationId: replayFixtureFeed
      tags: [demo]
      summary: Replay a named fixture feed through the intake (demo mode only, 104-F5-FR2a)
      x-roles: [outsourcing-manager, admin]
      x-surface: user
      x-audit-object: monitoring:replay
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fixture_name, time_mode]
              properties:
                fixture_name: {type: string, pattern: '^[a-z0-9-]+\.json$'}
                time_mode: {type: string, enum: [shift_to_now, as_recorded]}
            example: {fixture_name: outage-feed-01.json, time_mode: shift_to_now}
      responses:
        '201':
          description: Replay done
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Replay'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/obligations:
    get:
      operationId: listObligations
      tags: [obligations]
      summary: List tracked obligations, ordered due_date asc, id asc
      x-roles: [outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: monitoring:obligations
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: provider_id, in: query, required: false, schema: {type: string, format: uuid}}
        - {name: state, in: query, required: false, schema: {$ref: '#/components/schemas/ObligationState'}}
        - {name: due_within_days, in: query, required: false, schema: {type: integer, minimum: 0, maximum: 730}}
        - name: expiry_window
          in: query
          required: false
          description: >
            104-F7-FR8 drill-down; the list count equals the MonitoringSummary.expiries figure of the same window. lapsed keeps
            state lapsed; d0_30, d31_60 and d61_90 keep state active with due_date from today plus 0 to 30, 31 to 60 and 61 to 90
            calendar days, today in the tenant time zone. Combined with state or due_within_days, both apply.
          schema: {type: string, enum: [lapsed, d0_30, d31_60, d61_90]}
      responses:
        '200':
          description: Page of obligations
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Obligation'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createObligation
      tags: [obligations]
      x-roles: [outsourcing-manager]
      x-surface: user
      x-audit-object: monitoring:obligation
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ObligationCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Obligation'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/obligations/{obligation_id}:
    get:
      operationId: getObligation
      tags: [obligations]
      x-roles: [outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: monitoring:obligation:{obligation_id}
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/ObligationId'}]
      responses:
        '200':
          description: Obligation with reminders sent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Obligation'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateObligation
      tags: [obligations]
      summary: Change title, due date, owner, bound control or document of an active manual obligation
      x-roles: [outsourcing-manager]
      x-surface: user
      x-audit-object: monitoring:obligation:{obligation_id}
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/ObligationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ObligationUpdate'}
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Obligation'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/obligations/{obligation_id}/fulfil:
    post:
      operationId: fulfilObligation
      tags: [obligations]
      summary: Record fulfilment; optionally create the next obligation (104-F5-FR7)
      x-roles: [outsourcing-manager]
      x-surface: user
      x-audit-object: monitoring:obligation:{obligation_id}:fulfil
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/ObligationId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [next_due_date, document_ref]
              properties:
                next_due_date: {type: [string, 'null'], format: date}
                document_ref: {type: [string, 'null'], description: Storage path; required for certificates and reports}
            example: {next_due_date: '2027-11-30', document_ref: 'obligations/iso27001-2026.pdf'}
      responses:
        '200':
          description: Fulfilled; the next obligation is linked when created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Obligation'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/provider-scores:
    get:
      operationId: listProviderScores
      tags: [scores]
      summary: Provider scores ordered score desc, provider_id asc
      x-roles: [outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: monitoring:provider-scores
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: band, in: query, required: false, schema: {$ref: '#/components/schemas/ScoreBand'}}
      responses:
        '200':
          description: Page of scores
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ProviderScore'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/provider-scores/{provider_id}:
    get:
      operationId: getProviderScore
      tags: [scores]
      summary: Current score with full breakdown (recomputable by hand, 104-F5-SC2)
      x-roles: [outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: monitoring:provider-score:{provider_id}
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/ProviderId'}]
      responses:
        '200':
          description: Score
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderScore'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/provider-scores/{provider_id}/history:
    get:
      operationId: listProviderScoreHistory
      tags: [scores]
      summary: Score changes, ordered score_seq desc
      x-roles: [outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: monitoring:provider-score:{provider_id}:history
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of score changes
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ScoreChange'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/scoring-config/versions:
    get:
      operationId: listScoringConfigVersions
      tags: [scoring-config]
      x-roles: [outsourcing-manager, compliance, auditor]
      x-surface: user
      x-audit-object: monitoring:scoring-config
      x-scope: DEMO
      responses:
        '200':
          description: All versions, ordered version desc
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/ScoringConfigVersion'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createScoringConfigVersion
      tags: [scoring-config]
      summary: Maker submit call of `scoring_configuration_approval` (104-F5-FR8, 109-F4-FR10)
      description: >
        Validates the configuration, stores the next version as `draft` with its `approval_id` and creates
        the pending `scoring_configuration_approval` through platform.request_approval in one transaction.
        The version takes effect only when the checker approves it through platform decideApproval, which
        calls applyApproval. There is no direct approve operation (Dusan decision 2026-11-06, X2).
        A version whose approval expires or is withdrawn stays `draft` and never takes effect (Q-159).
      x-roles: [outsourcing-manager, compliance]
      x-surface: user
      x-audit-object: monitoring:scoring-config-version
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScoringConfig'}
      responses:
        '201':
          description: Draft created with its pending approval (`approval_id` set)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScoringConfigVersion'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/alerts:
    get:
      operationId: listAlerts
      tags: [alerts]
      summary: Alerts for the caller's roles, ordered created_at desc
      x-roles: [outsourcing-manager, it-governance, auditor]
      x-surface: user
      x-audit-object: monitoring:alerts
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: state, in: query, required: false, schema: {$ref: '#/components/schemas/AlertState'}}
        - {name: kind, in: query, required: false, schema: {$ref: '#/components/schemas/AlertKind'}}
        - {name: provider_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Page of alerts
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Alert'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/alerts/{alert_id}/acknowledge:
    post:
      operationId: acknowledgeAlert
      tags: [alerts]
      x-roles: [outsourcing-manager, it-governance]
      x-surface: user
      x-audit-object: monitoring:alert:{alert_id}
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/AlertId'}]
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alert'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/alerts/{alert_id}/close:
    post:
      operationId: closeAlert
      tags: [alerts]
      x-roles: [outsourcing-manager, it-governance]
      x-surface: user
      x-audit-object: monitoring:alert:{alert_id}
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/AlertId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [note]
              properties:
                note: {type: string, minLength: 1}
            example: {note: Reassessment confirmed, see arrangement review.}
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alert'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/providers/{provider_id}/supplied-products:
    get:
      operationId: listSuppliedProducts
      tags: [watchlist]
      x-roles: [outsourcing-manager, security, it-governance, auditor]
      x-surface: user
      x-audit-object: monitoring:provider:{provider_id}:supplied-products
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/ProviderId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Watchlist, ordered vendor, product
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SuppliedProduct'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createSuppliedProduct
      tags: [watchlist]
      x-roles: [outsourcing-manager, security]
      x-surface: user
      x-audit-object: monitoring:provider:{provider_id}:supplied-product
      x-scope: DEMO
      parameters: [{$ref: '#/components/parameters/ProviderId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vendor, product]
              properties:
                vendor: {type: string, minLength: 1}
                product: {type: string, minLength: 1}
                version: {type: [string, 'null']}
                cpe: {type: [string, 'null']}
            example: {vendor: Example Vendor, product: Example Gateway, version: '4.2', cpe: null}
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SuppliedProduct'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/sources:
    get:
      operationId: listSignalSources
      tags: [sources]
      summary: Configured sources with health (104-F5-FR14)
      x-roles: [outsourcing-manager, admin, auditor]
      x-surface: user
      x-audit-object: monitoring:sources
      x-scope: PILOT
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of sources, ordered code asc
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/SignalSource'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/summary:
    get:
      operationId: getMonitoringSummary
      tags: [summary]
      summary: Figures for the 104-F7 dashboard monitoring tiles, row-level limits of the caller applied
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: monitoring:summary
      x-scope: DEMO
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MonitoringSummary'}
        default: {$ref: '#/components/responses/Problem'}
  /api/v1/monitoring/approvals/{approval_id}/apply:
    post:
      operationId: applyApproval
      tags: [scoring-config]
      summary: Decide a pending 109-F4 approval of a subject this service owns and apply the change in one transaction (109-F4-FR10)
      description: >
        Called only by the platform decideApproval handler, synchronously, with the checker's identity
        (109-F4 plan D6). The service calls platform.decide_approval (role, delegation, identity and stale
        checks) and applies the proposed change in the same transaction, or does neither. Added 2026-11-04
        (independent review H5). The only kind is `scoring_configuration_approval` (104-F5-FR8): on approve
        the version becomes `approved` with `approved_by` and `approved_at`, the previous approved version
        becomes `superseded` and every provider score is recalculated (cause `config`); on reject the version
        becomes `rejected`. Refusals: 409 MON_NOT_DRAFT when the version is no longer a draft; 403 AUTH_FORBIDDEN
        for any caller other than the platform service identity. Amended 2026-11-06 (Dusan decision X2,
        docs/analyze-2026-11-06.md 104-F5 C1). Refusal results of decide_approval commit (109-F4 plan D10): no
        subject change, the refusal audit event and any stale state persist, then the service answers (Dusan
        decision 2026-11-06, gate close-out of 109-F4, finding I1; same mapping as ict-risk-service, 107-F0 plan
        D-2): refused_four_eyes with 409 MON_SELF_APPROVAL (the checker is the author or another excluded
        identity); refused_not_checker with 403 PLATFORM_NOT_IN_MATRIX (no checker role or valid delegation at
        decision time); stale with 409 PLATFORM_APPROVAL_STALE; not_pending with 409 PLATFORM_APPROVAL_NOT_PENDING
        (already decided, for example the losing side of two concurrent decisions). The three PLATFORM_ codes are
        platform decide_approval results that this operation relays; platform decideApproval relays all of them
        unchanged.
      x-roles: [service:platform]
      x-surface: service
      x-audit-object: platform:approval
      x-scope: DEMO
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, reject]}
                reason: {type: [string, 'null'], maxLength: 2000, description: Required when decision is reject}
      responses:
        '200':
          description: Decision recorded; on approve the change is applied
          content:
            application/json:
              schema:
                type: object
                required: [approval_id, state]
                properties:
                  approval_id: {type: string, format: uuid}
                  state: {type: string, enum: [approved, rejected]}
                  subject_id: {type: string}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    SignalId: {name: signal_id, in: path, required: true, schema: {type: string, format: uuid}}
    ObligationId: {name: obligation_id, in: path, required: true, schema: {type: string, format: uuid}}
    ProviderId: {name: provider_id, in: path, required: true, schema: {type: string, format: uuid}}
    AlertId: {name: alert_id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: Problem Details, RFC 9457 (api-standards section 5)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Problem:
      type: object
      required: [type, title, status, error_code, correlation_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: [string, 'null']}
        error_code: {$ref: '#/components/schemas/MonitoringErrorCode'}
        correlation_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
      example:
        type: https://errors.wiser.local/monitoring/self-approval
        title: Self-approval refused
        status: 409
        detail: A scoring configuration version cannot be approved by its author.
        error_code: MON_SELF_APPROVAL
        correlation_id: 6f0c2b1e-8d4a-4c55-9a51-0d2f4e7b9a10
    MonitoringErrorCode:
      type: string
      description: >
        AUTH_UNAUTHENTICATED 401; AUTH_FORBIDDEN 403; NOT_FOUND 404; VALIDATION_FAILED 422;
        MON_SELF_APPROVAL 409 (applyApproval, checker is an excluded identity); MON_NOT_DRAFT 409; MON_REVIEW_NOT_ALLOWED 409 (signal not reviewable in its state);
        MON_REASON_REQUIRED 422; MON_PROVIDER_REQUIRED 422 (confirming an unmatched signal);
        MON_UNKNOWN_PROVIDER 422; MON_UNKNOWN_SOURCE 422; MON_UNKNOWN_FIXTURE 422;
        MON_DEMO_MODE_OFF 403; MON_OBLIGATION_CLOSED 409; MON_OBLIGATION_SYNCED 409 (register-derived, not editable);
        MON_DOCUMENT_REQUIRED 422; MON_NOTE_REQUIRED 422; MON_ALERT_CLOSED 409; MON_INVALID_CONFIG 422;
        PLATFORM_NOT_IN_MATRIX 403, PLATFORM_APPROVAL_STALE 409 and PLATFORM_APPROVAL_NOT_PENDING 409 are platform
        decide_approval results that applyApproval relays (109-F4 plan D6, D10; added 2026-11-06, Dusan decision,
        gate close-out of 109-F4, finding I1).
      enum: [AUTH_UNAUTHENTICATED, AUTH_FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, MON_SELF_APPROVAL,
             MON_NOT_DRAFT, MON_REVIEW_NOT_ALLOWED, MON_REASON_REQUIRED, MON_PROVIDER_REQUIRED,
             MON_UNKNOWN_PROVIDER, MON_UNKNOWN_SOURCE, MON_UNKNOWN_FIXTURE, MON_DEMO_MODE_OFF,
             MON_OBLIGATION_CLOSED, MON_OBLIGATION_SYNCED, MON_DOCUMENT_REQUIRED, MON_NOTE_REQUIRED,
             MON_ALERT_CLOSED, MON_INVALID_CONFIG,
             PLATFORM_NOT_IN_MATRIX, PLATFORM_APPROVAL_STALE, PLATFORM_APPROVAL_NOT_PENDING]
    Layer:
      type: string
      enum: [internal, external, obligation]
    SignalKind:
      type: string
      enum: [itsm_incident, itsm_sla_breach, cloud_status, security_advisory, breach_news,
             sanctions_match, financial_health, obligation_expiring, obligation_lapsed]
    Severity:
      type: string
      enum: [info, low, medium, high, critical]
    CountingState:
      type: string
      enum: [counted, pending_review, dismissed, unmatched]
    ScoreBand:
      type: string
      enum: [low, medium, high, critical]
    Relevance:
      type: object
      required: [assessed_by, rationale, model_ref]
      properties:
        assessed_by: {type: string, enum: [rule, ai_suggested]}
        rationale: {type: [string, 'null']}
        model_ref: {type: [string, 'null'], description: model and gateway adapter reference when ai_suggested}
    SignalIntake:
      type: object
      additionalProperties: false
      required: [source_code, source_ref, source_event_key, kind, observed_at, severity, title, raw_sha256]
      properties:
        source_code: {type: string}
        source_ref: {type: string, minLength: 1}
        source_event_key: {type: string, minLength: 1}
        kind: {$ref: '#/components/schemas/SignalKind'}
        provider_id: {type: [string, 'null'], format: uuid}
        provider_identification_code: {type: [string, 'null']}
        provider_legal_name: {type: [string, 'null']}
        engagement_id: {type: [string, 'null'], format: uuid}
        supplied_product_id: {type: [string, 'null'], format: uuid}
        observed_at: {type: string, format: date-time}
        severity: {$ref: '#/components/schemas/Severity'}
        source_severity: {type: [string, 'null'], description: raw source value mapped through the source severity_map when severity is derived}
        title: {type: string, minLength: 1}
        summary: {type: [string, 'null']}
        link: {type: [string, 'null'], format: uri}
        raw_sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
      example:
        source_code: fixture-replay
        source_ref: nimbus-status-2026-11-06-001
        source_event_key: nimbus-incident-4471
        kind: cloud_status
        provider_id: 3d1b7f8e-2a44-4f0e-9a4b-7c0b8e1d2f33
        provider_identification_code: null
        provider_legal_name: null
        engagement_id: null
        supplied_product_id: null
        observed_at: '2026-11-06T09:12:00Z'
        severity: critical
        source_severity: major_outage
        title: Major outage in region eu-central
        summary: Compute and storage unavailable.
        link: null
        raw_sha256: 'sha256:9f2c6a1e0b7d4c3a8e5f1b2d6c9a0e4f7b3d8c1a5e2f6b9d0c4a7e1f3b8d2c6a'
    Signal:
      type: object
      required: [id, source_code, source_ref, source_event_key, layer, kind, provider_id, match_method,
                 engagement_id, supplied_product_id, observed_at, received_at, severity, title, summary,
                 link, relevance, counting_state, raw_sha256]
      properties:
        id: {type: string, format: uuid}
        source_code: {type: string}
        source_ref: {type: string}
        source_event_key: {type: string}
        layer: {$ref: '#/components/schemas/Layer'}
        kind: {$ref: '#/components/schemas/SignalKind'}
        provider_id: {type: [string, 'null'], format: uuid}
        match_method: {type: string, enum: [source_provider, identification_code, exact_name, ai_suggested, manual, none]}
        engagement_id: {type: [string, 'null'], format: uuid}
        supplied_product_id: {type: [string, 'null'], format: uuid}
        observed_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        severity: {$ref: '#/components/schemas/Severity'}
        title: {type: string}
        summary: {type: [string, 'null']}
        link: {type: [string, 'null']}
        relevance: {$ref: '#/components/schemas/Relevance'}
        counting_state: {$ref: '#/components/schemas/CountingState'}
        raw_sha256: {type: string}
      example:
        id: 0b6f3c2e-1a4d-4e8b-9c7f-2d5a6b8e1f30
        source_code: fixture-replay
        source_ref: nimbus-status-2026-11-06-001
