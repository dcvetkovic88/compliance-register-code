        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/AlertKind'}
        target_role: {type: string, enum: [outsourcing-manager, it-governance]}
        provider_id: {type: [string, 'null'], format: uuid}
        risk_id: {type: [string, 'null'], format: uuid}
        state: {$ref: '#/components/schemas/AlertState'}
        title: {type: string}
        detail: {type: object}
        acknowledged_by: {type: [string, 'null'], format: uuid}
        acknowledged_at: {type: [string, 'null'], format: date-time}
        closed_by: {type: [string, 'null'], format: uuid}
        closed_at: {type: [string, 'null'], format: date-time}
        close_note: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      example:
        id: 8b3e0d14-6c2a-4f7e-9b51-3a7c2e0f9d48
        kind: score_band_raised
        target_role: outsourcing-manager
        provider_id: 3d1b7f8e-2a44-4f0e-9a4b-7c0b8e1d2f33
