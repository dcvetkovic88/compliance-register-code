      required: [provider_id, kind, title, due_date, owner_id]
      properties:
        provider_id: {type: string, format: uuid}
        arrangement_id: {type: [string, 'null'], format: uuid}
        kind: {$ref: '#/components/schemas/ObligationKind'}
        title: {type: string, minLength: 1}
        due_date: {type: string, format: date}
        owner_id: {type: string, format: uuid}
        bound_control_id: {type: [string, 'null'], format: uuid}
        document_ref: {type: [string, 'null']}
      example:
        provider_id: 3d1b7f8e-2a44-4f0e-9a4b-7c0b8e1d2f33
        kind: exit_plan_test
        title: Annual exit plan test
        due_date: '2027-03-31'
        owner_id: 7e4c1a90-2b6d-4e3f-a1c5-9d8b0f2e6a14
    ObligationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: {type: string, minLength: 1}
        due_date: {type: string, format: date}
        owner_id: {type: string, format: uuid}
        bound_control_id: {type: [string, 'null'], format: uuid}
        document_ref: {type: [string, 'null']}
      example: {due_date: '2027-04-30'}
    ScoreBreakdown:
      type: object
      required: [config_version, evaluated_at, components, raw_total, sanctions_override, capped]
      properties:
        config_version: {type: integer, minimum: 1}
        evaluated_at: {type: string, format: date-time}
        components:
          type: array
          items:
            type: object
            required: [component, subtotal, contributions]
            properties:
              component: {type: string, enum: [itsm_incident, itsm_sla_breach, cloud_status, security_advisory, breach_news, financial_health, obligation]}
              subtotal: {type: number, minimum: 0}
              contributions:
                type: array
                items:
                  type: object
                  required: [ref_kind, ref_id, severity_points, weight, repeat_factor, decay, points]
                  properties:
                    ref_kind: {type: string, enum: [signal_group, obligation]}
                    ref_id: {type: string, description: 'source_event_key for a signal group, obligation id for an obligation'}
                    severity_points: {type: number}
                    weight: {type: number}
                    repeat_factor: {type: number}
                    decay: {type: number}
                    points: {type: number}
        raw_total: {type: number, minimum: 0}
        sanctions_override: {type: boolean}
        capped: {type: boolean}
    ProviderScore:
      type: object
      required: [provider_id, score, band, score_seq, evaluated_at, breakdown]
      properties:
        provider_id: {type: string, format: uuid}
        score: {type: integer, minimum: 0, maximum: 100}
        band: {$ref: '#/components/schemas/ScoreBand'}
        score_seq: {type: integer, minimum: 0}
        evaluated_at: {type: string, format: date-time}
        breakdown: {$ref: '#/components/schemas/ScoreBreakdown'}
      example:
        provider_id: 3d1b7f8e-2a44-4f0e-9a4b-7c0b8e1d2f33
        score: 58
        band: high
        score_seq: 2
        evaluated_at: '2026-11-06T09:12:02Z'
        breakdown:
          config_version: 1
          evaluated_at: '2026-11-06T09:12:02Z'
          raw_total: 57.5
          sanctions_override: false
          capped: false
          components:
            - component: itsm_incident
              subtotal: 7.5
              contributions: [{ref_kind: signal_group, ref_id: INC-0042, severity_points: 15, weight: 1.0, repeat_factor: 1.0, decay: 0.5, points: 7.5}]
            - component: cloud_status
              subtotal: 50
              contributions: [{ref_kind: signal_group, ref_id: nimbus-incident-4471, severity_points: 50, weight: 1.0, repeat_factor: 1.0, decay: 1.0, points: 50}]
    ReopenProposal:
      type: object
      required: [reason, cause_signal_ids]
      properties:
        reason: {type: string, enum: [band_reached_reopen_band, sanctions_match]}
        cause_signal_ids: {type: array, items: {type: string, format: uuid}}
    ScoreChange:
      type: object
      required: [score_seq, previous_score, score, previous_band, band, config_version, cause, cause_signal_ids, reopen_proposal, evaluated_at]
      properties:
        score_seq: {type: integer}
        previous_score: {type: [integer, 'null']}
        score: {type: integer, minimum: 0, maximum: 100}
        previous_band:
          oneOf:
            - $ref: '#/components/schemas/ScoreBand'
            - {type: 'null'}
        band: {$ref: '#/components/schemas/ScoreBand'}
        config_version: {type: integer}
        cause: {type: string, enum: [signal, review, obligation, config, daily]}
        cause_signal_ids: {type: array, items: {type: string, format: uuid}}
        reopen_proposal:
          oneOf:
            - $ref: '#/components/schemas/ReopenProposal'
            - {type: 'null'}
        evaluated_at: {type: string, format: date-time}
    ScoringConfig:
      type: object
      additionalProperties: false
      required: [severity_points, weights, half_life_days, repeat_factor, repeat_window_days, max_age_days,
                 obligation_points, bands, alert_band, reopen_band, reminder_offsets_days]
      properties:
        severity_points:
          type: object
          additionalProperties: false
          required: [info, low, medium, high, critical]
          properties:
            info: {type: number, minimum: 0}
            low: {type: number, minimum: 0}
            medium: {type: number, minimum: 0}
            high: {type: number, minimum: 0}
            critical: {type: number, minimum: 0}
        weights:
          type: object
          additionalProperties: false
          required: [itsm_incident, itsm_sla_breach, cloud_status, security_advisory, breach_news, financial_health, obligation]
          properties:
            itsm_incident: {type: number, minimum: 0}
            itsm_sla_breach: {type: number, minimum: 0}
            cloud_status: {type: number, minimum: 0}
            security_advisory: {type: number, minimum: 0}
            breach_news: {type: number, minimum: 0}
            financial_health: {type: number, minimum: 0}
            obligation: {type: number, minimum: 0}
        half_life_days:
          type: object
          additionalProperties: false
          required: [internal, external]
          properties:
            internal: {type: number, exclusiveMinimum: 0}
            external: {type: number, exclusiveMinimum: 0}
        repeat_factor: {type: number, minimum: 1}
        repeat_window_days: {type: integer, minimum: 1}
        max_age_days: {type: integer, minimum: 1}
        obligation_points:
          type: object
          additionalProperties: false
          required: [lapsed, due_within_30_days]
          properties:
            lapsed: {type: number, minimum: 0}
            due_within_30_days: {type: number, minimum: 0}
        bands:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [band, min, max]
            properties:
              band: {$ref: '#/components/schemas/ScoreBand'}
              min: {type: integer, minimum: 0, maximum: 100}
              max: {type: integer, minimum: 0, maximum: 100}
        alert_band: {$ref: '#/components/schemas/ScoreBand'}
        reopen_band: {$ref: '#/components/schemas/ScoreBand'}
        reminder_offsets_days:
          type: array
          minItems: 1
          items: {type: integer, minimum: 1}
      example:
        severity_points: {info: 0, low: 5, medium: 15, high: 30, critical: 50}
        weights: {itsm_incident: 1.0, itsm_sla_breach: 0.5, cloud_status: 1.0, security_advisory: 0.5, breach_news: 0.5, financial_health: 1.0, obligation: 1.0}
        half_life_days: {internal: 30, external: 14}
        repeat_factor: 1.5
        repeat_window_days: 90
        max_age_days: 365
        obligation_points: {lapsed: 20, due_within_30_days: 5}
        bands: [{band: low, min: 0, max: 24}, {band: medium, min: 25, max: 49}, {band: high, min: 50, max: 74}, {band: critical, min: 75, max: 100}]
        alert_band: high
        reopen_band: high
        reminder_offsets_days: [90, 60, 30, 7]
    ScoringConfigVersion:
      type: object
      required: [id, version, state, config, authored_by, approval_id, approved_by, approved_at, created_at]
      properties:
        id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        state: {type: string, enum: [draft, approved, superseded, rejected]}
        config: {$ref: '#/components/schemas/ScoringConfig'}
        authored_by: {type: [string, 'null'], format: uuid}
        approval_id: {type: [string, 'null'], format: uuid, description: 'The 109-F4 `scoring_configuration_approval`; null only for version 1 (system seed)'}
        approved_by: {type: [string, 'null'], format: uuid}
        approved_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    AlertKind:
