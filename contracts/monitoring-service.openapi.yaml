    SignalReview:
      type: object
      required: [decision, provider_id, reason, reviewed_by, reviewed_at]
      properties:
        decision: {type: string, enum: [confirm, dismiss]}
        provider_id: {type: [string, 'null'], format: uuid}
        reason: {type: [string, 'null']}
        reviewed_by: {type: string, format: uuid}
        reviewed_at: {type: string, format: date-time}
    SignalDetail:
      allOf:
        - $ref: '#/components/schemas/Signal'
        - type: object
          required: [reviews, group_signal_ids]
          properties:
            reviews: {type: array, items: {$ref: '#/components/schemas/SignalReview'}}
            group_signal_ids: {type: array, items: {type: string, format: uuid}}
    SignalReviewWrite:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [confirm, dismiss]}
        provider_id: {type: [string, 'null'], format: uuid, description: required when confirming an unmatched signal}
        reason: {type: [string, 'null'], description: required when dismissing}
      example: {decision: dismiss, provider_id: null, reason: Article concerns a different company with a similar name.}
    Replay:
      type: object
      required: [id, fixture_name, time_mode, signals_stored, signals_skipped, signal_ids]
      properties:
        id: {type: string, format: uuid}
        fixture_name: {type: string}
        time_mode: {type: string, enum: [shift_to_now, as_recorded]}
        signals_stored: {type: integer, minimum: 0}
        signals_skipped: {type: integer, minimum: 0, description: already received (idempotency)}
        signal_ids: {type: array, items: {type: string, format: uuid}}
    ObligationKind:
      type: string
      enum: [iso27001_certificate, soc2_report, contract_renewal, audit, exit_plan_test, other]
    ObligationState:
      type: string
      enum: [active, lapsed, fulfilled, cancelled]
    Obligation:
      type: object
      required: [id, provider_id, arrangement_id, kind, title, due_date, owner_id, bound_control_id,
                 document_ref, origin, state, fulfilled_at, next_obligation_id, reminders, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        provider_id: {type: string, format: uuid}
        arrangement_id: {type: [string, 'null'], format: uuid}
        kind: {$ref: '#/components/schemas/ObligationKind'}
        title: {type: string}
        due_date: {type: string, format: date}
        owner_id: {type: string, format: uuid}
        bound_control_id: {type: [string, 'null'], format: uuid}
        document_ref: {type: [string, 'null']}
        origin: {type: string, enum: [manual, register_arrangement]}
        state: {$ref: '#/components/schemas/ObligationState'}
        fulfilled_at: {type: [string, 'null'], format: date-time}
        next_obligation_id: {type: [string, 'null'], format: uuid}
        reminders:
          type: array
          items:
            type: object
            required: [phase, sent_at]
            properties:
              phase: {type: string, pattern: '^(d[0-9]+|lapsed|fulfilled)$'}
              sent_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      example:
        id: 5a2e9c71-4b3d-4f2a-8e6c-1d0b7a9f3e22
