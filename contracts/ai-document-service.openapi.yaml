openapi: 3.1.0
info:
  title: ai-document-service API (standalone register build, feature 108 draft)
  version: 0.1.0-draft.108
  description: >
    Draft of the HTTP API of ai-document-service (docs/standalone/register-standalone-spec.md
    section 3), serving feature 108 functionalities F1 (contract reading), F2 (clause gap check),
    F3 (compliance copilot) and F4 (criticality suggestion), plus the signal relevance
    judgement used by 104-F5. Contract-first under constitution
    IX.2; frozen at planning-done. Status: DRAFT | Added 2026-11-04 by decision of Dusan
    (Raiffeisen Demo Decisions and Build Brief). AMENDED 2026-11-05 (Dusan decision Q-012):
    draft_wording_language is the contract's language. Every AI output is a suggestion with verified
    sources; nothing enters a record without a decision by a named user (register values:
    register-service decideFieldSuggestions; clause statuses and gaps: register-service
    setContractReviewItem and decideContractGaps; criticality kinds: register-service
    proposeClassification, updateRequest and recordCriticalityDecision, 108-F4).
    Roles in x-roles are the L1 section 2 role ids and remain drafts until 109-F1 lands.
    Errors follow RFC 9457 Problem Details with error_code (docs/standards/api-standards.md
    section 5). The tenant is taken from the verified bearer token, never from the request.
    AMENDED 2026-11-05: judgeSignalRelevance added for 104-F5 (cross-file reconciliation).
    AMENDED 2026-11-05 (foundation T0.2, dcvetkovic88/compliance-register#1): servers entry for the local Docker Compose stack, port 8084 after register-service 8081 in the service order of L1 section 3.
    AMENDED 2026-11-06 (108-F1 speckit-clarify, autonomous Spec Kit run; Dusan decision X3):
    register-service is the only caller of the 108 operations and forwards the signed-in user's
    bearer token (x-surface user, that user's identity); apps/web never calls this service.
    uploadDocument takes a JSON reference to a register-service document (bucket
    register-documents) instead of a multipart file, and the service stores no copy;
    confirmSuggestion refuses kind register_field.
    AMENDED 2026-11-06 (108-F2 speckit-clarify, autonomous Spec Kit run; Dusan decisions X2, X3;
    109-F4 analyze 2026-11-06 F1, F3): runClauseCheck reads the active annotation version only
    through platform getActiveAnnotationVersion (seed/catalogs/clause-applicability.json is seed
    input only) and ClauseCheck carries annotation_version; ClauseFinding.applicability_condition
    adds national_scope (Q-028); confirmSuggestion refuses kind clause_status, whose decisions
    register-service records on the contract checklist item (setContractReviewItem) and on the
    contract gaps (decideContractGaps).
    AMENDED 2026-11-06 (108-F2 speckit-plan re-run, speckit-analyze 2026-11-06 108-F2 F1):
    ClauseCheck.outdated is false in the demo; the outdated mark of a clause check is computed on
    read by register-service on the contract review (ContractReview.outdated, 108-F2 plan D-6;
    wording AMENDED 2026-11-06, analyze final-108-F2-p1 F1: not stored).
    AMENDED 2026-11-06 (108-F4 speckit-clarify, autonomous Spec Kit run; docs/analyze-2026-11-06.md
    108-F4 H3, H4; Dusan decisions X2, X3): requestCriticalitySuggestion and
    getCriticalitySuggestion are called only by register-service; confirmSuggestion refuses the
    five criticality kinds and is now x-scope PILOT; CriticalitySuggestionSet.outdated is false in
    the demo (register-service computes the mark on read, 108-F4-FR8).
    AMENDED 2026-11-06 (108-F3 speckit-clarify, autonomous Spec Kit run; docs/analyze-2026-11-06.md
    108-F3 H2; Dusan decision X3): listCopilotSessions added (own sessions; auditor all sessions of
    the tenant with optional user_id; another user_id from a non-auditor is 404) with
    CopilotSessionList; the four copilot operations are called only by the register-service relay
    operations of the same name (108-F3-FR13).
    AMENDED 2026-11-06 (108-F3 speckit-plan, analyze report final-108-F3-c1t1 U1, I1; Confirmed by Dusan 2026-11-06, Q-169): listCopilotMessages read by a user other than the session owner
    (auditor) withholds each assistant segment that cites a confidential record or a contract
    segment the reader cannot read (CopilotSegment.withheld); the copilot request locale is the
    register-service aiLocale value, so the CopilotSessionCreate and CopilotSession examples read
    sr-Latn (110-F1 T3.5, T7.1).
    AMENDED 2026-11-06 (108-F3 speckit-plan, analyze report final-108-F3-p1 H2, M1): the
    real-document guard of the copilot applies to askCopilot only, the one model-calling copilot
    operation (409 AIDOC_DATA_HANDLING_NOT_APPROVED, 108-F1 plan, 108-AC4); session create and the
    two list operations stay available; CopilotAnswer.status drops `error`, which 108-F3-FR6 does
    not define (a model outage is a 503 Problem, not an answer).
    AMENDED 2026-11-07 (Dusan's decision (delegated proxy, 2026-11-07) on dcvetkovic88/compliance-register#18): unquoted flow-mapping `description` values containing a comma are quoted so YAML keeps each sentence whole; no type, field, path, message or response changes (111-AC5, Redocly `struct`).
servers:
  - url: http://localhost:8084
    description: ai-document-service in the local Docker Compose stack
security:
  - bearerAuth: []
tags:
  - name: health
  - name: documents
  - name: jobs
  - name: analyses
  - name: clause-checks
  - name: batches
  - name: criticality
  - name: copilot
  - name: suggestions
  - name: signal-relevance
paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Liveness and readiness, no data
      security: []
      x-roles: []
      x-surface: service
      x-audit-object: none
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /api/v1/ai-document/documents:
    post:
      operationId: uploadDocument
      tags: [documents]
      summary: Register a contract held by register-service (PDF with text layer or DOCX) linked to one arrangement or request (108-F1-FR1)
      description: >
        Called by register-service only (X3), with the signed-in user's token. The body names the
        register-service document; this service reads its bytes through register-service
        downloadDocument as that user and stores no copy. Maximum 20 MB and 300 pages. A second
        registration with the same SHA-256 on the same arrangement or request returns the existing
        document with status 200 instead of 201. Text extraction runs before the response returns;
        a PDF without a text layer is refused (DEMO scope).
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal]
      x-surface: user
      x-audit-object: aidoc:document
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentRegistration'}
      responses:
        '201':
          description: Document registered and text extracted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '200':
          description: Same file already registered on this arrangement or request; existing document returned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/FileTooLarge'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/ai-document/documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: getDocument
      tags: [documents]
      summary: Document metadata (108-F1-FR1, FR2)
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: aidoc:document
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateDocumentLanguage
      tags: [documents]
      summary: Override the detected language and script (108-F1-FR2)
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal]
      x-surface: user
      x-audit-object: aidoc:document
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DocumentLanguageUpdate'}
      responses:
        '200':
          description: Updated document
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/ai-document/documents/{document_id}/analyse:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: analyseDocument
      tags: [documents]
      summary: Start contract reading and register pre-fill (108-F1-FR4 to FR11)
      x-roles: [outsourcing-manager, compliance, legal]
      x-surface: user
      x-audit-object: aidoc:analysis
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AnalyseRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/ai-document/documents/{document_id}/clause-checks:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: runClauseCheck
      tags: [clause-checks]
      summary: Start the clause gap check against the active catalogs (108-F2-FR1 to FR7)
      description: >
        Called by register-service only, with the signed-in user's token (X3). At the start of
        each check the service reads the active annotation version through platform
        getActiveAnnotationVersion (109-F4) and stamps it on the result; it never reads the seed
        file. When that call fails the job fails with no model call and no proposals.
      x-roles: [outsourcing-manager, compliance, legal]
      x-surface: user
      x-audit-object: aidoc:clause-check
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClauseCheckRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/ai-document/jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getJob
      tags: [jobs]
      summary: Job state; links the analysis or batch result when done
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: aidoc:job
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai-document/analyses/{analysis_id}:
    parameters:
      - name: analysis_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getAnalysis
      tags: [analyses]
      summary: Contract reading result with suggestions and sources (108-F1-FR5 to FR10)
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: aidoc:analysis
      responses:
        '200':
          description: Analysis
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai-document/clause-checks/{clause_check_id}:
    parameters:
      - name: clause_check_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getClauseCheck
      tags: [clause-checks]
      summary: Clause gap check result, one finding per clause (108-F2-FR3, FR4)
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: aidoc:clause-check
      responses:
        '200':
          description: Clause check
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClauseCheck'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai-document/batches:
    post:
      operationId: createBatch
      tags: [batches]
      summary: Batch reading and clause checks over existing contracts (108-F1-FR9, 108-F2-FR8); called by register-service only (X3)
      x-roles: [outsourcing-manager]
      x-surface: user
      x-audit-object: aidoc:batch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BatchRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/ai-document/batches/{batch_id}:
    parameters:
      - name: batch_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getBatch
      tags: [batches]
      summary: Batch progress, per-document results and totals
      x-roles: [outsourcing-manager, compliance, legal, auditor]
      x-surface: user
      x-audit-object: aidoc:batch
      responses:
        '200':
          description: Batch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Batch'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai-document/criticality-suggestions:
    post:
      operationId: requestCriticalitySuggestion
      tags: [criticality]
      summary: Start the lifecycle step 2 pre-assessment suggestion (108-F4-FR1 to FR6)
      description: >
        Called only by register-service (requestCriticalitySuggestion, 104-F2 T3.3 AiDocumentClient)
        with the signed-in user's bearer token (X3); apps/web never calls it. AMENDED 2026-11-06
        (108-F4): role compliance removed, the outsourcing manager starts the suggestion.
      x-roles: [outsourcing-manager]
      x-surface: user
      x-audit-object: aidoc:criticality-suggestion
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CriticalityRequest'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/ai-document/criticality-suggestions/{suggestion_set_id}:
    parameters:
      - name: suggestion_set_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getCriticalitySuggestion
      tags: [criticality]
      summary: Criticality and ICT relevance suggestion set
      description: >
        Called by register-service with the user's token to copy the set into
        register.request_criticality_suggestions (X3, 108-F4-FR7); the screen reads the register copy
        (getRequestCriticalitySuggestions).
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: aidoc:criticality-suggestion
      responses:
        '200':
          description: Suggestion set
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CriticalitySuggestionSet'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai-document/copilot/sessions:
    post:
      operationId: createCopilotSession
      tags: [copilot]
      summary: Open a copilot session (108-F3-FR1, FR9)
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: aidoc:copilot-session
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopilotSessionCreate'}
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CopilotSession'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
    get:
      operationId: listCopilotSessions
      tags: [copilot]
      summary: List copilot sessions, newest first (108-F3-FR9, AC9)
      description: >
        Every copilot role lists its own sessions. auditor lists all sessions of the tenant and may pass
        user_id. A user_id other than the caller's from a caller without auditor is answered 404, as is any
        session of another user (108-F3-AC9). No delete or hide operation exists in the demo (Q-162).
        Called only by the register-service relay operation of the same name (X3).
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: aidoc:copilot-session
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: user_id, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Sessions ordered by created_at descending
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CopilotSessionList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai-document/copilot/sessions/{session_id}/messages:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: askCopilot
      tags: [copilot]
      summary: Ask a question; JSON answer, or Server-Sent Events with Accept text/event-stream (108-F3-FR1 to FR10)
      description: >
        Streaming note: with `Accept: text/event-stream` the response is a Server-Sent Events
        stream of events `progress` (CopilotProgressEvent), `sentence` (CopilotSentenceEvent, one
        validated segment with its citations), `final` (CopilotAnswer) and `error` (Problem).
        Sentences are emitted only after citation validation, never as unvalidated text.
        Only the session owner may ask. Reads are made as the asking user (109-F3).
        In real-document mode without a recorded client approval reference the question is refused
        with 409 AIDOC_DATA_HANDLING_NOT_APPROVED before any model call, and the refusal is audited
        (108-F3-FR12, 108-AC4); this is the only copilot operation the guard refuses.
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: aidoc:copilot-message
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CopilotQuestion'}
      responses:
        '200':
          description: Answer (JSON) or event stream
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CopilotAnswer'}
            text/event-stream:
              schema:
                type: string
                description: >
                  SSE stream. Each event has `event:` one of progress, sentence, final, error and a
                  `data:` line holding the JSON of CopilotProgressEvent, CopilotSentenceEvent,
                  CopilotAnswer or Problem respectively.
              example: "event: progress\ndata: {\"message_key\":\"copilot.progress.reading_arrangements\"}\n\n"
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/ModelUnavailable'}
    get:
      operationId: listCopilotMessages
      tags: [copilot]
      summary: Messages of a session, oldest first (owner or auditor)
      description: >
        The owner reads the stored messages as written. A reader who is not the owner (auditor,
        108-F3-FR9) reads the questions, statuses, scope counts, interpretations and read lists, but
        each assistant segment with a record citation stored as confidential, or with a span
        citation to a contract segment the reader cannot read as themself (109-F3 policies), is
        returned with withheld true, empty text and no citations (109-F3-FR6). A grant held by the
        reader does not lift the withholding of a confidential record citation in the demo; lifting
        it by grant is PILOT (Confirmed by Dusan 2026-11-06, Q-169).
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor]
      x-surface: user
      x-audit-object: aidoc:copilot-message
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Messages ordered by seq ascending
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CopilotMessageList'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/ai-document/suggestions/{suggestion_id}/confirm:
    parameters:
      - name: suggestion_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: confirmSuggestion
      tags: [suggestions]
      summary: Record the human decision on one suggestion (108 FR6)
      description: >
        Records the human decision on one suggestion; the value would then be written by the
        owning service (register-service) with the returned decision id. In the demo every kind is
        refused (amendments below). AMENDED 2026-11-06 (108-F4 final analyze I1): base sentence no
        longer assigns roles to refused kinds.
        AMENDED 2026-11-06 (X3): kind register_field is refused with 422 AIDOC_VALIDATION;
        register-value decisions are recorded by register-service decideFieldSuggestions.
        AMENDED 2026-11-06 (108-F2, X3): kind clause_status is refused with 422 AIDOC_VALIDATION;
        clause-status and gap decisions are recorded by register-service setContractReviewItem
        and decideContractGaps with the suggestion reference; role legal removed.
        AMENDED 2026-11-06 (108-F4, X2, X3): kinds ict_relevance, ict_service_type, function_link,
        critical_support and nbs_critical_key are refused with 422 AIDOC_VALIDATION; their decisions
        are recorded by register-service (proposeClassification, updateRequest
        function_link_decisions, recordCriticalityDecision) with the suggestion reference, and
        approved only through platform decideApproval. Every kind is now refused, so the operation
        has no demo caller and writes no aidoc.suggestion_decisions row; it is kept as x-scope PILOT
        and its removal or reuse is decided at the pilot contract review.
      x-roles: [outsourcing-manager, compliance]
      x-scope: PILOT
      x-surface: user
      x-audit-object: aidoc:suggestion-decision
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmRequest'}
      responses:
        '201':
          description: Decision recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Decision'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
  /api/v1/ai-document/signal-relevance:
    post:
      operationId: judgeSignalRelevance
      tags: [signal-relevance]
      summary: Relevance judgement of one external signal for the tenant's providers (104-F5-FR3, FR5)
      description: >
        Synchronous call from monitoring-service (104-F5 plan, AI relevance adapter). Uses the
        ModelGateway classify operation. The result is a suggestion: monitoring-service stores
        the signal ai_suggested and pending_review, and it counts only after a named user
        confirms it (104-F5-FR6, constitution III.2 and IX.5). Stateless: nothing is stored in
        aidoc except the audit record; the caller keeps rationale and model_ref with the signal.
      x-roles: [service]
      x-surface: service
      x-audit-object: aidoc:signal-relevance
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SignalRelevanceRequest'}
      responses:
        '200':
          description: Judgement
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignalRelevanceJudgement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationFailed'}
        '503': {$ref: '#/components/responses/ModelUnavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: {type: string, format: uuid}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
  responses:
    JobAccepted:
      description: Job accepted
      headers:
        Location:
          description: URL of the job resource
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/JobAccepted'}
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthenticated:
      description: Missing or invalid credential (AIDOC_UNAUTHENTICATED)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Authenticated but not permitted (AIDOC_FORBIDDEN)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Not found or not visible to the caller (AIDOC_NOT_FOUND)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: >
        State conflict: AIDOC_SUGGESTION_ALREADY_DECIDED, AIDOC_SUGGESTION_SUPERSEDED,
        AIDOC_DATA_HANDLING_NOT_APPROVED, AIDOC_LANGUAGE_UNKNOWN, AIDOC_ORDER_VIOLATION
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    FileTooLarge:
      description: File over 20 MB or 300 pages (AIDOC_FILE_TOO_LARGE)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationFailed:
      description: >
        Validation failure: AIDOC_VALIDATION, AIDOC_UNSUPPORTED_FORMAT, AIDOC_NO_TEXT_LAYER,
        AIDOC_BATCH_TOO_LARGE
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ModelUnavailable:
      description: Model endpoint unavailable, retry later (AIDOC_MODEL_UNAVAILABLE; deviation recorded in 108-F1 plan Complexity tracking)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    ErrorCode:
      type: string
      description: Stable error codes of this service with status and title
      enum:
        - AIDOC_UNAUTHENTICATED
        - AIDOC_FORBIDDEN
        - AIDOC_NOT_FOUND
        - AIDOC_VALIDATION
        - AIDOC_UNSUPPORTED_FORMAT
        - AIDOC_NO_TEXT_LAYER
        - AIDOC_FILE_TOO_LARGE
        - AIDOC_BATCH_TOO_LARGE
        - AIDOC_LANGUAGE_UNKNOWN
        - AIDOC_SUGGESTION_ALREADY_DECIDED
        - AIDOC_SUGGESTION_SUPERSEDED
        - AIDOC_ORDER_VIOLATION
        - AIDOC_DATA_HANDLING_NOT_APPROVED
        - AIDOC_MODEL_UNAVAILABLE
      examples: [AIDOC_NO_TEXT_LAYER]
      x-error-catalog:
        AIDOC_UNAUTHENTICATED: {status: 401, title: Authentication required}
        AIDOC_FORBIDDEN: {status: 403, title: Operation not permitted for this role}
        AIDOC_NOT_FOUND: {status: 404, title: Resource not found}
        AIDOC_VALIDATION: {status: 422, title: Request validation failed}
        AIDOC_UNSUPPORTED_FORMAT: {status: 422, title: Unsupported document format}
        AIDOC_NO_TEXT_LAYER: {status: 422, title: Document has no text layer}
        AIDOC_FILE_TOO_LARGE: {status: 413, title: Document too large}
        AIDOC_BATCH_TOO_LARGE: {status: 422, title: Too many documents in batch}
        AIDOC_LANGUAGE_UNKNOWN: {status: 409, title: Document language must be set before analysis}
        AIDOC_SUGGESTION_ALREADY_DECIDED: {status: 409, title: Suggestion already decided}
        AIDOC_SUGGESTION_SUPERSEDED: {status: 409, title: Suggestion superseded by a newer run}
        AIDOC_ORDER_VIOLATION: {status: 409, title: Decide the function links before critical support}
        AIDOC_DATA_HANDLING_NOT_APPROVED: {status: 409, title: Model endpoint not approved for client documents}
        AIDOC_MODEL_UNAVAILABLE: {status: 503, title: Model endpoint unavailable}
    Problem:
      type: object
      required: [type, title, status, error_code, correlation_id]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        error_code: {$ref: '#/components/schemas/ErrorCode'}
        correlation_id: {type: string}
        errors:
          type: array
