  /api/v1/register/approvals/{approval_id}/apply:
    post:
      operationId: applyApproval
      tags: [f0-base-register]
      summary: Decide a pending 109-F4 approval of a subject this service owns and apply the change in one transaction (109-F4-FR10)
      description: >
        Called only by the platform decideApproval handler, synchronously, with the checker's identity
        (109-F4 plan D6). The service calls platform.decide_approval (role, delegation, identity and stale
        checks) and applies the proposed change in the same transaction, or does neither. Added 2026-11-04
        (independent review H5). Kinds owned here include register_entry_approval for a manual arrangement
        creation during the migration clean-up (Q-095) and register_record_edit, which applies the staged
        reportable field values of a manual edit (Q-114); a reportable field changed again since the request
        makes the approval stale.
        104-F2 kinds applied here (104-F2-FR11, Dusan decision 2026-11-06, X2): critical_important_classification,
        lifecycle_final_approval, register_entry_approval, exit_plan_approval; classification_confirmation is applied
        here by 104-F1 (104-F1-FR4, FR5): approve sets the classification confirmed, supersedes the earlier confirmed
        one and writes the arrangement's category, scope flags and current classification (for a classification whose subject is a
        lifecycle request, approve sets only the classification; 104-F2 register entry writes the arrangement columns);
        reject sets it returned with the reason. manual_entry_closure (104-F0-FR5, Q-147) sets manual_entry_open false.
        function_criticality_confirmation is applied here by 104-F4 (104-F4-FR1): approve sets the decision confirmed,
        supersedes the function's earlier confirmed decision, sets the function's current criticality decision and the
        B_06.01 critical-or-important value; reject sets it returned with the reason.
        104-F6 kinds applied here (104-F6-FR4, FR11, Dusan decision X2, 2026-11-06): export_submission_marking
        (checker compliance, never expires): approve sets the submission confirmed and the export submitted and, for an
        nbs_notification_pack export, sets the pack's notified_on to the submission date; reject sets the submission
        returned with the reason and the export back to not_submitted. reporting_configuration_change (checker a second
        compliance user or an admin): approve makes the proposed version current and the previous one superseded, audited
        before and after; reject sets the proposed version rejected. The operation and its
        dispatcher are created by 104-F0 block 2 (2026-11-06, finding 104-F0 H2); each functionality registers its handlers.
        Refusal results of decide_approval commit (109-F4 plan D10): no subject change, the refusal audit event and
        any stale state persist, then the service answers, for every kind it owns (Dusan decision 2026-11-06, gate
        close-out of 109-F4, finding I1; same mapping as ict-risk-service, 107-F0 plan D-2): refused_four_eyes with
        409 REGISTER_FOUR_EYES (caller is the maker or an excluded identity); refused_not_checker with 403
        PLATFORM_NOT_IN_MATRIX (no checker role or valid delegation at decision time); stale with 409
        PLATFORM_APPROVAL_STALE (subject changed since the request, including a reportable field of a
        register_record_edit changed again); not_pending with 409 PLATFORM_APPROVAL_NOT_PENDING (already decided,
        for example the losing side of two concurrent decisions). The three PLATFORM_ codes are platform
        decide_approval results that this operation relays; platform decideApproval relays all four unchanged.
      x-roles: [service:platform]
      x-surface: service
      x-audit-object: platform:approval
      x-scope: DEMO
      parameters:
        - {name: approval_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, reject]}
                reason: {type: [string, 'null'], maxLength: 2000, description: Required when decision is reject}
      responses:
        '200':
          description: Decision recorded; on approve the change is applied
          content:
            application/json:
              schema:
                type: object
                required: [approval_id, state]
                properties:
                  approval_id: {type: string, format: uuid}
                  state: {type: string, enum: [approved, rejected]}
                  subject_id: {type: string}
        '403': {$ref: '#/components/responses/E403'}
        '404': {$ref: '#/components/responses/E404'}
        '409': {$ref: '#/components/responses/E409'}
        '422': {$ref: '#/components/responses/E422'}
