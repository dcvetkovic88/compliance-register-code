        '401': {$ref: '#/components/responses/E401'}
        '404': {$ref: '#/components/responses/E404'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    limit:
      name: limit
      in: query
      required: false
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from next_cursor
      schema:
        type: string
    q:
      name: q
      in: query
      required: false
      description: 'Prefix match on the registered legal name or the Latin search alias, after the 104 research R-9 normalization, for the query and both of its Serbian transliterations (110-F1-FR12, plan D9; Q-125 demo default), or prefix match on the identification code'
      schema:
        type: string
    category:
      name: category
      in: query
      required: false
      description: Confirmed category
      schema:
        type: string
        enum:
        - ict_outsourcing
        - non_ict_outsourcing
        - ordinary_purchase
    scope:
      name: scope
      in: query
      required: false
      description: Register scope view (104-F1-FR1)
      schema:
        type: string
        enum:
        - dora
        - national
        - inventory
    status:
      name: status
      in: query
      required: false
      description: Arrangement status
      schema:
        type: string
        enum:
        - active
        - exit_in_progress
        - terminated
    provider_id_q:
      name: provider_id
      in: query
      required: false
      description: Filter by provider
      schema:
        type: string
        format: uuid
    project_id_q:
      name: project_id
      in: query
      required: false
      description: Filter by project
      schema:
        type: string
        format: uuid
    arrangement_id_q:
      name: arrangement_id
      in: query
      required: false
      description: Filter by arrangement
      schema:
        type: string
        format: uuid
    campaign_id_q:
      name: campaign_id
      in: query
      required: false
      description: Filter by campaign
      schema:
        type: string
        format: uuid
    classification:
      name: classification
      in: query
      required: false
      description: Providers with at least one arrangement whose confirmed 104-F1 category equals the value (108-F3 copilot filter, Q-014)
      schema:
        type: string
        enum:
        - ict_outsourcing
        - non_ict_outsourcing
        - ordinary_purchase
    missing_for_regulation:
      name: missing_for_regulation
      in: query
      required: false
      description: '104-F7-FR1 drill-down (Q-161 (d)): an active regulation id, or `all` for the combined figure. Keeps the providers
        whose own record or any of whose arrangements has at least one empty field required by that regulation''s active catalog (all
        active catalogs for `all`), and returns them ordered by that missing-field count descending, then provider_id ascending; each
        item''s missing_field_count is then the count for that regulation, over the provider record and its arrangements. An inactive
        or unknown regulation id is refused with 422 REGISTER_VALIDATION'
      schema:
        type: string
        minLength: 1
    subcontractor_only:
      name: subcontractor_only
      in: query
      required: false
      description: 'Third-party inventory filter (104-F1, Dusan decision 2026-11-05, Q-023): true keeps only providers marked sub-contractor
        only (direct provider of no arrangement, present in a supply chain at rank 2 or more); false keeps only providers with at least one
        direct arrangement; absent lists both'
      schema:
        type: boolean
    critical_support:
      name: critical_support
      in: query
      required: false
      description: 'Criticality filter (Q-014): true keeps arrangements that support at least one function whose confirmed criticality is critical
        or important (B_06.01.0050), false keeps the others; on listProviders it applies to the provider''s arrangements (at least one match)'
      schema:
        type: boolean
    exit_plan_present:
      name: exit_plan_present
      in: query
      required: false
      description: 'Exit plan filter on the current assessment''s B_07.01.0080 (Q-014): true keeps arrangements whose value is true, false keeps
        arrangements whose value is false or not recorded; on listProviders a provider matches when at least one of its arrangements matches'
      schema:
        type: boolean
    gap_status:
      name: gap_status
      in: query
      required: false
      description: 'Contract checklist gap filter (104 FR3, Q-014): arrangements with at least one clause of the latest contract review whose final
        status equals the value; combined with clause_id, that clause only; on listProviders at least one arrangement matches'
      schema:
        type: string
        enum:
        - present
        - missing
        - unclear
        - not_applicable
    include_total:
      name: include_total
      in: query
      required: false
      description: 'When true, the page carries total, the number of arrangements visible to the caller under the 109-F3 row rules that match
        the other filters (108-F3-FR4, the copilot scope count; added 2026-11-06). Counts only rows the caller can read, so it reveals nothing
        a full listing would not'
      schema:
        type: boolean
        default: false
    clause_id_q:
      name: clause_id
      in: query
      required: false
      description: Catalog clause id, as `<regulation_id>:<clause_id>`, narrowing gap_status to one clause (Q-014); ignored without gap_status
      schema:
        type: string
    function_id_q:
      name: function_id
      in: query
      required: false
      description: Arrangements linked to this function through arrangement_functions (Q-014)
