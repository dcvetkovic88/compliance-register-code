teFunction and updateFunction refuse the B_06.01 critical-or-important field with 422 REGISTER_VALIDATION; it is never staged as register_record_edit and is written only by the function_criticality_confirmation handler | AMENDED 2026-11-06 (104-F6 speckit-clarify, autonomous Spec Kit run; docs/analyze-2026-11-06.md 104-F6 H1, H2; Dusan decision X2; Q-058 PROPOSED): decideRegisterExportSubmission and SubmissionDecisionInput removed; proposeRegisterExportSubmission is the maker submit call of export_submission_marking (202); ExportSubmission gains approval_id; applyApproval states the export_submission_marking and reporting_configuration_change handlers; ExportJobInput and RegisterExport gain reporting_date (B_01.01.0060); RegisterExport.output gains nbs_notification_pack, created by buildNotificationPack, and profile_id and profile_version are nullable | AMENDED 2026-11-06 (104-F7 speckit-clarify, autonomous Spec Kit run; docs/analyze-2026-11-06.md 104-F7 C1, H1, H2, L; Q-101 PROPOSED): RegisterSummary carries every 104-F7 register figure: providers_by_classification with the ICT split by criticality (FR2, replaces by_category), completeness as the 104 FR9 CompletenessFigure items with fixture_catalog_active (FR1), lifecycle per 104-F2 step with past_due against step_due_days (FR4), remediation.by_priority with open and past-due tasks per tier (FR3), concentration.multi_function_top and single_provider_top, five each (FR6); completeness is optional and omitted for requesters (Q-096); getRegisterSummary states its scope; drill-down filters added so every figure equals its list (104-F7-FR10, plan D-4): listRequests lifecycle_step, listRemediationTasks active and tier | AMENDED 2026-11-06 (104-F7 speckit-plan re-run, analyze G2; Q-161 (d) Confirmed by Dusan 2026-11-06): listProviders gains missing_for_regulation, the 104-F7-FR1 drill-down (providers with at least one empty required field of the regulation, ordered by that count) | AMENDED 2026-11-06 (108-F3 speckit-clarify, autonomous Spec Kit run; docs/analyze-2026-11-06.md 108-F3 H2, M; Dusan decision X3): copilot relay operations createCopilotSession, listCopilotSessions, askCopilot and listCopilotMessages added under /api/v1/register/copilot/ (tag copilot-relay; the web app reaches the copilot only through register-service, which forwards the user token to ai-document-service and relays answer, event stream and Problem unchanged, 108-F3-FR13); listArrangements gains include_total and ArrangementPage.total (count of the caller's visible arrangements matching the filters, the copilot scope count, 108-F3-FR4) | AMENDED 2026-11-06 (108-F3 speckit-plan, speckit-analyze re-run F1): the four copilot-relay operations carry x-audit-object none, so one question writes one question audit event (ai-document-service), as 108-F3-AC9 requires | AMENDED 2026-11-06 (104-F2 speckit-plan, final analyze of 104-F2 finding I1): requestCriticalitySuggestion and getRequestCriticalitySuggestions are built by 104-F2 T4.2 (104 is reached before 108 in the build order); 108-F4 T6.1 adds only its cases to them | AMENDED 2026-11-06 (109-F3 speckit-plan, analyze report final-109-F3 finding H2): startRegisterExport describes the 109-F3-FR8 pre-check run as the calling user for the regulatory outputs, the snapshot under the starting user's claims and its re-check, and error code REGISTER_EXPORT_SCOPE_NOT_READABLE (403) is added; built by 104-F0 T6.3 (reached first in the build order), extended by 104-F6 | AMENDED 2026-11-06 (109-F3 speckit-plan, analyze report final-109-F3-c1t1 S1; Confirmed by Dusan 2026-11-06, Q-166): getRegisterExport, downloadRegisterExport and getRegisterExportFile state the 109-F3-FR8 read rule (P08 and every confidential record of the register readable at the time of the read, starter included; 404 otherwise, 109-F3 plan D12) | AMENDED 2026-11-06 (110-F1 speckit-plan, final analyze of 110-F1 finding I1): FieldSuggestion, RequestCriticalitySuggestionSet items and ContractReviewItem.proposal gain rationale_locale (en or sr-Latn), copied from the ai-document-service Suggestion, so the web app transliterates only sr-Latn rationale in a sr-Cyrl session and shows en rationale unchanged (110-F1 plan D6); written by 104-F2 T3.3 and 108-F2 (reached first in the build order for each copy) | AMENDED 2026-11-06 (104-F1 speckit-plan, analyze report final-104-F1 finding U1): applyApproval states that approving a request-subject classification_confirmation sets only the classification, the arrangement columns are written at 104-F2 register entry | AMENDED 2026-11-06 (104-F1 speckit-plan, analyze report final-104-F1-c1t1 findings F1, L2): proposeClassification keeps its 422 response and its description names the 422 error codes of 104-F1-AC1 and AC2 (REGISTER_CLASSIFICATION_INCOMPLETE, REGISTER_VALIDATION for a blank rationale, REGISTER_OVERRIDE_REASON_REQUIRED); its 201 is described as the proposed classification with its pending approval | AMENDED 2026-11-06 (108-F2 speckit-plan, analyze report final-108-F2 findings F1, F2): x-roles of startContractReview, setContractReviewItem, completeContractReview and decideContractGaps are the P05 holders of the 109-F1 matrix (outsourcing-manager, compliance, legal), since the matrix governs (109-F1-FR3); the decideContractGaps rule limiting legal to campaign gaps is removed; setContractReviewItem no longer calls itself the only place a clause status is recorded, since a campaign gap decision writes a status on a review of source remediation | AMENDED 2026-11-06 (104-F3 speckit-plan, analyze report final-104-F3 F1, F2): listRemediationItems and CampaignItem.rank state when rank is set (after the campaign job checks every item, recomputed on each gap decision) and the order of items with no gap; RemediationCampaign example totals aligned with 104-F3-AC4 (13 arrangements with gaps, 17 gaps, P1 6) | AMENDED 2026-11-06 (104-F3 speckit-plan, analyze report final-104-F3-c1t1 U1, U2): CampaignItem.check_status is null while the campaign job has not finished the item, and failed or no_document count as checked for ready; ContractGap.remediation_task_id states that it holds the created or the linked open task | AMENDED 2026-11-06 (104-F6 speckit-plan, analyze report final-104-F6 M1, M2, M3, L4; Q-168 Confirmed by Dusan 2026-11-06): ReportingConfiguration gains state, based_on_version and approval_id, so the 202 of updateReportingConfiguration shows the pending version; downloadRegisterExport gains the artifact query parameter (csv, json, document for nbs_register_view; the document is an XLSX workbook) and names nbs_notification_pack among the zip outputs; export profiles are not editable in the demo (profile editing [PILOT]) | AMENDED 2026-11-06 (104-F6 speckit-plan, analyze report final-104-F6-c1t1 I1): downloadRegisterExport artifact enum drops the csv alias; the CSV view of nbs_register_view is the primary artifact, and json or document on any other output, its_view included, answers 404 | AMENDED 2026-11-06 (108-F3 speckit-plan, analyze report final-108-F3-c1t1 I1): the copilot relay passes each request through unchanged except the locale of createCopilotSession and askCopilot, which it sets to aiLocale of the session locale (110-F1 T3.5), so no request to ai-document-service carries sr-Cyrl (110-F1 T7.1) | AMENDED 2026-11-06 (109-F3 speckit-plan, analyze report final-109-F3-c2t1 F1; Confirmed by Dusan 2026-11-06, Q-170): Arrangement.confidential and Document.confidential are read-only values derived from the 109-F3 marking of the arrangement or case (platform.is_marked_confidential), set only through setConfidential (P64, audited); confidential removed from ArrangementPatch, ArrangementInput and DocumentUpload, so no register write marks a record or a single document | AMENDED 2026-11-06 (110-F1 speckit-plan, independent analyze final-110-F1-p1 C1): ContractReviewItem gains clause_text (published text, its language and the catalog translation sidecars) so the contract checklist reads carry the clause and its translation (110-F1-FR5, AC5; written by 110-F1 T6.3) | AMENDED 2026-11-06 (104-F0 speckit-plan, analyze report final-104-F0-p1 A1; Confirmed by Dusan 2026-11-06, Q-171): getRegisterSettings authorized by 109-F1 P01 and admin removed from its x-roles; updateRegisterSettings authorized per field by P06 (match_rule_order) and P80 (104-F2 lifecycle fields), x-roles outsourcing-manager only; lookupRegisterRecords (P01) and listAssetEngagements (P29) state their user-token action ids and gain requester under its row scope | AMENDED 2026-11-06 (107-F1 analyze G1): RegisterLookupInput gains provider_identification_codes and function_identifiers (exact, tenant-scoped match for the 107-F1-FR6 import link columns); RegisterLookupResult gains unresolved_provider_identification_codes and unresolved_function_identifiers | AMENDED 2026-11-06 (108-F2 speckit-plan, independent analyze final-108-F2-p1 F1): listContractReviews computes ContractReview.outdated on read and writes nothing (contract_reviews.outdated_at removed), so a complete review stays immutable | AMENDED 2026-11-06 (108-F3 speckit-plan, analyze report final-108-F3-p1 H2): the askCopilot relay names the relayed 409 AIDOC_DATA_HANDLING_NOT_APPROVED of the real-document guard (108-F3-FR12); no operation added | AMENDED 2026-11-06 (Dusan decision 2026-11-06, gate close-out of 104-F2; analyze report final-104-F2-p2 G1): setDemoClock added (demo-only, x-scope DEMO, 104-F2 plan D12): sets the tenant's demo clock forward so the presenter can move the NBS waiting period of the scene (104-F2-FR14, AC6, AC12); schema DemoClock and error code REGISTER_DEMO_MODE_OFF (403 in production mode) added | AMENDED 2026-11-06 (Dusan decision 2026-11-06, gate close-out of 109-F4; analyze report final-109-F4-p2 I1): applyApproval states the 109-F4 D10 commit-on-refusal rule and the result-to-code mapping for every register-owned kind (refused_four_eyes 409 REGISTER_FOUR_EYES, refused_not_checker 403 PLATFORM_NOT_IN_M