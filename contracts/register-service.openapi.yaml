openapi: 3.1.0
info:
  title: register-service API (standalone build)
  version: 0.2.0-draft
  description: 'Status: DRAFT | Added 2026-11-04 by decision of Dusan (Raiffeisen Demo Decisions and Build Brief). Operations of 104-F0 to 104-F4,
    104-F6 export, the ControlStatusPort stand-in and batched lookups. L1: docs/standalone/register-standalone-spec.md. Frozen at planning-done
    (constitution IX.2). Rules: docs/standards/api-standards.md (RFC 9457 errors, cursor pagination, jobs for long work). Identifiers are UUID
    strings. Tenant comes from the verified subject, never from the path. AMENDED 2026-11-05: 104-F6 operations merged (placeholders replaced);
    control status stand-in (list, add and close status input) and batched lookups for 107-F1, 107-F2 and 104-F5 added; 104-F0 operations added
    (field schema, manual arrangement, arrangement-function edit, assessment, catalogs, contract checklist, reconciliation [DEMO], completeness,
    getControlStatuses); reason: cross-file reconciliation of the standalone specs. AMENDED 2026-11-04 (independent review H5, C2): request states final_approval and entry_approval, enterIntoRegister staged by register_entry_approval, submitRemediationCampaignSignOff and applyApproval added; updateReportingConfiguration x-roles emptied until 104-F6 Q-8 is answered (L9). AMENDED 2026-11-05 (Dusan decisions Q-006, Q-008 to Q-010, Q-014): updateReportingConfiguration is the compliance maker action of the 109-F4 kind reporting_configuration_change (202, applied through applyApproval); retireProvider, retireFunction, Retirement and all_arrangements_terminated added, retired flags of the lookups defined as the explicit state; listProviders gains classification, critical_support, exit_plan_present, gap_status, clause_id and listArrangements gains function_id, critical_support, exit_plan_present, gap_status, clause_id for the 108-F3 copilot. AMENDED 2026-11-05 (Dusan decision Q-019): the five reconciliation operations are in the demo scope (x-scope DEMO). AMENDED 2026-11-05 (Dusan decisions Q-023, Q-038): Provider gains the derived subcontractor_only flag and listProviders the subcontractor_only filter (third-party inventory lists sub-contractor-only providers); notice_period_days removed from Arrangement, ArrangementInput and ArrangementPatch (notice periods held once as ITS fields B_02.02.0100 and B_02.02.0110), next_renewal_date described as register-only with next_renewal_date_source, and the register lookup arrangements carry next_renewal_date.'
servers:
- url: http://localhost:8081
  description: register-service in the local Docker Compose stack
security:
- bearerAuth: []
tags:
- name: records
  description: Shared register records (104 FR1 levels) and jobs
- name: f0-base-register
  description: '104-F0 base register (104 S1): field schema, record writes, contract checklist, reconciliation [DEMO], completeness, control
    stand-in'
- name: f1-provider-classification
  description: 104-F1 provider classification
- name: f2-new-provider-lifecycle
  description: 104-F2 new provider lifecycle
- name: f3-existing-providers-track
  description: 104-F3 existing providers track
- name: f4-dependency-map
  description: 104-F4 dependency map
- name: export
  description: 104-F6 register of information export (xBRL-CSV), NBS views, reporting configuration and NBS notification pack
- name: controls
  description: 'Control status stand-in for COV-S3 (L1 section 5, ControlStatusPort): status inputs with precedence failing > stale > unknown
    > satisfied'
- name: lookups
  description: Batched cross-context reads for ict-risk-service (107-F1 RegisterLookupPort, 107-F2) and monitoring-service (104-F5)
- name: copilot-relay
  description: '108-F3 compliance copilot reached by the web app through register-service (Dusan decision 2026-11-06, X3): each operation forwards
    the caller''s bearer token to the ai-document-service operation of the same name, passing the request through unchanged except the locale of createCopilotSession and askCopilot, set to aiLocale of the given locale (en stays en, sr-Latn and sr-Cyrl become sr-Latn; 110-F1 T3.5), and relays its response unchanged; nothing is stored here and the relay writes no audit event of its own (x-audit-object none): the question and read events are written by ai-document-service and the owning read services (108-F3-AC9)'
paths:
  /api/v1/register/providers:
    get:
      operationId: listProviders
      summary: List providers
      tags:
      - records
      x-roles:
      - outsourcing-manager
      - security
      - it-governance
      - compliance
      - legal
      - auditor
      - requester
      x-surface: user
      x-audit-object: register.provider
      x-functionality: records
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/classification'
      - $ref: '#/components/parameters/critical_support'
      - $ref: '#/components/parameters/exit_plan_present'
      - $ref: '#/components/parameters/gap_status'
      - $ref: '#/components/parameters/clause_id_q'
      - $ref: '#/components/parameters/subcontractor_only'
      - $ref: '#/components/parameters/missing_for_regulation'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderPage'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
    post:
      operationId: createProvider
      summary: Create a provider
      tags:
      - records
      x-roles:
      - outsourcing-manager
      x-surface: user
      x-audit-object: register.provider
      x-functionality: records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderInput'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
  /api/v1/register/providers/{provider_id}:
    get:
      operationId: getProvider
      summary: Get a provider
      tags:
      - records
      x-roles:
      - outsourcing-manager
      - security
      - it-governance
      - compliance
      - legal
      - auditor
      - requester
      x-surface: user
      x-audit-object: register.provider
      x-functionality: records
      parameters:
      - $ref: '#/components/parameters/provider_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '422':
          $ref: '#/components/responses/E422'
    patch:
      operationId: updateProvider
      summary: Update a provider
      tags:
      - records
      x-roles:
      - outsourcing-manager
      x-surface: user
      x-audit-object: register.provider
      x-functionality: records
      parameters:
      - $ref: '#/components/parameters/provider_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '202':
          description: 'Pending approval of kind register_record_edit (104-F0-FR8, Dusan decision 2026-11-05, Q-114): the request changed at least one reportable field (ITS column field or NBS catalog field); its other fields are applied at once and listed in applied_field_ids, the reportable ones are staged until a different eligible user approves'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagedChange'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
  /api/v1/register/providers/{provider_id}/retirement:
    post:
      operationId: retireProvider
      summary: Mark a provider retired with a reason (109-F1 P85; Dusan decision 2026-11-05, Q-008 to Q-010)
      description: Explicit retirement by the outsourcing manager, audited with before and after. Refused with 409 when already retired. The
        service never retires a provider automatically.
      tags:
      - records
      x-roles:
      - outsourcing-manager
      x-surface: user
      x-audit-object: register.provider
      x-functionality: records
      parameters:
      - $ref: '#/components/parameters/provider_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetirementInput'
      responses:
        '200':
          description: Retired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
        '409':
          $ref: '#/components/responses/E409'
  /api/v1/register/arrangements:
    get:
      operationId: listArrangements
      summary: List arrangements
      tags:
      - records
      x-roles:
      - outsourcing-manager
      - security
      - it-governance
      - compliance
      - legal
      - auditor
      - requester
      x-surface: user
      x-audit-object: register.arrangement
      x-functionality: records
      parameters:
      - $ref: '#/components/parameters/limit'
