  /api/v1/register/requests/{request_id}/criticality-suggestion:
    get:
      operationId: getRequestCriticalitySuggestions
      summary: Get the latest 108-F4 criticality suggestion set of a request (register copy)
      description: >
        Added 2026-11-06 (108-F4-FR7, FR8, X3). Built by 104-F2 T4.2 (owner by build order, amended 2026-11-06); the
        108-F4 cases are added by 108-F4 T6.1. Returns register-service's copy of the latest suggestion set with the
        decisions recorded on it, the outdated mark computed on this read (request changed, newer draft contract, or a
        confirmed change of a linked or listed function's criticality after the set was created) and, once function
        links are decided, the critical_support value re-derived by the 108-F4-FR4 rule from the decided links.
        404 when no set exists. apps/web never calls ai-document-service (X3).
      tags:
      - f2-new-provider-lifecycle
      x-roles:
      - outsourcing-manager
      - security
      - it-governance
      - compliance
      - legal
      - auditor
      - requester
      x-surface: user
      x-audit-object: register.request
      x-functionality: f2-new-provider-lifecycle
      parameters:
      - $ref: '#/components/parameters/request_id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCriticalitySuggestionSet'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '404':
          $ref: '#/components/responses/E404'
    post:
      operationId: requestCriticalitySuggestion
      summary: Request the 108-F4 AI criticality suggestion
      description: >
        104-F2 operation, built by 104-F2 T4.2 (owner by build order, amended 2026-11-06); behaviour of 108-F4
        amended 2026-11-06 (X3): register-service calls ai-document-service
        requestCriticalitySuggestion through AiDocumentClient with the user's token, records a running set and a Job
        (kind criticality_suggestion) that polls getCriticalitySuggestion and copies the set into
        register.request_criticality_suggestions. A re-run starts a new set; earlier sets and their decisions are kept
        (108-F4-FR8). 409 while a set of the request is running. When ai-document-service is unavailable the job fails
        with a reason and step 2 is completed by hand (108-F4 edge case).
