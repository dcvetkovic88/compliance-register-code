      summary: Record the critical-or-important decision
      description: >
        Maker submit call of the 109-F4 kind critical_important_classification (104-F2-FR2, FR11). Records the decision with its
        AI suggestion reference and outcome (register-service owns the decision record, X3) in state proposed and creates the pending approval;
        a compliance user other than the decider decides it only through platform decideApproval, applied here by applyApproval. No confirm
        operation exists (Dusan decision 2026-11-06, X2).
        108-F4-FR7 (c), added 2026-11-06: ai_suggestion_ref names the critical_support item of the latest register set,
        re-derived from the decided links; refused 409 while a function-link proposal of that set is undecided or the
        set is outdated, and 422 when the ref is not that item; ai_suggestion_outcome is accepted when
        critical_or_important equals the derived yes or no and overridden otherwise, and always overridden when the
        derived value is undetermined (422 on mismatch); a critical_support item under 108-F4-FR6 is not decidable (422).
