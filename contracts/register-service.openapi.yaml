                description: AMENDED 2026-11-06 (110-F1 final analyze I1) Language of rationale, en or sr-Latn, copied from the ai-document-service Suggestion.rationale_locale; the web app transliterates only sr-Latn text in a sr-Cyrl session (110-F1 plan D6)
