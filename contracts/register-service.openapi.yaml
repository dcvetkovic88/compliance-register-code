  responses:
    E400:
      description: Malformed request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E401:
      description: Missing or invalid credential
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E403:
      description: Not permitted
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E404:
      description: Not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E409:
      description: State conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E413:
      description: Payload too large
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    E422:
      description: Validation failure
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        error_code:
          type: string
        correlation_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
            required:
            - field
            - message
            additionalProperties: false
      required:
      - type
      - title
      - status
      - error_code
      - correlation_id
      additionalProperties: false
      examples:
      - type: https://errors.wiser.local/register/four-eyes
        title: Four-eyes rule
        status: 409
        detail: The confirming user must differ from the proposing user.
        error_code: REGISTER_FOUR_EYES
        correlation_id: c0f1a2b3
    JobAccepted:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
      required:
      - job_id
      additionalProperties: false
      examples:
      - job_id: 11111111-2222-4333-8444-555555555555
    Job:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - import_validate
          - import_commit
          - contract_batch_read
          - remediation_campaign
          - criticality_suggestion
          - contract_analysis
          - register_export
          - notification_pack_build
        state:
          type: string
          enum:
          - queued
          - running
          - done
          - failed
        result_ref:
          type:
          - string
          - 'null'
        error_code:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - job_id
      - kind
      - state
      - result_ref
      - error_code
      - created_at
      - finished_at
      additionalProperties: false
      examples:
      - job_id: 11111111-2222-4333-8444-555555555555
        kind: import_validate
        state: done
        result_ref: /api/v1/register/imports/11111111-2222-4333-8444-555555555555
        error_code: null
        created_at: '2026-11-04T09:00:00Z'
        finished_at: '2026-11-04T09:00:00Z'
    Provider:
      type: object
      properties:
        provider_id:
          type: string
          format: uuid
        identification_code:
          type:
          - string
          - 'null'
        identification_code_type:
          type:
          - string
          - 'null'
        legal_name:
          type: string
        legal_name_alias:
          type:
          - string
          - 'null'
          description: 'Latin search alias of the registered name (110-F1-FR12): used for search only, never displayed in place of legal_name, not reportable and not exported'
        is_infrastructure_provider:
          type: boolean
        fields:
          type: object
          description: 'Register field values keyed by field id (104 FR1 form: ITS column code or <level>.<slug>).'
          additionalProperties:
            type:
            - string
            - number
            - boolean
            - 'null'
        catalog_stamps:
          type: object
          description: 'Active catalogs when last written: {regulation_id: regulation_version} (constitution III.4).'
          additionalProperties:
            type: string
        missing_field_count:
          type: integer
        retirement:
          $ref: '#/components/schemas/Retirement'
        subcontractor_only:
          type: boolean
          description: 'Derived, read only (Q-023): true when the provider is the direct provider of no arrangement and appears in a supply
            chain at rank 2 or more; shown as "sub-contractor only" in the 104-F1 third-party inventory; such a provider has no classification
            and is outside the 104 FR5 reconciliation population (Q-144)'
        all_arrangements_terminated:
          type: boolean
          description: True when the provider has at least one arrangement and every arrangement is terminated; the screen warns the outsourcing
            manager to consider retirement; the provider is never retired automatically (Q-008)
        updated_at:
          type: string
          format: date-time
      required:
      - provider_id
      - identification_code
      - identification_code_type
      - legal_name
      - legal_name_alias
      - is_infrastructure_provider
      - subcontractor_only
      - fields
      - catalog_stamps
      - missing_field_count
      - updated_at
      additionalProperties: false
      examples:
      - provider_id: 11111111-2222-4333-8444-555555555555
        identification_code: 529900FICTIONAL00001
        identification_code_type: lei
        legal_name: Kestrel Cloud Services d.o.o.
        legal_name_alias: null
        is_infrastructure_provider: false
        subcontractor_only: false
        fields:
          B_05.01.0050: Kestrel Cloud Services d.o.o.
        catalog_stamps:
          dora: fixture-v1
        missing_field_count: 3
        updated_at: '2026-11-04T09:00:00Z'
    Retirement:
      type:
      - object
      - 'null'
      description: Explicit retirement state (data-model/register.md section 2, Retirement; Dusan decision 2026-11-05, Q-008 to Q-010); null when not
        retired. Retired records drop out of the impact, concentration and monitoring views.
      properties:
        retired_at:
          type: string
          format: date-time
        retired_by:
          type: string
          format: uuid
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - retired_at
      - retired_by
      - reason
      additionalProperties: false
    RetirementInput:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - reason
      additionalProperties: false
      examples:
      - reason: Contract ended and the service was migrated to another provider.
    ProviderInput:
      type: object
      properties:
        identification_code:
          type:
          - string
          - 'null'
        identification_code_type:
          type:
          - string
          - 'null'
        legal_name:
          type: string
          minLength: 1
          pattern: \S
        legal_name_alias:
          type:
          - string
          - 'null'
          minLength: 1
          pattern: ^[^\u0400-\u04FF]*\S[^\u0400-\u04FF]*$
          description: 'Latin search alias (110-F1-FR12); Cyrillic letters are refused with 422 REGISTER_VALIDATION; not a reportable field, applied at once (104-F0-FR8)'
        is_infrastructure_provider:
          type: boolean
        fields:
          type: object
          description: 'Register field values keyed by field id (104 FR1 form: ITS column code or <level>.<slug>).'
          additionalProperties:
            type:
            - string
            - number
            - boolean
            - 'null'
      required:
      - legal_name
      additionalProperties: false
      examples:
      - legal_name: Kestrel Cloud Services d.o.o.
        fields: {}
    ProviderPatch:
      type: object
      properties:
        identification_code:
          type:
          - string
          - 'null'
        identification_code_type:
          type:
          - string
          - 'null'
        legal_name:
          type: string
          minLength: 1
          pattern: \S
        legal_name_alias:
          type:
          - string
          - 'null'
          minLength: 1
          pattern: ^[^\u0400-\u04FF]*\S[^\u0400-\u04FF]*$
          description: 'Latin search alias (110-F1-FR12); Cyrillic letters are refused with 422 REGISTER_VALIDATION; not a reportable field, applied at once (104-F0-FR8)'
        is_infrastructure_provider:
          type: boolean
        fields:
          type: object
          description: 'Register field values keyed by field id (104 FR1 form: ITS column code or <level>.<slug>).'
          additionalProperties:
            type:
            - string
            - number
            - boolean
            - 'null'
      additionalProperties: false
      examples:
      - fields:
          B_05.01.0080: RS
    Arrangement:
      type: object
      properties:
        arrangement_id:
          type: string
          format: uuid
        reference:
          type: string
        provider_id:
          type: string
          format: uuid
        business_unit_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - active
          - exit_in_progress
          - terminated
        origin:
          type: string
          enum:
          - lifecycle
          - migration
          - manual
        category:
          type:
          - string
          - 'null'
          enum:
          - ict_outsourcing
          - non_ict_outsourcing
          - ordinary_purchase
          - null
        ict_service:
          type:
          - boolean
          - 'null'
        in_dora_scope:
          type: boolean
        in_national_scope:
          type: boolean
        current_classification_id:
          type:
          - string
          - 'null'
          format: uuid
        confidential:
          type: boolean
          readOnly: true
          description: 'Derived at read, never stored on the arrangement: true while the arrangement is marked confidential in platform.confidential_records
            (platform.is_marked_confidential). Set only through the platform operation setConfidential (P64, audited; 109-F3-FR4, plan D3,
            Q-170 Confirmed by Dusan 2026-11-06).'
        next_renewal_date:
          type:
          - string
          - 'null'
          format: date
          description: 'Register-only field, not an ITS column and never exported (Dusan decision 2026-11-05, Q-038): drives 104-F5 contract_renewal
            reminders and the 104-F3-FR4 due date; defaults to the end date B_02.02.0080 and is editable. Notice periods are held only as the
            ITS fields B_02.02.0100 and B_02.02.0110 of the arrangement_function rows.'
        next_renewal_date_source:
          type: string
          enum:
          - end_date
          - user
          description: 'end_date: the service keeps next_renewal_date equal to B_02.02.0080; user: set by an edit and kept when the end date
            changes (Q-038)'
        notification_period_breach:
          type: boolean
        fields:
          type: object
          description: 'Register field values keyed by field id (104 FR1 form: ITS column code or <level>.<slug>).'
          additionalProperties:
            type:
            - string
            - number
            - boolean
            - 'null'
        catalog_stamps:
          type: object
          description: 'Active catalogs when last written: {regulation_id: regulation_version} (constitution III.4).'
          additionalProperties:
            type: string
        missing_field_count:
          type: integer
        updated_at:
          type: string
          format: date-time
      required:
      - arrangement_id
      - reference
      - provider_id
      - business_unit_id
      - status
      - origin
      - category
      - ict_service
      - in_dora_scope
      - in_national_scope
      - current_classification_id
      - confidential
      - next_renewal_date
      - next_renewal_date_source
      - notification_period_breach
      - fields
      - catalog_stamps
      - missing_field_count
      - updated_at
      additionalProperties: false
      examples:
      - arrangement_id: 11111111-2222-4333-8444-555555555555
        reference: ARR-IT-01
        provider_id: 11111111-2222-4333-8444-555555555555
        business_unit_id: 11111111-2222-4333-8444-555555555555
        status: active
        origin: lifecycle
        category: ict_outsourcing
        ict_service: true
        in_dora_scope: true
        in_national_scope: true
        current_classification_id: 11111111-2222-4333-8444-555555555555
        confidential: false
        next_renewal_date: '2027-06-30'
        next_renewal_date_source: end_date
        notification_period_breach: false
        fields: {}
        catalog_stamps:
          dora: fixture-v1
        missing_field_count: 4
        updated_at: '2026-11-04T09:00:00Z'
    ArrangementPatch:
      type: object
      properties:
        fields:
          type: object
          description: 'Register field values keyed by field id (104 FR1 form: ITS column code or <level>.<slug>).'
          additionalProperties:
            type:
            - string
            - number
            - boolean
            - 'null'
        next_renewal_date:
          type:
          - string
          - 'null'
          format: date
          description: 'Register-only next renewal date (Q-038); a non-null value sets next_renewal_date_source to user; null returns it to
            the end date default (B_02.02.0080)'
      additionalProperties: false
      description: 'Confidentiality is not patched here: it is set only through the platform operation setConfidential (P64; 109-F3-FR4,
        plan D3)'
      examples:
      - next_renewal_date: '2027-06-30'
    Function:
      type: object
