  /api/v1/register/settings:
    get:
      operationId: getRegisterSettings
      summary: Tenant register settings
      description: Created by 104-F0 block 13 with the 104-F0 fields; 104-F2 adds its lifecycle fields (104-F2 plan D10, amended 2026-11-06).
        Authorized by 109-F1 P01 (104-F0-FR1, plan D-10; Confirmed by Dusan 2026-11-06, Q-171); admin is refused with 403.
      tags:
      - f0-base-register
      x-roles:
      - outsourcing-manager
      - security
      - it-governance
      - compliance
      - legal
      - auditor
      - requester
      x-surface: user
      x-audit-object: register.settings
      x-functionality: f0-base-register
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
    patch:
      operationId: updateRegisterSettings
      summary: Change tenant register settings
      description: Created by 104-F0 block 13; 104-F2 adds its lifecycle fields. manual_entry_open and the closure fields are read-only
        and change only through an applied manual_entry_closure (proposeManualEntryClosure). Authorized per field carried by 109-F1
        P06 (match_rule_order) and P80 (the 104-F2 lifecycle fields); a patch is refused with 403 unless the caller holds the id of every
        field it carries (104-F0-FR1, plan D-10; Confirmed by Dusan 2026-11-06, Q-171).
      tags:
      - f0-base-register
      x-roles:
      - outsourcing-manager
      x-surface: user
      x-audit-object: register.settings
      x-functionality: f0-base-register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '422':
          $ref: '#/components/responses/E422'
  /api/v1/register/settings/manual-entry/closure:
    post:
      operationId: proposeManualEntryClosure
      summary: Propose closing manual arrangement entry after the migration sign-off (104-F0-FR5, Dusan decision 2026-11-05, Q-147)
      description: Maker submit call of the 109-F4 kind manual_entry_closure (109-F1 P19). Creates the pending approval with subject the
        tenant settings and returns 202 StagedChange; manual_entry_open stays true until a compliance user other than the maker approves
        through platform decideApproval and applyApproval sets it false. The reason names the migration sign-off; the service does not
        test the migration state (Confirmed by Dusan 2026-11-06). 409 REGISTER_STATE_CONFLICT when a closure is pending or entry is already
        closed. No operation reopens manual entry.
      tags:
      - f0-base-register
      x-roles:
      - outsourcing-manager
      x-surface: user
      x-audit-object: register.settings
      x-functionality: f0-base-register
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: {type: string, minLength: 1, maxLength: 2000, description: Names the migration sign-off the closure follows}
      responses:
        '202':
          description: Closure staged for approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagedChange'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
  /api/v1/register/demo/clock:
    post:
      operationId: setDemoClock
      summary: Set the tenant's demo clock forward (demo mode only, 104-F2-FR14)
      description: Demo-only operation (104-F2 plan D12, Dusan decision 2026-11-06). Sets the demo time of the caller's tenant to `at`;
        register-service stores the difference to the real time as `settings.demo_clock_offset_seconds`, and the `Clock` port of 104-F2
        plan D7 returns the real time plus that offset for every lifecycle date, due date, reminder and NBS waiting check of the tenant.
        After the change the service runs the NBS waiting check and the due-date and reminder evaluation of the tenant once, before
        answering, so a request whose earliest signing date has been reached is already `ready_for_entry` when the response returns (104-F2-AC6).
        The clock only moves forward; `at` earlier than the current demo time is refused with 409 REGISTER_STATE_CONFLICT; the offset
        returns to zero only when the demo tenant is reseeded. In production mode (`platform.tenant_config.demo_mode` false, 109-F2)
        the operation is refused with 403 REGISTER_DEMO_MODE_OFF and the `Clock` port ignores any stored offset. Authorized by 109-F1
        P80 (the 104-F2 lifecycle settings; Confirmed by Dusan 2026-11-06, Q-171). Audited with the previous and the new demo time.
      tags:
      - f2-new-provider-lifecycle
      x-roles:
      - outsourcing-manager
      x-surface: user
      x-audit-object: register.settings
      x-functionality: f2-new-provider-lifecycle
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [at]
              properties:
                at: {type: string, format: date-time, description: The demo time to set; not earlier than the current demo time}
            example: {at: '2026-12-02T09:00:00Z'}
      responses:
        '200':
          description: Demo clock set; NBS waiting check and due-date evaluation run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoClock'
        '400':
          $ref: '#/components/responses/E400'
        '401':
          $ref: '#/components/responses/E401'
        '403':
          $ref: '#/components/responses/E403'
        '409':
          $ref: '#/components/responses/E409'
        '422':
          $ref: '#/components/responses/E422'
