      summary: Propose a classification
      description: >
        Maker submit call of the 109-F4 kind classification_confirmation (104-F1-FR4, Dusan decision X2): stores the
        classification as proposed and creates its pending approval through the platform approval helper in the same
        transaction. Confirmation and return go only through platform decideApproval, which calls applyApproval here;
        there is no confirm, return or bulk-confirm operation. A proposal for a subject whose approval is pending is
        refused 409; an older proposal whose approval was withdrawn, expired or stale is closed as returned and the
        new proposal is accepted (104-F1-FR5). Validation refusals are 422 (104-F1-AC1, AC2): REGISTER_CLASSIFICATION_INCOMPLETE
        when any of Q1 to Q3 is unknown and no category is derived, REGISTER_VALIDATION for a blank rationale, and
        REGISTER_OVERRIDE_REASON_REQUIRED when the proposed category differs from the derived one without a non-blank
        override reason.
