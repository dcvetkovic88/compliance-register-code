    RegisterSummary:
      type: object
      properties:
        as_of:
          type: string
          format: date-time
        register_counts:
          type: object
          properties:
            dora_scope:
              type: integer
            national_scope:
              type: integer
            inventory:
              type: integer
            classification_pending:
              type: integer
              minimum: 0
              description: 104-F7-FR2 figure "arrangements pending classification". A count of arrangements, not of providers -
                the arrangements without a confirmed classification (104-F1-FR7 pending total, a returned classification
                included). Equals the count of listArrangements with classification_pending=true for the same caller, which is
                its drill-down (104-F7-FR10)
          required:
          - dora_scope
          - national_scope
          - inventory
          - classification_pending
          additionalProperties: false
        providers_by_classification:
          type: object
          description: 104-F7-FR2. Each figure is the count of listProviders for the same filters, so a drill-down lists
            exactly the counted providers - ict_outsourcing, non_ict_outsourcing and ordinary_purchase count providers with at
            least one arrangement of that confirmed 104-F1 classification (filter classification; a provider with arrangements
            of two classifications counts under both); ict_outsourcing_by_criticality counts classification ict_outsourcing
            with critical_support true and with critical_support false (Q-014 semantics, at least one matching arrangement, so
            a provider with both kinds of arrangement counts in both)
          properties:
            ict_outsourcing:
              type: integer
              minimum: 0
            non_ict_outsourcing:
              type: integer
              minimum: 0
            ordinary_purchase:
              type: integer
              minimum: 0
            ict_outsourcing_by_criticality:
              type: object
              properties:
                critical_or_important:
                  type: integer
                  minimum: 0
                not_critical_or_important:
                  type: integer
                  minimum: 0
              required:
              - critical_or_important
              - not_critical_or_important
              additionalProperties: false
          required:
          - ict_outsourcing
          - non_ict_outsourcing
          - ordinary_purchase
          - ict_outsourcing_by_criticality
          additionalProperties: false
        completeness:
          type: object
          description: 104-F7-FR1, the 104 FR9 figures per active regulation and combined (the same items as
            getRegisterCompleteness). Optional; omitted when the caller holds only the requester role (no register completeness
            figures for requesters, Q-096); items is empty when no regulation catalog is active
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CompletenessFigure'
            fixture_catalog_active:
              type: boolean
              description: true while any active catalog is a FIXTURE (the fixture banner shows, 104 FR8)
          required:
          - items
          - fixture_catalog_active
          additionalProperties: false
        requests_by_state:
          type: object
          additionalProperties:
            type: integer
        requests_overdue:
          type: integer
        lifecycle:
          type: array
          description: '104-F7-FR4. One entry per 104-F2 step, in step order. Request states per step: initiation draft;
            pre_assessment pre_assessment; contract_check contract_check; review in_review, changes_requested and
            final_approval; register_entry nbs_notification, nbs_waiting, ready_for_entry and entry_approval; monitoring_exit
            registered. The terminal states out_of_scope, rejected and withdrawn are not counted. past_due counts the requests
            of the step whose current 104-F2-FR12 due date has passed (tenant step_due_days, business days); it is null for
            initiation and monitoring_exit, which have no due period'
          minItems: 6
          maxItems: 6
          items:
            type: object
            properties:
              step:
                type: string
                enum:
                - initiation
                - pre_assessment
                - contract_check
                - review
                - register_entry
                - monitoring_exit
              count:
                type: integer
                minimum: 0
              past_due:
                type:
                - integer
                - 'null'
                minimum: 0
            required:
            - step
            - count
            - past_due
            additionalProperties: false
        remediation:
          type: object
          description: p1, p2 and p3 count arrangements per 104-F3-FR2 tier; by_priority counts the open remediation tasks
            (states open and in_progress, 104-F3-FR4) per tier of their arrangement and, of those, the tasks past their due
            date (104-F7-FR3)
          properties:
            p1:
              type: integer
            p2:
              type: integer
            p3:
              type: integer
            tasks_open:
              type: integer
            tasks_overdue:
              type: integer
            tasks_resolved:
              type: integer
            by_priority:
              type: array
              minItems: 3
              maxItems: 3
              items:
                type: object
                properties:
                  priority:
                    type: string
                    enum:
                    - p1
                    - p2
                    - p3
                  tasks_open:
                    type: integer
                    minimum: 0
                  tasks_past_due:
                    type: integer
                    minimum: 0
                required:
                - priority
                - tasks_open
                - tasks_past_due
                additionalProperties: false
          required:
          - p1
          - p2
          - p3
          - tasks_open
          - tasks_overdue
          - tasks_resolved
          - by_priority
          additionalProperties: false
        reassessments_overdue:
          type: integer
        concentration:
          type: object
          description: 104-F7-FR6, the two 104 FR2 lists as getConcentration computes them over the rows the caller may read.
            multi_function_top holds at most five providers of list (i), ordered by function count descending, then provider
            identifier (B_05.01.0010) ascending; single_provider_top holds at most five functions of list (ii), ordered by
            function identifier (B_06.01.0010) ascending
          properties:
            multi_function_providers:
              type: integer
            single_provider_functions:
              type: integer
            underlying_dependencies:
              type: integer
            multi_function_top:
              type: array
              maxItems: 5
              items:
                type: object
                properties:
                  provider_id:
                    type: string
                    format: uuid
                  function_count:
                    type: integer
                    minimum: 2
                required:
                - provider_id
                - function_count
                additionalProperties: false
            single_provider_top:
              type: array
              maxItems: 5
              items:
                type: object
                properties:
                  function_id:
                    type: string
                    format: uuid
                  provider_id:
                    type: string
                    format: uuid
                required:
                - function_id
                - provider_id
                additionalProperties: false
          required:
          - multi_function_providers
          - single_provider_functions
          - underlying_dependencies
          - multi_function_top
          - single_provider_top
          additionalProperties: false
      required:
      - as_of
      - register_counts
      - providers_by_classification
      - requests_by_state
      - requests_overdue
      - lifecycle
      - remediation
      - reassessments_overdue
      - concentration
      additionalProperties: false
      examples:
      - as_of: '2026-11-04T09:00:00Z'
        register_counts:
          dora_scope: 33
          national_scope: 31
          inventory: 35
          classification_pending: 0
        providers_by_classification:
          ict_outsourcing: 30
          non_ict_outsourcing: 2
          ordinary_purchase: 1
          ict_outsourcing_by_criticality:
            critical_or_important: 12
            not_critical_or_important: 18
        completeness:
          items:
          - regulation_id: dora
            field_completeness: 0.82
            clause_coverage: 0.7
            combined: 0.76
          - regulation_id: null
            field_completeness: 0.8
            clause_coverage: 0.68
            combined: 0.74
          fixture_catalog_active: true
        requests_by_state:
          in_review: 1
        requests_overdue: 0
        lifecycle:
        - step: initiation
          count: 0
          past_due: null
        - step: pre_assessment
          count: 0
          past_due: 0
        - step: contract_check
          count: 0
          past_due: 0
        - step: review
          count: 1
          past_due: 0
        - step: register_entry
          count: 0
          past_due: 0
        - step: monitoring_exit
          count: 0
          past_due: null
        remediation:
          p1: 5
          p2: 2
          p3: 5
          tasks_open: 16
          tasks_overdue: 0
          tasks_resolved: 0
          by_priority:
          - priority: p1
            tasks_open: 9
            tasks_past_due: 0
          - priority: p2
            tasks_open: 2
            tasks_past_due: 0
          - priority: p3
            tasks_open: 5
            tasks_past_due: 0
        reassessments_overdue: 2
        concentration:
          multi_function_providers: 1
          single_provider_functions: 1
          underlying_dependencies: 1
          multi_function_top:
          - provider_id: 3d1b7f8e-2a44-4f0e-9a4b-7c0b8e1d2f33
            function_count: 2
          single_provider_top:
          - function_id: 7a2c9e10-5b3d-4c8f-8e21-0f6d4b9a1c55
            provider_id: 3d1b7f8e-2a44-4f0e-9a4b-7c0b8e1d2f33
      description: Register figures for 104-F7 (FR1 completeness, FR2 classification and criticality, FR3 remediation by
        priority, FR4 lifecycle pipeline, FR6 concentration), computed over the rows the caller may read (109-F3); figure
        definitions are in 104-F7 and the owning functionality specs. completeness is optional and omitted for requesters
        (Q-096).
