openapi: 3.1.0
info:
  title: monitoring-service fixture
  version: 0.0.1
paths:
  /items:
    get:
      operationId: listItems
      responses:
        '200':
          description: The items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
components:
  schemas:
    Item:
      type: object
      required: [item_id]
      properties:
        item_id:
          type: string
