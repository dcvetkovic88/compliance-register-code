openapi: 3.1.0
info:
  title: platform API (standalone register build, draft)
  version: 0.1.0-draft
  description: >
    Draft for feature 109 (access governance: profile and roles, demo role switch, business units,
    role mapping, confidentiality and grants, four-eyes approvals and delegations, audit trail) and
    110-F1 (user locale). Standalone build, constitution Article IX; frozen at planning-done (IX.2).
    Served by platform-service (L1 section 3); the browser reaches it only through the web BFF, whose
    sign-in, callback and session operations are in web-bff.openapi.yaml and are not redefined here.
    Status: DRAFT | Added 2026-11-04 by decision of Dusan (Raiffeisen Demo Decisions and Build Brief).
    AMENDED 2026-11-05: example arrangement reference aligned with docs/standalone/demo-seed.md (cross-file reconciliation).
    AMENDED 2026-11-06 (Dusan decision H2, 109-F4 plan D8): listAnnotationVersions, proposeAnnotationVersion (P86) and getActiveAnnotationVersion (service) added; Approval.subject_service gains monitoring, matching the data model (109-F4-FR10).
    AMENDED 2026-11-06 (speckit-analyze 2026-11-06 finding U1, 109-F4 plan D9): Approval gains the required read-only `no_eligible_checker` boolean, returned by listApprovals and getApproval.
    AMENDED 2026-11-06 (Dusan decision, speckit-analyze 2026-11-06 finding I1, 109-F4 spec edge cases): `no_eligible_checker` removed from Approval again; the no-eligible-checker case is PILOT scope, the demo seed always has two active compliance users.
    AMENDED 2026-11-06 (speckit-clarify, docs/analyze-2026-11-06.md 109-F1 M): proposeRoleMappingChange states the 422 incompatible_roles refusal of 109-F1-FR2 and its audit.
    AMENDED 2026-11-06 (109-F1 re-analyze H1): the 422 pre-check applies to assign_role; group mappings are checked at sign-in.
    AMENDED 2026-11-06 (speckit-clarify, docs/analyze-2026-11-06.md 109-F3 H3, 109-F3 plan D9): listGrants x-roles narrowed to the matrix P65 holders (outsourcing-manager, legal).
    AMENDED 2026-11-06 (109-F4 speckit-plan, final 109-F4 analyze findings I1, M2, M5, L3; Confirmed by Dusan 2026-11-06, Q-163): decideApproval states its response rule (403 PLATFORM_NOT_IN_MATRIX before the owning service is called, owning-service Problem responses relayed unchanged, platform codes for platform-owned kinds, 503 PLATFORM_OWNING_SERVICE_UNAVAILABLE with the approval still pending) and lists 403, 422 and 503; proposeRoleMappingChange states the 409 PLATFORM_LAST_CHECKING_ADMIN refusal; both codes added to x-error-codes; Problem example detail aligned with 109-F4 Story 1.
    AMENDED 2026-11-06 (109-F4 speckit-plan, analyze report final-109-F4-c1t1 findings I1, U1; Confirmed by Dusan 2026-11-06, Q-163 extended): decideApproval answers 403 only to a caller who is neither a checker of the kind nor the maker nor an excluded identity (platform.approval_caller_relation), so a maker without a checker role gets the four-eyes refusal; the 403 and 503 refusals are audited; x-roles adds security and it-governance, the makers of risk_acceptance and function_criticality_confirmation who hold P71 (109-F1).
    AMENDED 2026-11-06 (109-F1 speckit-plan, final-109-F1-p1 analyze C1): proposeRoleMappingChange lists its 409 PLATFORM_LAST_CHECKING_ADMIN and 422 incompatible_roles Problem responses explicitly; no behaviour changed.
    AMENDED 2026-11-04 (independent review H5, C2): ApprovalKind gains four kinds of 109-F4-FR1; decideApproval applies
    the change through the owning service's applyApproval operation, synchronously (109-F4-FR10).
    AMENDED 2026-11-05 (Dusan decision Q-004, Q-011): ApprovalKind gains reporting_configuration_change
    (register-service, checker compliance or admin) and applicability_annotation_change (platform-owned).
    AMENDED 2026-11-05 (Dusan decisions Q-103, Q-114): Me, DemoUser and UserSummary carry business_unit_ids
    (a requester may belong to several business units, assigned through AD groups) in place of
    business_unit_id; ApprovalKind gains register_record_edit (four-eyes on manual edits of reportable
    register fields, register-service).
    AMENDED 2026-11-05 (Dusan decisions Q-117, Q-118, Q-120): Approval.expires_at is null for kinds that never
    expire (export_submission_marking) and examples use the 14-day pending period; createDelegation states the
    30-day limit; AuditEvent gains access_metadata (client IP and user agent, kept one year, outside the hash chain).
    AMENDED 2026-11-06 (104-F0 speckit-clarify, finding 104-F0 H4; Dusan decision Q-147): ApprovalKind gains
    manual_entry_closure (closing manual arrangement entry after the migration sign-off, register-service,
    checker compliance).
    AMENDED 2026-11-06 (109-F5 speckit-plan, analyze report final-109-F5 I1, U1, U2; Confirmed by Dusan 2026-11-06,
    Q-167): AuditExport manifest gains head_seq (taken before the export's own audit event; head_hash is the hash at it);
    createAuditExport and getAuditExport state that content is read as the requesting auditor and that an export is
    readable only by its requester (404 otherwise); completion and failure are audited.
    AMENDED 2026-11-06 (109-F3 speckit-plan, analyze report final-109-F3-p1 F1, U1; Confirmed by Dusan 2026-11-06,
    Q-170): setConfidential gains a description: marking per arrangement or case only (RecordKind unchanged), unmarking
    keeps the marking record and revokes active grants, re-marking restores none; no operation or schema shape changed.
    AMENDED 2026-11-06 (109-F3 speckit-plan, analyze report final-109-F3-c2t1 U2): createGrant states its refusals and
    x-error-codes gains PLATFORM_RECORD_NOT_CONFIDENTIAL (409) for a grant on a record that is not marked or is unmarked.
    AMENDED 2026-11-06 (109-F5 speckit-plan, analyze report final-109-F5-p1 U1, U2): getAuditEvent states that an event
    the caller may not see answers 404; verifyAuditChain states that every run, on demand or daily, is stored and audited;
    no operation or schema shape changed.
    AMENDED 2026-11-06 (109-F5 speckit-plan, analyze report final-109-F5-c2t1 G1): getLatestAuditVerification added
    (GET /api/v1/platform/audit/verifications/latest, auditor and admin, P68, audited read, 404 when no run exists), so
    the latest verification result of 109-F5-FR7, daily or on demand, can reach the auditor's screen.
    Rules: docs/standards/api-standards.md (paths, payloads, lists, RFC 9457 errors, security).
    x-roles lists L1 section 2 role ids; the authoritative binding is the 109-F1 permission matrix,
    whose action id is given in x-action. x-scope marks DEMO or PILOT per L1 section 3a.
    AMENDED 2026-11-07 (Dusan's decision (delegated proxy, 2026-11-07) on dcvetkovic88/compliance-register#18): unquoted flow-mapping `description` values containing a comma are quoted so YAML keeps each sentence whole; no type, field, path, message or response changes (111-AC5, Redocly `struct`).
    AMENDED 2026-11-13 (109-F1 regeneration for the production build, change against the baseline): Me gains the
    required tenant_id (OD-20, 111 plan D22(k)); RoleMappingChange requires role_id in all four change kinds
    (109-F1 PQ-4); the incompatible role combination is 409 with type role-combination-refused (109-F1 PQ-1); the
    Problem schema has no error_code member, its type is the error code in kebab-case (api-standards section 5,
    conventions SA-1.2-10); the 109-F1 codes are converted (PLATFORM_NO_ROLE to no-role, PLATFORM_NOT_IN_MATRIX to
    not-in-matrix, PLATFORM_OUT_OF_SCOPE to out-of-scope, PLATFORM_ROLE_COMBINATION_REFUSED to
    role-combination-refused, PLATFORM_LAST_CHECKING_ADMIN to last-checking-admin) and validation-failed is added;
    the codes of 109-F2 to 109-F5 keep their names until those functionalities are regenerated (109-F1 plan PQ-18);
    the six 109-F1 operations state x-caller user; getMe states the no-role case (109-F1 PROPOSED PQ-15).
    AMENDED 2026-11-13 (109-F1 plan, Phase 1): the six 109-F1 operations drop the old x-surface mark, which
    x-caller replaces (109-F1 research R-11); RoleMapping drops its active member, because a removed mapping is
    deleted and only mappings in force are listed (109-F1 data model section 2).
    AMENDED 2026-11-14 (109-F2 regeneration for the production build, change against the baseline): switchDemoUser
    moves to web-bff.openapi.yaml, because the BFF holds the session (109 brief M6); getAuthConfig and listDemoUsers
    state x-caller user and drop x-surface; DemoUser gains the required sign_in_name (S891); PLATFORM_DEMO_MODE_OFF
    becomes the type demo-mode-off (conventions SA-1.2-10, SA-4-7); the tenant settings read and change operations
    getTenantSettings and updateTenantSettings (P70) are added; the API-only operations recordSignIn,
    recordSessionEnd (pending 109-F2 PQ-36) and recordDemoSwitchRefusal, called by the web BFF with the user's
    token, are added (pending 109-F2 PQ-48), with the type sign-in-refused.
    AMENDED 2026-11-14 (109-F5 regeneration for the production build, change against the baseline): the six audit
    operations state x-caller user and drop x-surface (api-standards section 6); getAuditEvent and getAuditExport
    list their 404 (S1013) and every audit 404 has the type not-found; the export manifest lists each file by
    format, fixed name, SHA-256 and size with no storage path, and files are downloaded through the new
    getAuditExportFile (109-F5 PQ-70; no buckets, OD-5), refused with audit-export-not-ready before done; the new
    listAuditExports lists the caller's own exports, so an export left running is shown (109-F5-FR8, D-5);
    AuditExport gains failure_reason (109-F5 PQ-71, PQ-85); AuditEvent gains actor_display_name (109-F5 PQ-73)
    and its detail description names the AI and approval keys (S1011); TenantSettings and TenantSettingsChange
    gain audit_retention_years (109-F5-FR6, PQ-69); PLATFORM_RETENTION_TOO_SHORT becomes the type
    retention-too-short (conventions SA-1.2-10, SA-4-7); verifyAuditChain states who stores the run (109-F5
    PQ-66), the range past the head (S1010) and the empty chain (109-F5 PQ-79).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: me
  - name: demo
  - name: tenant-settings
  - name: users
  - name: business-units
  - name: role-mapping
  - name: confidentiality
  - name: approvals
  - name: delegations
  - name: audit
paths:
  /api/v1/platform/me:
    get:
      operationId: getMe
      tags: [me]
      summary: Signed-in user's profile, tenant, roles, business units, effective action ids and locale
      description: >
        Called by the web BFF with the user's access token after sign-in and for its session (111 plan
        D22(k)). PROPOSED (109-F1 PQ-15): an active user known to the platform gets the profile even with no
        role, with roles and action_ids empty, so the shell can tell "no role" from "not signed in"
        (109-F1-FR9); an unknown or inactive user gets 403 with type no-role, audited (109-F1-FR10).
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor, admin]
      x-action: P58
      x-caller: user
      x-audit-object: platform:me
      x-scope: DEMO
      responses:
        '200':
          description: Profile of the signed-in user
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateMyLocale
      tags: [me]
      summary: Change the signed-in user's preferred locale (110-F1-FR3)
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor, admin]
      x-action: P58
      x-surface: user
      x-audit-object: platform:user
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [locale]
              properties:
                locale: {$ref: '#/components/schemas/Locale'}
              examples:
                - {locale: sr-Cyrl}
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Me'}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/me/page-refusals:
    post:
      operationId: recordPageRefusal
      tags: [me]
      summary: Record a page refusal that the shell decided from the granted actions (109-F1-FR9, FR14)
      description: >
        PROPOSED (109-F1 PQ-29). The shell calls this once per navigation to a route whose action is not
        granted, or to any route for a user with no role. The handler is marked own profile as getMe: an
        active user known to the platform may call it with or without a role; an unknown or inactive user
        gets 403 with type no-role, audited by the access check. The platform checks that action_id is a
        matrix action refused to the caller, and writes one refused access-decision event with channel page
        per user and navigation_id; a repeated call with the same navigation_id writes nothing and answers
        204. A granted or unknown action_id is 422 validation-failed and writes nothing.
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor, admin]
      x-action: P58
      x-caller: user
      x-audit-object: platform:page-refusal
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [navigation_id, action_id, route]
              properties:
                navigation_id: {type: string, format: uuid}
                action_id: {type: string, pattern: '^P[0-9]{2}$'}
                route: {type: string, minLength: 1, maxLength: 200}
              examples:
                - {navigation_id: 3f2c9a1e-7b4d-4c8e-9a0f-1d2e3c4b5a69, action_id: P60, route: /admin/role-mappings}
      responses:
        '204':
          description: The refusal is recorded, or was already recorded for this navigation
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/auth-config:
    get:
      operationId: getAuthConfig
      tags: [demo]
      summary: Authentication mode of the caller's tenant (demo or production); no secrets
      description: >
        The mode the platform wrote into the caller's tenant settings at its last start (109-F2-FR1). Readable by
        every signed-in user with a role, so every screen can show the demo marker (P58). Changed only through
        deployment configuration, never by a user.
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor, admin]
      x-action: P58
      x-caller: user
      x-audit-object: platform:auth-config
      x-scope: DEMO
      responses:
        '200':
          description: Mode
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthConfig'}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/tenant-settings:
    get:
      operationId: getTenantSettings
      tags: [tenant-settings]
      summary: The authentication and audit retention fields of the caller's tenant settings (109-F2-FR12, 109-F5-FR6)
      description: >
        One settings record per tenant. Other functionalities add their own fields to this resource when they are
        regenerated (default locale 110-F1, confidential default roles 109-F3, the approved AI endpoint record IX.5);
        109-F5 adds the audit retention (109-F5 PQ-69).
      x-roles: [admin]
      x-action: P70
      x-caller: user
      x-audit-object: platform:tenant-settings
      x-scope: DEMO
      responses:
        '200':
          description: Settings of the caller's tenant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantSettings'}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      operationId: updateTenantSettings
      tags: [tenant-settings]
      summary: Change the session limits, the second-factor claim or the audit retention of the caller's tenant (109-F2-FR8, FR5, FR11, FR12; 109-F5-FR6)
      description: >
        Only the members below can be changed. A request naming the mode, the rehearsal flag or the demo-tenant flag
        is refused with 422 validation-failed naming that member, and nothing changes. The idle limit may not exceed
        the absolute limit. A change applies to sessions started after it. An audit retention below five years is
        refused with 422 retention-too-short and nothing changes; a retention change removes no audit event
        (109-F5-FR6, PQ-69). Audited with before and after values.
      x-roles: [admin]
      x-action: P70
      x-caller: user
      x-audit-object: platform:tenant-settings
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TenantSettingsChange'}
      responses:
        '200':
          description: Settings after the change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantSettings'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/me/sign-ins:
    post:
      operationId: recordSignIn
      tags: [me]
      summary: Admit or refuse a sign-in and audit it. API only, called by the web BFF (109-F2-FR10, FR15)
      description: >
        Called by the web BFF once with the new access token after the code exchange, and with the target's access
        token during a demo switch, before any session is created (109-F2-FR10; pending 109-F2 PQ-48). The platform
        refuses a user it does not know or who is inactive, a demo account while the tenant's mode is production,
        and, at pilot, a token without the tenant's second-factor statement; it writes one auth.sign_in event,
        allowed or denied, or for a subject of no known tenant a service log line only (Q-182). In production mode
        it also creates the user and recomputes roles and units from the groups claim (PILOT, 109-F2-FR7). The
        handler carries the sign-in mark, which admits a verified user token of any subject (109-F2 PQ-48).
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor, admin]
      x-action: P58
      x-caller: user
      x-audit-object: platform:sign-in
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [via]
              properties:
                via: {type: string, enum: [code_flow, demo_switch]}
              examples:
                - {via: code_flow}
      responses:
        '200':
          description: Sign-in admitted; the BFF creates the session with these limits
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SignInAdmission'}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/me/session-ends:
    post:
      operationId: recordSessionEnd
      tags: [me]
      summary: Record the end of the caller's session and audit it. API only, called by the web BFF (109-F2-FR8, FR9)
      description: >
        Called by the web BFF with the session's own access token before it drops the session: at logout, at the
        idle or absolute limit, and for the previous user of a demo switch (pending 109-F2 PQ-36 and PQ-48). The
        session is named by the session claim of the token (CR_OIDC_SESSION_CLAIM), never by the body. In one
        transaction the platform records the ended session, which every service then refuses, and writes one
        event: auth.logout, auth.session_expired or demo.switch with the previous and the next user. A second call
        for the same session answers 204 and writes nothing, so each ended session has exactly one event. The
        handler carries the sign-in mark, so a user who lost every role or was deactivated can still end a session.
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor, admin]
      x-action: P58
      x-caller: user
      x-audit-object: platform:session
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SessionEnd'}
      responses:
        '204':
          description: The end is recorded, or was already recorded for this session
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/demo/users:
    get:
      operationId: listDemoUsers
      tags: [demo]
      summary: Demo accounts of the caller's tenant for the demo user switch. Demo mode only (109-F2-FR3)
      description: >
        The twelve demo accounts of the caller's own tenant (docs/standalone/demo-seed.md section 3), each with the
        sign-in name the web BFF's demo adapter uses (S891). The whole list, no paging (109-F2 PQ-49). Answers 404
        with type demo-mode-off when the tenant's mode is production.
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor, admin]
      x-action: P59
      x-caller: user
      x-audit-object: platform:demo-users
      x-scope: DEMO
      responses:
        '200':
          description: Demo users ordered by role id, then display name, then user id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/DemoUser'}}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/demo/switch-refusals:
    post:
      operationId: recordDemoSwitchRefusal
      tags: [demo]
      summary: Audit a refused demo switch. API only, called by the web BFF (109-F2-FR3, FR10)
      description: >
        Called by the web BFF with the caller's access token when a switch is refused, while the caller stays signed
        in (pending 109-F2 PQ-32 and PQ-48). Writes one demo.switch_refused event naming the caller, the target and
        the reason, on its own connection. Answers 404 with type demo-mode-off when the tenant's mode is production.
        The switch itself is the web BFF's operation switchDemoUser (web-bff.openapi.yaml).
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor, admin]
      x-action: P59
      x-caller: user
      x-audit-object: platform:demo-switch
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_user_id, reason]
              properties:
                target_user_id: {type: string, format: uuid}
                reason: {type: string, enum: [target_not_demo_account, target_sign_in_refused, target_admission_refused]}
              examples:
                - {target_user_id: 6f1c2a9e-0b7d-4e4b-9a51-3c2d8e7f0a11, reason: target_sign_in_refused}
      responses:
        '204':
          description: The refusal is recorded
        '404': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Users with roles and business units (ordering display_name asc, id asc)
      x-roles: [admin, auditor]
      x-action: P60
      x-caller: user
      x-audit-object: platform:users
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - {name: role_id, in: query, required: false, schema: {$ref: '#/components/schemas/RoleId'}}
        - {name: business_unit_id, in: query, required: false, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Page of users
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/UserSummary'}}
                  next_cursor: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/business-units:
    get:
      operationId: listBusinessUnits
      tags: [business-units]
      summary: Business units (ordering code asc)
      x-roles: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor, admin]
      x-action: P58
      x-caller: user
      x-audit-object: platform:business-units
      x-scope: DEMO
      responses:
        '200':
          description: All business units of the tenant
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/BusinessUnit'}}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/business-units/{code}:
    put:
      operationId: upsertBusinessUnit
      tags: [business-units]
      summary: Create or replace a business unit by code
      x-roles: [admin]
      x-action: P63
      x-caller: user
      x-audit-object: platform:business-unit
      x-scope: DEMO
      parameters:
        - {name: code, in: path, required: true, schema: {type: string, pattern: '^[a-z0-9-]{2,40}$'}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, active]
              properties:
