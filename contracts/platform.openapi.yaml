      summary: Recompute the hash chain of the caller's tenant over a sequence range (whole chain when omitted)
      description: >
        Every run, on demand or by the daily job, stores one verification run and writes one audit event in the chain
        of the tenant it verified (109-F5-FR5). The action stays a read of the trail (P68); the run and its event are
        written by platform-service under its own service identity, with the requesting user in the event detail
        (109-F5 PQ-66, S1006). A to_seq past the head reports broken with first_break_seq the head plus one (S1010);
        a tenant with no event reports intact at sequence 0 with the genesis hash of 64 zeros (109-F5 PQ-79).
        from_seq below 1 or above to_seq is refused with 422 validation-failed. The result holds sequence numbers and
        hashes only, no event content (109-F5-FR7, D-3).
      x-roles: [auditor, admin]
      x-action: P68
      x-caller: user
      x-audit-object: platform:audit-verification
      x-scope: DEMO
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                from_seq: {type: string, pattern: '^[0-9]+$'}
                to_seq: {type: string, pattern: '^[0-9]+$'}
              examples:
                - {from_seq: '1', to_seq: '5000'}
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditVerification'}
