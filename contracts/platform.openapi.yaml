      summary: The latest verification result of the caller's tenant, daily or on demand
      description: >
        Returns the verification run with the latest run_at, whichever kind of run wrote it (109-F5-FR7, FR11), so
        the result of the daily job reaches the verification status screen. 404 with type not-found when no run
        exists yet. The read is itself audited (109-F5-FR2). Sequence numbers and hashes only, no event content.
      x-roles: [auditor, admin]
      x-action: P68
      x-caller: user
      x-audit-object: platform:audit-verification
      x-scope: DEMO
      responses:
        '200':
          description: Latest verification result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditVerification'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/audit/exports:
    get:
      operationId: listAuditExports
      tags: [audit]
      summary: The caller's own audit exports, newest first, with their state (109-F5-FR8, FR12)
      description: >
        Lists only the exports the caller requested; an export of another auditor is never listed (D-3). An export
        left running by a stopped job stays running and is listed so (D-5). Ordering is created_at descending, then
        id; the cursor is opaque. The read is itself audited (109-F5-FR2).
      x-roles: [auditor]
      x-action: P69
      x-caller: user
      x-audit-object: platform:audit-exports
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page of the caller's exports
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/AuditExport'}}
                  next_cursor: {type: [string, 'null']}
        '403': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      operationId: createAuditExport
      tags: [audit]
      summary: Export a filtered set of events as CSV and JSON Lines with a manifest (job)
      description: >
        Inserts a queued export of the caller and answers 202. The export job of platform-service (109-F5 plan D13,
        pending PQ-65 and PQ-71) runs under the platform's service identity, checks at start that the requester is
        still an active user holding P69, reads the trail through the same read path as the screens with the
        requester's visibility and masking (109-F3-FR6), bounded by the head sequence it takes before its own audit
        event, writes the two files as stored files of the platform (OD-5), and audits completion with scope,
        head_seq, file hashes and the requester, or failure with outcome error (109-F5-FR8, FR11).
      x-roles: [auditor]
      x-action: P69
      x-caller: user
      x-audit-object: platform:audit-export
      x-scope: DEMO
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuditFilter'}
      responses:
        '202':
          description: Export accepted
          headers:
            Location:
              description: URL of the export resource
              schema: {type: string}
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id: {type: string, format: uuid}
        '403': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/audit/exports/{export_id}:
    get:
      operationId: getAuditExport
      tags: [audit]
      summary: Export state and, when done, its manifest
      description: >
        Readable only by the auditor who requested the export; any other caller, another tenant and an unknown id
        get 404 with type not-found (109-F5-FR8, D-3, S1013). The manifest lists each file by format, fixed name,
        SHA-256 and size, with no path or link, so two manifests of the same filter over unchanged data differ only
        in generated_at, head_seq and head_hash (109-F5-AC7, PQ-70); the files are read through getAuditExportFile.
        The read is itself audited (109-F5-FR2).
      x-roles: [auditor]
      x-action: P69
      x-caller: user
      x-audit-object: platform:audit-export
      x-scope: DEMO
      parameters:
        - {name: export_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Export
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditExport'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

  /api/v1/platform/audit/exports/{export_id}/files/{format}:
    get:
      operationId: getAuditExportFile
      tags: [audit]
      summary: Download one file of a done export (109-F5-FR8, FR12)
      description: >
        Answers the stored file of the export in the requested format, byte for byte as the export job wrote it;
        its SHA-256 equals the manifest's (109-F5-AC12). Readable only by the auditor who requested the export; any
        other caller, another tenant and an unknown id get 404 with type not-found (D-3). Before the export is done
        the answer is 409 with type audit-export-not-ready (109-F5 PQ-70). The download is itself audited with the
        format and the file's SHA-256 (109-F5-FR2).
      x-roles: [auditor]
      x-action: P69
      x-caller: user
      x-audit-object: platform:audit-export-file
      x-scope: DEMO
      parameters:
        - {name: export_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: format, in: path, required: true, schema: {type: string, enum: [csv, jsonl]}}
      responses:
        '200':
          description: The file content, with a Content-Disposition attachment header naming the file's fixed name
          content:
            text/csv:
              schema: {type: string}
            application/x-ndjson:
              schema: {type: string}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 500, default: 50}
    Cursor:
      name: cursor
      in: query
      required: false
      schema: {type: string}
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    RoleId:
      type: string
      enum: [requester, outsourcing-manager, security, it-governance, compliance, legal, auditor, admin]
      examples: [compliance]
    Locale:
      type: string
      enum: [en, sr-Latn, sr-Cyrl]
      examples: [sr-Latn]
    RecordKind:
      type: string
      enum: [arrangement, case]
      examples: [arrangement]
    Outcome:
      type: string
      enum: [allowed, denied, error]
      examples: [denied]
    ApprovalKind:
      type: string
      enum:
        - lifecycle_final_approval
        - register_entry_approval
        - critical_important_classification
        - risk_acceptance
        - methodology_approval
        - ictrisk_campaign_signoff
        - remediation_campaign_signoff
        - export_submission_marking
        - role_mapping_change
        - classification_confirmation
        - function_criticality_confirmation
        - exit_plan_approval
        - scoring_configuration_approval
        - reporting_configuration_change
        - applicability_annotation_change
        - register_record_edit
        - manual_entry_closure
      examples: [register_entry_approval]
    ApprovalState:
      type: string
      enum: [pending, approved, rejected, withdrawn, expired, stale]
      examples: [pending]
    Me:
      type: object
      required: [user_id, tenant_id, display_name, email, roles, business_unit_ids, action_ids, locale, demo_mode, is_demo]
      properties:
        user_id: {type: string, format: uuid}
        tenant_id:
          type: string
          format: uuid
          description: The user's tenant, from the platform's record of the user; the web BFF builds its session from it (OD-20)
        display_name: {type: string}
        email: {type: string, format: email}
        roles: {type: array, items: {$ref: '#/components/schemas/RoleId'}}
        business_unit_ids:
          type: array
          description: Business units of a requester (one or more, 109-F1-FR6, Q-103); empty for cross-unit roles
          items: {type: string, format: uuid}
        action_ids:
          type: array
          description: >
            Effective matrix action ids with qualifier, e.g. P01:S; one entry per held qualifier, so a cell with two
            qualifiers gives two entries (P18:M and P18:C); empty when the user holds no role
          items: {type: string, pattern: '^P[0-9]{2}:[XSRMCG]$'}
        locale: {$ref: '#/components/schemas/Locale'}
        demo_mode: {type: boolean}
        is_demo: {type: boolean}
      examples:
        - user_id: 6f1c2a9e-0b7d-4e4b-9a51-3c2d8e7f0a11
          tenant_id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
          display_name: Legal (demo)
          email: legal@demo.invalid
          roles: [legal]
          business_unit_ids: []
          action_ids: ['P01:R', 'P05:X', 'P16:S']
          locale: sr-Latn
          demo_mode: true
          is_demo: true
    AuthConfig:
      type: object
      required: [mode]
      properties:
        mode: {type: string, enum: [demo, production]}
      examples:
        - {mode: demo}
    DemoUser:
      type: object
      required: [user_id, display_name, roles, business_unit_ids, sign_in_name]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        roles: {type: array, items: {$ref: '#/components/schemas/RoleId'}}
        business_unit_ids: {type: array, items: {type: string, format: uuid}}
        sign_in_name:
          type: string
          description: The account's sign-in name at the identity provider of the local stack (S891)
      examples:
        - user_id: 6f1c2a9e-0b7d-4e4b-9a51-3c2d8e7f0a11
          display_name: Security (demo)
          roles: [security]
          business_unit_ids: []
          sign_in_name: usr-security@demo-bank.invalid
    TenantSettings:
      type: object
      description: >
        The 109-F2 fields of the one settings record of a tenant (109-F2-FR12). auth_mode is written only at the
        platform's start; rehearsal and demo_tenant only by the tenants loader; no user changes them.
      required: [tenant_id, auth_mode, rehearsal, demo_tenant, session_idle_minutes, session_absolute_minutes, second_factor_claim, second_factor_value, audit_retention_years, updated_at]
      properties:
        tenant_id: {type: string, format: uuid}
        auth_mode: {type: string, enum: [demo, production]}
        rehearsal: {type: boolean}
        demo_tenant: {type: boolean}
        session_idle_minutes: {type: integer, minimum: 1, maximum: 1440}
        session_absolute_minutes: {type: integer, minimum: 1, maximum: 1440}
        second_factor_claim:
          type: [string, 'null']
          description: Name of the token claim that states a second factor (PILOT, 109-F2-FR5); null in demo tenants
        second_factor_value:
          type: [string, 'null']
          description: The value of that claim that counts as a second factor (PILOT); null in demo tenants
        audit_retention_years:
          type: integer
          minimum: 5
          description: Years an audit event is kept; default 10, at least 5 (109-F5-FR6, D-2)
        updated_at: {type: string, format: date-time}
      examples:
        - tenant_id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
          auth_mode: demo
          rehearsal: false
          demo_tenant: true
          session_idle_minutes: 60
          session_absolute_minutes: 600
          second_factor_claim: null
          second_factor_value: null
          audit_retention_years: 10
          updated_at: '2026-11-14T09:00:00Z'
    TenantSettingsChange:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >
        Members that are absent keep their value. second_factor_claim and second_factor_value are set together;
        null clears both.
      properties:
        session_idle_minutes: {type: integer, minimum: 1, maximum: 1440}
        session_absolute_minutes: {type: integer, minimum: 1, maximum: 1440}
        second_factor_claim: {type: [string, 'null'], minLength: 1, maxLength: 100}
        second_factor_value: {type: [string, 'null'], minLength: 1, maxLength: 200}
        audit_retention_years:
          type: integer
          description: Years, at least 5; a smaller value is refused with 422 retention-too-short (109-F5-FR6, PQ-69)
      examples:
        - {session_idle_minutes: 30}
        - {audit_retention_years: 12}
    SignInAdmission:
      type: object
      required: [user_id, tenant_id, auth_mode, session_idle_minutes, session_absolute_minutes]
      properties:
        user_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        auth_mode: {type: string, enum: [demo, production]}
        session_idle_minutes: {type: integer, minimum: 1, maximum: 1440}
        session_absolute_minutes: {type: integer, minimum: 1, maximum: 1440}
      examples:
        - user_id: 6f1c2a9e-0b7d-4e4b-9a51-3c2d8e7f0a11
          tenant_id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
          auth_mode: demo
          session_idle_minutes: 60
          session_absolute_minutes: 600
    SessionEnd:
      type: object
      additionalProperties: false
      required: [reason]
      description: next_user_id is required when reason is demo_switch and absent otherwise (422 validation-failed).
      properties:
        reason: {type: string, enum: [logout, idle_limit, absolute_limit, demo_switch]}
        next_user_id: {type: string, format: uuid}
      examples:
        - {reason: logout}
        - {reason: demo_switch, next_user_id: 6f1c2a9e-0b7d-4e4b-9a51-3c2d8e7f0a11}
    UserSummary:
      type: object
      required: [user_id, display_name, email, roles, business_unit_ids, active, is_demo]
      properties:
        user_id: {type: string, format: uuid}
        display_name: {type: string}
        email: {type: string, format: email}
        roles: {type: array, items: {$ref: '#/components/schemas/RoleId'}}
        business_unit_ids: {type: array, items: {type: string, format: uuid}}
        active: {type: boolean}
        is_demo: {type: boolean}
      examples:
        - user_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
          display_name: Requester (demo)
          email: requester@demo.invalid
          roles: [requester]
          business_unit_ids: [0d1e2f3a-4b5c-4d6e-8f70-819a2b3c4d5e]
          active: true
          is_demo: true
    BusinessUnit:
      type: object
      required: [id, code, name, active]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        active: {type: boolean}
      examples:
        - {id: 0d1e2f3a-4b5c-4d6e-8f70-819a2b3c4d5e, code: retail, name: Retail Banking, active: true}
    RoleMapping:
      type: object
      required: [id, idp_group_id, role_id, business_unit_id]
      description: >
        A mapping in force. A removed mapping no longer exists; its before state is in the audit trail (109-F1
        data model section 2).
      properties:
        id: {type: string, format: uuid}
        idp_group_id: {type: string}
        role_id: {$ref: '#/components/schemas/RoleId'}
        business_unit_id: {type: [string, 'null'], format: uuid}
      examples:
        - id: 3e4f5a6b-7c8d-4e9f-a0b1-c2d3e4f5a6b7
          idp_group_id: grp-outsourcing-legal
          role_id: legal
          business_unit_id: null
    RoleMappingChange:
      type: object
      additionalProperties: false
      required: [change_type, role_id, reason]
      description: >
        One of four change kinds; role_id is required in all four (109-F1 PQ-4). The fields each kind needs are
        listed in proposeRoleMappingChange; a missing one is 422 validation-failed.
      properties:
        change_type: {type: string, enum: [add_mapping, remove_mapping, assign_role, remove_role]}
        idp_group_id: {type: [string, 'null'], description: Required for add_mapping and remove_mapping}
        user_id: {type: [string, 'null'], format: uuid, description: Required for assign_role and remove_role}
        role_id: {$ref: '#/components/schemas/RoleId'}
        business_unit_id: {type: [string, 'null'], format: uuid, description: 'Required when role_id is requester; absent or null otherwise, and a non-null value for another role is 422 validation-failed'}
        reason: {type: string, minLength: 1, maxLength: 1000}
      examples:
        - change_type: add_mapping
          idp_group_id: grp-outsourcing-security
          role_id: security
          business_unit_id: null
          reason: Security team joins the outsourcing review
    Grant:
      type: object
      required: [id, record_kind, record_id, grantee_id, granted_by, reason, expires_at, revoked_at, created_at]
      properties:
        id: {type: string, format: uuid}
        record_kind: {$ref: '#/components/schemas/RecordKind'}
        record_id: {type: string, format: uuid}
        grantee_id: {type: string, format: uuid}
        granted_by: {type: string, format: uuid}
        reason: {type: string}
        expires_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
      examples:
        - id: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
          record_kind: arrangement
          record_id: 2b7e1c4a-5d3f-4a8b-9c0e-1f2a3b4c5d6e
          grantee_id: 9a8b7c6d-5e4f-4a3b-8c2d-1e0f9a8b7c6d
          granted_by: 6f1c2a9e-0b7d-4e4b-9a51-3c2d8e7f0a11
          reason: Security review of the hosting terms
          expires_at: null
          revoked_at: null
          created_at: '2026-11-09T09:12:00Z'
    Approval:
      type: object
      required: [id, kind, subject_service, subject_kind, subject_id, maker_id, state, requested_at, expires_at, decided_by, decided_at, decision_reason, delegation_id, correlation_id]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/ApprovalKind'}
        subject_service: {type: string, enum: [register, ict-risk, monitoring, platform]}
        subject_kind: {type: string}
        subject_id: {type: string, format: uuid}
        maker_id: {type: string, format: uuid}
        state: {$ref: '#/components/schemas/ApprovalState'}
        requested_at: {type: string, format: date-time}
        expires_at: {type: [string, 'null'], format: date-time, description: 'requested_at plus the tenant pending period (default 14 days); null for export_submission_marking, which never expires (Q-118)'}
        decided_by: {type: [string, 'null'], format: uuid}
        decided_at: {type: [string, 'null'], format: date-time}
        decision_reason: {type: [string, 'null']}
        delegation_id: {type: [string, 'null'], format: uuid}
        correlation_id: {type: string, format: uuid}
      examples:
        - id: 7b8c9d0e-1f2a-4b3c-8d4e-5f6a7b8c9d0e
          kind: register_entry_approval
          subject_service: register
          subject_kind: arrangement
          subject_id: 2b7e1c4a-5d3f-4a8b-9c0e-1f2a3b4c5d6e
          maker_id: 4c5d6e7f-8a9b-4c0d-9e1f-2a3b4c5d6e7f
          state: pending
          requested_at: '2026-11-09T09:00:00Z'
          expires_at: '2026-11-23T09:00:00Z'
          decided_by: null
          decided_at: null
          decision_reason: null
          delegation_id: null
          correlation_id: 8d9e0f1a-2b3c-4d4e-9f5a-6b7c8d9e0f1a
    ApprovalDetail:
      allOf:
        - $ref: '#/components/schemas/Approval'
        - type: object
          required: [proposed_change, current_state, can_decide, refusal_reason]
          properties:
            proposed_change: {type: object}
            current_state: {type: [object, 'null'], description: Subject's current values as read by the caller}
            can_decide: {type: boolean}
            refusal_reason:
              type: [string, 'null']
              enum: [maker, excluded, no_checker_role, not_pending, null]
      examples:
        - id: 7b8c9d0e-1f2a-4b3c-8d4e-5f6a7b8c9d0e
          kind: register_entry_approval
          subject_service: register
          subject_kind: arrangement
          subject_id: 2b7e1c4a-5d3f-4a8b-9c0e-1f2a3b4c5d6e
          maker_id: 4c5d6e7f-8a9b-4c0d-9e1f-2a3b4c5d6e7f
          state: pending
          requested_at: '2026-11-09T09:00:00Z'
          expires_at: '2026-11-23T09:00:00Z'
          decided_by: null
          decided_at: null
          decision_reason: null
          delegation_id: null
          correlation_id: 8d9e0f1a-2b3c-4d4e-9f5a-6b7c8d9e0f1a
          proposed_change: {B_02.01.0010: ARR-036}
          current_state: null
          can_decide: true
          refusal_reason: null
    AnnotationUpload:
      type: object
      additionalProperties: false
      required: [version, content]
      properties:
        version: {type: string, minLength: 1, maxLength: 20}
        content:
          type: object
          description: Complete annotation file keyed by (regulation_id, clause_id) with conditions critical_or_important, cloud, sub_outsourcing, national_scope (108-F2-FR2)
      examples:
        - version: '1.1'
          content: {entries: [{regulation_id: dora, clause_id: art30-3-a, conditions: [critical_or_important]}]}
    AnnotationVersion:
      type: object
      required: [id, version, status, proposed_by, approval_id, approved_at, created_at]
      properties:
        id: {type: string, format: uuid}
        version: {type: string}
        status: {type: string, enum: [proposed, approved, superseded]}
        proposed_by: {type: string, format: uuid}
        approval_id: {type: [string, 'null'], format: uuid}
        approved_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
      examples:
        - id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
          version: '1.0'
          status: approved
          proposed_by: 0a0b0c0d-0e0f-4a1b-8c2d-3e4f5a6b7c8d
          approval_id: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
          approved_at: '2026-11-09T08:00:00Z'
          created_at: '2026-11-09T08:00:00Z'
    Delegation:
      type: object
      required: [id, delegator_id, delegate_id, role_id, kinds, starts_at, ends_at, revoked_at]
      properties:
        id: {type: string, format: uuid}
        delegator_id: {type: string, format: uuid}
        delegate_id: {type: string, format: uuid}
        role_id: {$ref: '#/components/schemas/RoleId'}
        kinds: {type: array, items: {$ref: '#/components/schemas/ApprovalKind'}}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
      examples:
        - id: 0f1a2b3c-4d5e-4f6a-8b7c-8d9e0f1a2b3c
          delegator_id: 6f1c2a9e-0b7d-4e4b-9a51-3c2d8e7f0a11
          delegate_id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
          role_id: compliance
          kinds: [risk_acceptance]
          starts_at: '2026-11-09T07:00:00Z'
          ends_at: '2026-11-11T17:00:00Z'
          revoked_at: null
    AuditEvent:
      type: object
      required: [event_id, seq, occurred_at, actor_kind, actor_id, actor_display_name, actor_roles, delegation_id, action_id, event_type, object_type, object_id, outcome, reason, before, after, detail, masked, correlation_id, request_id, source_service, locale, hash, access_metadata]
      properties:
        event_id: {type: string, format: uuid}
        seq: {type: string, pattern: '^[0-9]+$'}
        occurred_at: {type: string, format: date-time}
        actor_kind:
          type: string
          enum: [user, service, anonymous]
          description: anonymous has no writer in this build and is kept until 109-F5 PQ-78 is answered (with 109-F2 PQ-48 and 109-F5 PQ-67)
        actor_id: {type: [string, 'null'], format: uuid}
        actor_display_name:
          type: [string, 'null']
          description: The actor's display name, looked up when the event is read and not part of the hashed event (109-F5-FR12, PQ-73); null for a service actor or an unknown user
        actor_roles: {type: array, items: {$ref: '#/components/schemas/RoleId'}}
        delegation_id: {type: [string, 'null'], format: uuid}
        action_id: {type: [string, 'null'], pattern: '^P[0-9]{2}$'}
        event_type:
          type: string
          description: A type of the event type catalog of 109-F5 (data model section 7), which also says which types admin may read (PQ-74)
        object_type: {type: [string, 'null']}
        object_id: {type: [string, 'null']}
        outcome: {$ref: '#/components/schemas/Outcome'}
        reason: {type: [string, 'null']}
        before: {type: [object, 'null']}
        after: {type: [object, 'null']}
        detail:
          type: [object, 'null']
          description: >
            Members named per event type in the 109-F5 catalog (S1011). An AI suggestion produced (ai.suggestion)
            holds operation, model, prompt_template and sources; the human outcome of a suggestion (ai.confirm) holds
            suggested, final, model, prompt_template, sources, confirmed_by and decision (confirmed, edited or
            rejected); an approval decision holds maker and checker. Never a password, token or key.
        masked: {type: boolean, description: 'True when before, after and detail are withheld (confidential record without grant)'}
        correlation_id: {type: string, format: uuid}
        request_id: {type: [string, 'null'], format: uuid}
        source_service: {type: string}
        locale: {type: [string, 'null']}
        hash: {type: string, description: Hex SHA-256 of the event in the chain}
        access_metadata:
          type: [object, 'null']
          description: Client IP and user agent of sign-in and write events, kept one year and not part of the hashed
            event (109-F5-FR3, Q-120); null for other events, or after the retention job removed them
          additionalProperties: false
          required: [client_ip, user_agent]
          properties:
            client_ip: {type: [string, 'null']}
            user_agent: {type: [string, 'null']}
      examples:
        - event_id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
          seq: '1842'
          occurred_at: '2026-11-09T09:14:03.120Z'
          actor_kind: user
          actor_id: 4c5d6e7f-8a9b-4c0d-9e1f-2a3b4c5d6e7f
          actor_display_name: Ana Petrovic
          actor_roles: [outsourcing-manager]
          delegation_id: null
          action_id: P53
          event_type: ai.confirm
          object_type: register:arrangement
          object_id: 2b7e1c4a-5d3f-4a8b-9c0e-1f2a3b4c5d6e
          outcome: allowed
          reason: null
          before: {B_02.01.0070: null}
          after: {B_02.01.0070: '2026-12-01'}
          detail: {suggested: '2026-12-01', final: '2026-12-01', model: claude, prompt_template: contract-read-v1, sources: ['contract-p3-s2'], confirmed_by: 4c5d6e7f-8a9b-4c0d-9e1f-2a3b4c5d6e7f, decision: confirmed}
          masked: false
          correlation_id: 8d9e0f1a-2b3c-4d4e-9f5a-6b7c8d9e0f1a
          request_id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
          source_service: register-service
          locale: sr-Latn
          hash: 9f2c4e6a8b0d1f3e5a7c9e1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f1a3c5e7b9d1f
          access_metadata: {client_ip: 192.0.2.10, user_agent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
    AuditFilter:
      type: object
      additionalProperties: false
      properties:
        from: {type: [string, 'null'], format: date-time}
        to: {type: [string, 'null'], format: date-time}
        actor_id: {type: [string, 'null'], format: uuid}
        action_id: {type: [string, 'null'], pattern: '^P[0-9]{2}$'}
        event_type: {type: [string, 'null']}
        object_type: {type: [string, 'null']}
        object_id: {type: [string, 'null']}
        outcome: {type: [string, 'null'], enum: [allowed, denied, error, null]}
        correlation_id: {type: [string, 'null'], format: uuid}
      examples:
        - {correlation_id: 8d9e0f1a-2b3c-4d4e-9f5a-6b7c8d9e0f1a}
    AuditVerification:
      type: object
      required: [id, run_kind, from_seq, to_seq, result, first_break_seq, head_hash, run_at]
      properties:
        id: {type: string, format: uuid}
        run_kind:
          type: string
          enum: [daily, on_demand]
          description: daily for the run of the daily job, on_demand for a run requested through verifyAuditChain (109-F5-FR5, FR7)
        from_seq: {type: string, pattern: '^[0-9]+$'}
        to_seq: {type: string, pattern: '^[0-9]+$'}
        result: {type: string, enum: [intact, broken]}
        first_break_seq: {type: [string, 'null'], pattern: '^[0-9]+$'}
        head_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hash of the event at to_seq when intact; 64 zeros for an empty chain (109-F5 PQ-79)
        run_at: {type: string, format: date-time}
      examples:
        - id: 2d3e4f5a-6b7c-4d8e-9f0a-1b2c3d4e5f6a
          run_kind: daily
          from_seq: '1'
          to_seq: '1842'
          result: intact
          first_break_seq: null
          head_hash: 9f2c4e6a8b0d1f3e5a7c9e1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f1a3c5e7b9d1f
          run_at: '2026-11-09T10:00:00Z'
    AuditExport:
      type: object
      required: [id, state, filter, created_at, failure_reason, manifest]
      properties:
        id: {type: string, format: uuid}
        state: {type: string, enum: [queued, running, done, failed]}
        filter: {$ref: '#/components/schemas/AuditFilter'}
        created_at: {type: string, format: date-time}
        failure_reason:
          type: [string, 'null']
          enum: [too_large, requester_not_permitted, internal_error, null]
          description: >
            Set only when state is failed. too_large: a file would exceed the stored-file limit, narrow the filter
            (109-F5 PQ-85); requester_not_permitted: the requester was no longer an active user holding P69 when the
            job started (109-F5 PQ-71); internal_error: any other failure, audited with outcome error (109-F5-FR8)
        manifest:
          type: [object, 'null']
          required: [event_count, first_seq, last_seq, head_seq, head_hash, generated_at, files]
          properties:
            event_count: {type: integer, minimum: 0}
            first_seq: {type: [string, 'null']}
            last_seq: {type: [string, 'null']}
            head_seq:
              type: string
              pattern: '^[0-9]+$'
              description: Tenant's last sequence when the export read the trail, before the export's own audit event; the files hold matching events up to it
            head_hash:
              type: string
              description: Chain hash of the event at head_seq; verifyAuditChain from 1 to head_seq reports it
            generated_at: {type: string, format: date-time}
            files:
              type: array
              description: One entry per format, csv first; no path or link (109-F5 PQ-70); download with getAuditExportFile
              items:
                type: object
                required: [format, name, sha256, bytes]
                properties:
                  format: {type: string, enum: [csv, jsonl]}
                  name: {type: string, enum: [audit-export.csv, audit-export.jsonl]}
                  sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
                  bytes: {type: integer, minimum: 0}
      examples:
        - id: 3e4f5a6b-7c8d-4e9f-a0b1-c2d3e4f5a6b8
          state: done
          filter: {correlation_id: 8d9e0f1a-2b3c-4d4e-9f5a-6b7c8d9e0f1a}
          created_at: '2026-11-09T10:04:58Z'
          failure_reason: null
          manifest:
            event_count: 57
            first_seq: '1790'
            last_seq: '1842'
            head_seq: '1842'
            head_hash: 9f2c4e6a8b0d1f3e5a7c9e1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f1a3c5e7b9d1f
            generated_at: '2026-11-09T10:05:00Z'
            files:
              - {format: csv, name: audit-export.csv, sha256: 4b6d8f0a1c3e5b7d9f1a3c5e7b9d1f9f2c4e6a8b0d1f3e5a7c9e1b3d5f7a9c2e, bytes: 48213}
              - {format: jsonl, name: audit-export.jsonl, sha256: 1c3e5b7d9f1a3c5e7b9d1f9f2c4e6a8b0d1f3e5a7c9e1b3d5f7a9c2e4b6d8f0a, bytes: 91377}
    Problem:
      type: object
      required: [type, title, status, correlation_id]
      properties:
        type:
          type: string
          description: >
            The error code, the value clients switch on (api-standards section 5, conventions SA-1.2-10); one of
            the keys of x-error-codes. The 109-F1, 109-F2 and 109-F5 codes are kebab-case; the codes still in
            UPPER_SNAKE_CASE belong to 109-F3 and 109-F4 and are converted when those functionalities are regenerated
            (109-F1 plan PQ-18).
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        correlation_id: {type: string}
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: {type: string}
              message: {type: string}
      examples:
        - type: role-combination-refused
          title: Incompatible role combination
          status: 409
          detail: The proposed assignment would give the user auditor together with another role.
          correlation_id: 8d9e0f1a-2b3c-4d4e-9f5a-6b7c8d9e0f1a
  x-error-codes:
    no-role: {status: 403, title: No role assigned}
    not-in-matrix: {status: 403, title: Action not permitted for any held role}
    out-of-scope: {status: 403, title: Action outside the user's scope}
    role-combination-refused: {status: 409, title: Incompatible role combination}
    last-checking-admin: {status: 409, title: Change would leave no admin able to check mapping changes}
    validation-failed: {status: 422, title: Request fields are missing or invalid}
    demo-mode-off: {status: 404, title: Not found}
    sign-in-refused: {status: 403, title: Sign-in refused}
    not-found: {status: 404, title: Not found}
    audit-export-not-ready: {status: 409, title: The export is not done yet}
    retention-too-short: {status: 422, title: Audit retention below five years}
    PLATFORM_FOUR_EYES_VIOLATION: {status: 409, title: Four-eyes rule}
    PLATFORM_APPROVAL_STALE: {status: 409, title: Subject changed since approval was requested}
    PLATFORM_APPROVAL_NOT_PENDING: {status: 409, title: Approval already decided}
    PLATFORM_OWNING_SERVICE_UNAVAILABLE: {status: 503, title: Owning service unavailable; the approval stays pending}
    PLATFORM_REASON_REQUIRED: {status: 422, title: Reason required}
    PLATFORM_SELF_GRANT: {status: 422, title: Cannot grant to oneself}
    PLATFORM_GRANT_OUTSIDE_UNIT: {status: 422, title: Grantee outside the record's business unit}
    PLATFORM_RECORD_NOT_CONFIDENTIAL: {status: 409, title: Record is not marked confidential}
    PLATFORM_DELEGATION_INVALID: {status: 422, title: Delegation violates delegation rules}
    PLATFORM_EXPORT_SCOPE_NOT_READABLE: {status: 403, title: Export needs a user who can read all records in scope}
