  /api/v1/platform/approvals/{approval_id}/decide:
    post:
      operationId: decideApproval
      tags: [approvals]
      summary: >
        Approve or reject. The checker must hold a checker role for the kind or an active delegation and
        must not be the maker or an excluded identity. Approval applies the change in the owning service in
        the same transaction (109-F4 plan D6).
      description: >
        Response rule (109-F4-FR10, plan D6; Confirmed by Dusan 2026-11-06, Q-163). The handler reads
        the caller's relation to the approval with platform.approval_caller_relation (maker, excluded, checker
        or none, in that precedence). Before any owning service is called: relation none (neither a checker of
        the kind by role or active delegation, nor the maker, nor an excluded identity; for example an admin on
        any business kind, 109-F4-AC8) gives 403 not-in-matrix with the kind in the detail, audited
        with reason not_checker; a decided approval gives 409 PLATFORM_APPROVAL_NOT_PENDING; a reject without
        reason gives 422 PLATFORM_REASON_REQUIRED. The maker or an excluded identity, with or without a checker
        role, is never answered 403: the decision proceeds and is refused for four-eyes (109-F4-AC1). For a kind
        owned by register-service, ict-risk-service or monitoring-service the handler calls that service's
        applyApproval with the caller's identity and relays its Problem response unchanged (status, error code,
        detail), for example 409 REGISTER_FOUR_EYES, ICT_SELF_APPROVAL, ICT_RISK_CHANGED_SINCE_REQUEST or
        MON_SELF_APPROVAL. For the platform-owned kinds role_mapping_change and applicability_annotation_change
        a four-eyes refusal gives 409 PLATFORM_FOUR_EYES_VIOLATION and a changed subject 409
        PLATFORM_APPROVAL_STALE. When the owning service cannot be reached or does not answer in time and the
        approval is still pending, 503 PLATFORM_OWNING_SERVICE_UNAVAILABLE, audited with reason
        owning_service_unavailable; the approval stays pending. Every refusal, including the 403 and the 503,
        is audited and its audit is committed (109-F4 plan D6, D10).
      x-roles: [outsourcing-manager, security, it-governance, compliance, admin]
      x-action: P71
      x-surface: user
      x-audit-object: platform:approval
      x-scope: DEMO
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, reject]}
                reason: {type: [string, 'null'], maxLength: 2000, description: Required when decision is reject}
              examples:
                - {decision: reject, reason: Exit plan clause still missing}
      responses:
        '200':
          description: Decided approval
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
        '503': {$ref: '#/components/responses/Problem'}
        default: {$ref: '#/components/responses/Problem'}

