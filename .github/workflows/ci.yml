# CI of the Wiser Compliance Register (111-FR2, 111-FR22; plan D1, D18).
# The job `required` is the one status check branch protection requires on main. In block 1 it needs
# install and the suites (the registry, one job per suite, and the registry check, which reads the
# JUnit XML reports the suite jobs wrote). Block 1b adds the Java quality job, the Java mutation gate,
# the repository checks and the pull request checks; block 1c adds the Python quality job and the Python
# mutation gate. The quality job of all three languages joins when block 1c lands, until then its
# targets fail and name the missing tool (OD-21).
# Suites come from the registry (every suites.yaml), so this file is not edited when a suite is added.
name: ci

on:
  pull_request:
    branches: [main]
    # edited reruns commitlint on the title and the size check on the body when either changes (T1.8).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: install from lock files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: read the uv pin
        id: pins
        run: echo "uv=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
      - name: install from lock files
        run: tools/install

  quality:
    name: lint, format check, type check, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: read the uv pin
        id: pins
        run: echo "uv=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
      - name: install from lock files
        run: tools/install
      - name: lint
        run: make lint
      - name: format check
        run: make format-check
      - name: type check
        run: make typecheck
      - name: unit tests
        run: make test

  # The Java format, lint, null and type checks and tests of block 1b (T1.5; OD-21).
  java:
    name: Java format check, lint, type check, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: lint
        run: tools/quality lint java
      - name: format check
        run: tools/quality format-check java
      - name: type check
        run: tools/quality typecheck java
      - name: unit tests
        run: tools/quality test java
      # Coverage is reported, never a gate (SA-3-5, T1.7).
      - name: keep the JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: java-coverage
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore

  # The Python format, lint, import contracts, strict type check and tests of block 1c (T1.9; OD-21).
  python:
    name: Python format check, lint, type check, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: read the uv pin
        id: pins
        run: echo "uv=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
      - name: lint
        run: tools/quality lint python
      - name: format check
        run: tools/quality format-check python
      - name: type check
        run: tools/quality typecheck python
      - name: unit tests
        run: tools/quality test python
      # Coverage is reported, never a gate (SA-3-5, T1.9).
      - name: keep the pytest-cov coverage reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-coverage
          path: coverage/python/
          if-no-files-found: ignore

  # mutmut on the Python modules the pull request changes; below the threshold of tdd-profile.yaml on the
  # changed domain and application modules the pull request fails (T1.9; OD-25).
  python-mutation:
    name: Python mutation gate on changed modules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: read the uv pin
        id: pins
        run: echo "uv=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
      - name: mutation gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: tools/python-mutation-gate --base "origin/$BASE_REF"

  # PIT on the Java classes the pull request changes; below the threshold of tdd-profile.yaml on the
  # changed domain and application classes the pull request fails (T1.7; OD-25).
  java-mutation:
    name: Java mutation gate on changed classes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - name: read the uv pin
        id: pins
        run: echo "uv=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
      - name: mutation gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: tools/mutation-gate --base "origin/$BASE_REF"
      - name: keep the PIT reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: java-mutation
          path: "**/target/pit-reports/"
          if-no-files-found: ignore

  # Secrets, security patterns and the Renovate configuration of the whole repository (T1.8).
  repository:
    name: secrets, Semgrep, Renovate configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
      - name: read the uv pin
        id: pins
        run: echo "uv=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
      - name: secrets
        run: tools/gitleaks
      - name: security patterns and custom rules
        run: tools/semgrep
      - name: Renovate configuration
        run: tools/check-renovate-config

  # The branch name, the title and the size of a pull request (T1.8; SA-1.2-14, SA-1.2-15,
  # SA-2.3-6, SA-2.3-7). The pull request body is read from the event, never pasted into a command.
  pull-request:
    name: branch name, pull request title, pull request size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: read the uv pin
        id: pins
        run: echo "uv=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
      - name: install from lock files
        run: npm ci
      - name: branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: tools/check-branch-name "$HEAD_REF"
      # Blocks land on main by squash merge, one commit whose message is the pull request title, so
      # commitlint checks the title, not every commit of the branch (OD-27).
      - name: pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no -- commitlint --verbose
      - name: pull request size
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pull-request-body.md"
          tools/check-pr-size --base "origin/$BASE_REF" --body-file "$RUNNER_TEMP/pull-request-body.md"

  registry:
    name: suites registry
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: read the uv pin
        id: pins
        run: echo "uv=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
      - name: list the registered suites
        id: matrix
        run: echo "matrix=$(tools/suite --matrix)" >> "$GITHUB_OUTPUT"

  suites:
    name: suite ${{ matrix.suite }}
    needs: registry
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.registry.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: read the uv pin
        id: pins
        run: echo "uv=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
      - name: install from lock files
        run: |
          npm ci
          uv sync --project tools --frozen
      - name: start the stack on the runner
        if: matrix.stack
        run: make stack-up
      - name: run the suite
        run: make suite S=${{ matrix.suite }}
      - name: keep the JUnit XML reports of the suite
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: suite-reports-${{ matrix.suite }}
          path: .suite-reports/
          include-hidden-files: true
          if-no-files-found: ignore
      - name: stop the stack
        if: always() && matrix.stack
        run: make stack-down

  check:
    name: suites registry check
    if: always()
    needs: [registry, suites]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: read the uv pin
        id: pins
        run: echo "uv=$(cat .uv-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ steps.pins.outputs.uv }}
      # The tasks.md checks are required: without vars.SPEC_REPO this job fails (111-FR22, 111-AC22).
      - name: check out the spec repository
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ vars.SPEC_REPO }}
          token: ${{ secrets.SPEC_REPO_TOKEN }}
          path: .spec-repo
      # Only tests that ran count: the check reads the reports of every suite job (plan D18).
      - name: collect the JUnit XML reports of every suite
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: suite-reports-*
          path: .suite-reports
          merge-multiple: true
      # A pull request also checks the block its branch builds, although its tasks are not ticked yet:
      # the branch is <lane>/<functionality>-<block> (conventions SA-1.2-14), and its last part names
      # the block's suite in any case; a branch naming no block fails (111-AC22, OD-23).
      # A push to main checks the ticked blocks only.
      - name: check the registry against every tasks.md
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ ! -d .spec-repo/specs ]; then
            echo "::error::.spec-repo has no specs folder; set vars.SPEC_REPO to the spec repository"
            exit 1
          fi
          mv .spec-repo "$RUNNER_TEMP/spec-repo"
          block_arguments=()
          if [ -n "${HEAD_REF:-}" ]; then
            block_arguments=(--block "${HEAD_REF##*/}")
          fi
          tools/check-suites $(printf -- '--tasks %s ' "$RUNNER_TEMP"/spec-repo/specs/*/tasks.md) \
            ${block_arguments[@]+"${block_arguments[@]}"}

  browser:
    name: web build and browser specs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: install from lock files
        run: npm ci
      - name: build the web
        if: hashFiles('apps/web/package.json') != ''
        run: npm run build --workspace=apps/web
      - name: start the stack on the runner
        if: hashFiles('apps/web/package.json') != '' && hashFiles('deploy/scripts/dev-stack.sh') != ''
        run: make stack-up
      - name: run the browser specs
        if: hashFiles('apps/web/package.json') != ''
        run: |
          npm exec --workspace=apps/web -- playwright install --with-deps chromium
          npm exec --workspace=apps/web -- playwright test
      - name: stop the stack
        if: always() && hashFiles('apps/web/package.json') != '' && hashFiles('deploy/scripts/dev-stack.sh') != ''
        run: make stack-down

  required:
    name: required
    if: always()
    needs: [install, java, java-mutation, python, python-mutation, repository, pull-request, registry, suites, check]
    runs-on: ubuntu-24.04
    steps:
      - name: every job passed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "a required job failed or was cancelled"
            exit 1
          fi
